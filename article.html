<!DOCTYPE html>
<html lang="zh-CN">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
文章详情
</title>



<link rel="stylesheet" href="css/style.css">



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{


margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial,
sans-serif;


}





.header{


height:70px;

background:#222;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;


}




.logo{


font-size:24px;

font-weight:bold;


}





.back-btn{


color:white;

background:#1976d2;

padding:8px 15px;

border-radius:5px;

text-decoration:none;


}







.article-container{


max-width:900px;

background:white;

margin:40px auto;

padding:40px;

border-radius:12px;


}





.article-title{


font-size:36px;

line-height:1.4;

margin-bottom:20px;


}





.article-info{


color:#888;

font-size:14px;

border-bottom:1px solid #eee;

padding-bottom:20px;

margin-bottom:30px;


}





.cover{


width:100%;

max-height:500px;

object-fit:cover;

border-radius:10px;

margin-bottom:30px;


}





.content{


font-size:18px;

line-height:2;

color:#333;


}





.content img{


max-width:100%;

height:auto;

display:block;

margin:20px auto;

border-radius:8px;


}





.content h1,
.content h2,
.content h3{


margin-top:35px;


}





.content blockquote{


border-left:5px solid #1976d2;

padding-left:20px;

color:#666;

background:#f7f7f7;

padding-top:10px;

padding-bottom:10px;


}





.content pre{


background:#272822;

color:white;

padding:20px;

border-radius:8px;

overflow-x:auto;


}





@media(max-width:700px){



.article-container{


margin:20px 10px;

padding:20px;


}



.article-title{


font-size:28px;


}


}




</style>



</head>





<body>



<header class="header">


<div class="logo">

qwe个人博客

</div>


<a class="back-btn" href="index.html">

返回首页

</a>


</header>







<div id="article" class="article-container">


正在加载文章...


</div>









<script>




const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();






// 获取文章ID


const params =
new URLSearchParams(
window.location.search
);



const id =
params.get("id");






if(!id){


document.getElementById("article")
.innerHTML=

"文章不存在";


}

else{


loadArticle();


}








function loadArticle(){



db.collection("articles")

.doc(id)

.get()


.then(doc=>{



if(!doc.exists){



document.getElementById("article")
.innerHTML=

"找不到该文章";


return;


}



let data=
doc.data();






document.getElementById("article")
.innerHTML=

`



<h1 class="article-title">

${data.title}

</h1>




<div class="article-info">

作者：

${data.author || "管理员"}

&nbsp;&nbsp;&nbsp;

发布时间：

${data.time}


</div>





${

data.cover

?

`

<img class="cover"

src="${data.cover}">

`

:

""

}





<div class="content">


${data.content}


</div>



`;





})


.catch(error=>{


document.getElementById("article")
.innerHTML=

"加载失败："+error.message;


});



}




</script>





</body>

</html>
