<!DOCTYPE html>
<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
文章阅读
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

}



.container{

max-width:900px;

margin:40px auto;

background:white;

padding:40px;

border-radius:10px;

}



.top{

display:flex;

justify-content:space-between;

margin-bottom:30px;

}



.title{

font-size:36px;

font-weight:bold;

margin-bottom:20px;

}



.info{

color:#777;

font-size:14px;

line-height:2;

border-bottom:1px solid #eee;

padding-bottom:20px;

}



.content{


font-size:18px;

line-height:2;

margin-top:30px;

}



.content img{

max-width:100%;

}



.history{

margin-top:40px;

background:#f8f8f8;

padding:20px;

border-radius:8px;

}



button{

padding:10px 18px;

cursor:pointer;

}



</style>



</head>



<body>




<div class="container">





<div class="top">


<a href="index.html">


<button>

返回首页

</button>


</a>



<a href="archive.html">


<button>

文章列表

</button>


</a>



</div>






<div id="article">


加载中...

</div>






</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();






// 获取文章ID


let params =
new URLSearchParams(
location.search
);



let articleId =
params.get("id");








if(!articleId){


document.getElementById(
"article"
)
.innerHTML=

"文章不存在";


}

else{


loadArticle();


}









function loadArticle(){



db.collection("articles")

.doc(articleId)

.get()



.then(doc=>{



if(!doc.exists){


document.getElementById(
"article"
)

.innerHTML=

"文章不存在";


return;


}





let data =
doc.data();








let html=`


<div class="title">

${data.title}

</div>



<div class="info">


发布时间：

${formatTime(data.createTime)}


<br>


作者：

${data.author || "管理员"}



<br>


最后编辑：

${lastUpdate(data.updateTime)}



</div>





<div class="content">


${data.content}


</div>





`;








if(
data.updateTime &&
data.updateTime.length>1
){



html+=`


<div class="history">


<h3>

编辑记录

</h3>


<ul>


`;





data.updateTime.forEach(t=>{


html+=`

<li>

${t}

</li>

`;



});





html+=`

</ul>


</div>


`;



}






document.getElementById(
"article"
)

.innerHTML=html;



})



.catch(error=>{


document.getElementById(
"article"
)

.innerHTML=

"加载失败："+error.message;



});



}









function formatTime(time){


if(time && time.toDate){


return time.toDate()

.toLocaleString(
"zh-CN"
);


}



return "";



}








function lastUpdate(list){



if(
list &&
list.length>0
){


return list[list.length-1];


}



return "暂无";



}



</script>



</body>


</html>
