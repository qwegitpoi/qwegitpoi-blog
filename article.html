<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 - Rogue</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
    .prose h1 { font-size: 1.35rem; font-weight: 700; margin-top: 1.2rem; margin-bottom: 0.5rem; color: #1e293b; }
    .prose h2 { font-size: 1.15rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.4rem; color: #1e293b; }
    .prose h3 { font-size: 1.05rem; font-weight: 600; margin-top: 0.8rem; margin-bottom: 0.3rem; color: #1e293b; }
    .prose p { margin-bottom: 0.8rem; line-height: 1.65; color: #334155; font-size: 0.925rem; }
    .prose ul { list-style-type: disc; padding-left: 1.2rem; margin-bottom: 0.8rem; font-size: 0.925rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.2rem; margin-bottom: 0.8rem; font-size: 0.925rem; }
    .prose code { background: #f1f5f9; color: #2563eb; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.85em; }
    .prose pre { background: #0f172a; color: #f8fafc; padding: 0.85rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.8rem; font-size: 0.85rem; }
    .prose blockquote { border-left: 3px solid #3b82f6; padding-left: 0.8rem; color: #64748b; font-style: italic; margin-bottom: 0.8rem; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="glass-header sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-base sm:text-lg font-bold text-slate-800 hover:text-blue-600 transition">
        <i class="fa-solid fa-book-open text-blue-600"></i>
        <span>Rogue</span>
      </a>
      <nav class="flex items-center space-x-2 sm:space-x-3 text-xs sm:text-sm font-medium">
        <a href="index.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">首页</a>
        <a href="all-articles.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">全部</a>
        <a href="featured.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">★ 精选</a>
        <a href="contact.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">📩 私信</a>
      </nav>
    </div>
  </header>

  <main class="max-w-4xl mx-auto px-3 sm:px-6 py-4 sm:py-6 w-full flex-grow">
    
    <div class="mb-3">
      <a href="javascript:history.back()" class="inline-flex items-center text-xs font-medium text-slate-500 hover:text-blue-600 transition">
        <i class="fa-solid fa-arrow-left me-1.5"></i> 返回上一页
      </a>
    </div>

    <div id="article-container" class="bg-white rounded-xl p-4 sm:p-8 border border-slate-100 shadow-sm mb-5">
      <div class="text-center py-12">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-600 mb-2"></i>
        <p class="text-slate-500 text-xs">正在读取文章内容...</p>
      </div>
    </div>

    <div id="interaction-box" class="bg-white rounded-xl p-2.5 border border-slate-100 shadow-sm mb-5 hidden">
      <div class="flex items-center justify-center gap-2 sm:gap-6 text-center">
        <button onclick="handleLike()" class="flex flex-col items-center justify-center p-1.5 rounded-lg border border-slate-100 hover:bg-blue-50/50 transition w-16 sm:w-20">
          <i class="fa-solid fa-thumbs-up text-sm sm:text-base text-blue-500 mb-0.5"></i>
          <span class="text-[10px] sm:text-xs text-slate-600">赞 <span id="like-count">0</span></span>
        </button>

        <button onclick="handleDislike()" class="flex flex-col items-center justify-center p-1.5 rounded-lg border border-slate-100 hover:bg-rose-50/50 transition w-16 sm:w-20">
          <i class="fa-solid fa-thumbs-down text-sm sm:text-base text-rose-500 mb-0.5"></i>
          <span class="text-[10px] sm:text-xs text-slate-600">踩 <span id="dislike-count">0</span></span>
        </button>

        <button onclick="toggleFavorite()" id="favorite-btn" class="flex flex-col items-center justify-center p-1.5 rounded-lg border border-slate-100 hover:bg-amber-50/50 transition w-16 sm:w-20">
          <i id="fav-icon" class="fa-regular fa-star text-sm sm:text-base text-amber-500 mb-0.5"></i>
          <span id="fav-text" class="text-[10px] sm:text-xs text-slate-600">收藏</span>
        </button>

        <button onclick="shareArticle()" class="flex flex-col items-center justify-center p-1.5 rounded-lg border border-slate-100 hover:bg-emerald-50/50 transition w-16 sm:w-20">
          <i class="fa-solid fa-share-nodes text-sm sm:text-base text-emerald-500 mb-0.5"></i>
          <span class="text-[10px] sm:text-xs text-slate-600">分享</span>
        </button>
      </div>
    </div>

    <section id="comments-section" class="bg-white rounded-xl p-4 sm:p-6 border border-slate-100 shadow-sm hidden">
      <h3 class="text-sm sm:text-base font-bold text-slate-800 mb-3 flex items-center">
        <i class="fa-solid fa-comments text-blue-600 me-1.5"></i> 文章留言区
      </h3>

      <form id="comment-form" onsubmit="submitComment(event)" class="space-y-2.5 mb-5 bg-slate-50 p-3 rounded-lg border border-slate-200/60">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">昵称 *</label>
            <input type="text" id="comment-author" required placeholder="请输入您的昵称" class="w-full px-2 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
          </div>
          <div>
            <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">联系方式 (选填)</label>
            <input type="text" id="comment-contact" placeholder="邮箱或网址" class="w-full px-2 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white">
          </div>
        </div>

        <div>
          <label class="block text-[11px] font-semibold text-slate-600 mb-0.5">留言内容 *</label>
          <textarea id="comment-content" rows="2" required placeholder="欢迎理性交流探讨..." class="w-full px-2 py-1 text-xs border border-slate-300 rounded focus:outline-none focus:ring-1 focus:ring-blue-500 bg-white"></textarea>
        </div>

        <div class="flex items-center justify-between pt-1">
          <div class="flex items-center space-x-3 text-xs text-slate-600">
            <label class="flex items-center space-x-1 cursor-pointer">
              <input type="radio" name="visibility" value="public" checked class="text-blue-600">
              <span class="text-[11px]">公开</span>
            </label>
            <label class="flex items-center space-x-1 cursor-pointer">
              <input type="radio" name="visibility" value="private" class="text-blue-600">
              <span class="text-amber-700 font-medium text-[11px]"><i class="fa-solid fa-lock text-[10px]"></i> 仅博主可见</span>
            </label>
          </div>

          <button type="submit" id="submit-btn" class="px-3.5 py-1 bg-blue-600 hover:bg-blue-700 text-white text-xs rounded transition flex items-center shadow-sm">
            <i class="fa-solid fa-paper-plane me-1"></i> 发送
          </button>
        </div>
      </form>

      <div id="comments-list" class="space-y-2">
        <p class="text-xs text-slate-400 text-center py-2">正在加载留言...</p>
      </div>
    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-3 text-center text-[11px] text-slate-500">
    <p>© 2026 我的个人博客. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qwegitpoi-blog",
      storageBucket: "qwegitpoi-blog.firebasestorage.app",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963",
      measurementId: "G-M01JQCZ0WX"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    const articleId = new URLSearchParams(window.location.search).get('id');
    let dbCollection = "posts";
    let isAdmin = false;

    // ⭐ 与 all-articles.html 保持完全一致的超强时间戳解析器
    function getArticleTimestamp(data) {
      if (!data || typeof data !== 'object') return 0;
      const raw = data.createdAt || data.created_at || data.createTime || data.create_time || data.created ||
                  data.publishedAt || data.published_at || data.pubDate || data.pub_date ||
                  data.timestamp || data.date || data.time || data.datetime ||
                  data.updatedAt || data.updated_at;

      if (raw === undefined || raw === null) return 0;

      try {
        if (typeof raw.toDate === 'function') {
          const d = raw.toDate();
          if (d && !isNaN(d.getTime())) return d.getTime();
        }
        if (raw instanceof Date) {
          if (!isNaN(raw.getTime())) return raw.getTime();
        }
        if (typeof raw === 'object') {
          const secs = raw.seconds !== undefined ? raw.seconds : raw._seconds;
          if (typeof secs === 'number') return secs * 1000;
        }
        if (typeof raw === 'number') {
          if (isNaN(raw)) return 0;
          return raw < 1e11 ? raw * 1000 : raw;
        }
        if (typeof raw === 'string') {
          const trimmed = raw.trim();
          if (!trimmed) return 0;
          if (/^\d+$/.test(trimmed)) {
            const num = Number(trimmed);
            return num < 1e11 ? num * 1000 : num;
          }
          const formattedStr = trimmed.replace(/-/g, '/').replace('T', ' ').replace('Z', '');
          const d = new Date(formattedStr);
          if (!isNaN(d.getTime())) return d.getTime();
          const d2 = new Date(trimmed);
          if (!isNaN(d2.getTime())) return d2.getTime();
        }
      } catch (e) {
        console.error("时间戳解析异常:", e);
      }
      return 0;
    }

    function parseArticleDate(data) {
      const ts = getArticleTimestamp(data);
      if (ts > 0) {
        const d = new Date(ts);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }
      if (data && typeof data === 'object') {
        for (const key of ['date', 'time', 'createdAt', 'created_at', 'publishedAt']) {
          if (typeof data[key] === 'string' && data[key].trim() !== '') {
            return data[key].trim();
          }
        }
      }
      return "暂无时间";
    }

    function parseArticleTag(data) {
      if (!data) return "随笔";
      let t = data.tag || data.category || data.tags || data.categories;
      if (Array.isArray(t)) return t.length > 0 ? t[0] : "随笔";
      if (typeof t === 'string' && t.trim() !== '') return t.trim();
      return "随笔";
    }

    async function initPage() {
      const container = document.getElementById('article-container');

      if (!articleId) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">无法检索文章：URL 参数缺失</div>`;
        return;
      }

      auth.onAuthStateChanged(user => {
        isAdmin = !!user;
        loadComments();
      });

      try {
        let snap = await db.collection("posts").doc(articleId).get();
        if (!snap.exists) {
          snap = await db.collection("articles").doc(articleId).get();
          dbCollection = "articles";
        }

        if (!snap.exists) throw new Error("该文章不存在或已被删除");

        const data = snap.data();
        if (data.hide === true || data.status === 'hidden' || data.isHidden === true) {
          container.innerHTML = `<div class="text-center py-8 text-xs text-slate-500">🔒 文章已被博主设为隐藏</div>`;
          return;
        }

        const dateStr = parseArticleDate(data);
        const tag = parseArticleTag(data);
        const contentHtml = window.marked ? marked.parse(data.content || '') : (data.content || '');

        container.innerHTML = `
          <header class="border-b border-slate-100 pb-3 mb-4">
            <div class="flex items-center space-x-2 text-xs text-slate-400 mb-2">
              <span class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-medium">${tag}</span>
              <span>•</span>
              <span><i class="fa-regular fa-calendar-alt me-1"></i>${dateStr}</span>
            </div>
            <h1 class="text-lg sm:text-xl font-bold text-slate-800 leading-snug">
              ${data.title || "无标题文章"}
            </h1>
          </header>
          <div class="prose max-w-none">${contentHtml}</div>
        `;

        document.getElementById('like-count').innerText = data.likes || 0;
        document.getElementById('dislike-count').innerText = data.dislikes || 0;
        checkFav();

        document.getElementById('interaction-box').classList.remove('hidden');
        document.getElementById('comments-section').classList.remove('hidden');

      } catch (err) {
        container.innerHTML = `<div class="text-center py-8 text-xs text-red-500">${err.message || '数据读取异常'}</div>`;
      }
    }

    async function handleLike() {
      const el = document.getElementById('like-count');
      el.innerText = (parseInt(el.innerText) || 0) + 1;
      db.collection(dbCollection).doc(articleId).update({ likes: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
    }

    async function handleDislike() {
      const el = document.getElementById('dislike-count');
      el.innerText = (parseInt(el.innerText) || 0) + 1;
      db.collection(dbCollection).doc(articleId).update({ dislikes: firebase.firestore.FieldValue.increment(1) }).catch(()=>{});
    }

    function checkFav() {
      const favs = JSON.parse(localStorage.getItem('fav_articles') || '[]');
      const isFav = favs.includes(articleId);
      document.getElementById('fav-icon').className = isFav ? "fa-solid fa-star text-sm sm:text-base text-amber-500 mb-0.5" : "fa-regular fa-star text-sm sm:text-base text-amber-500 mb-0.5";
      document.getElementById('fav-text').innerText = isFav ? "已收藏" : "收藏";
    }

    function toggleFavorite() {
      let favs = JSON.parse(localStorage.getItem('fav_articles') || '[]');
      favs = favs.includes(articleId) ? favs.filter(i => i !== articleId) : [...favs, articleId];
      localStorage.setItem('fav_articles', JSON.stringify(favs));
      checkFav();
    }

    function shareArticle() {
      navigator.clipboard.writeText(location.href).then(() => alert("链接已复制到剪贴板！"));
    }

    async function submitComment(e) {
      e.preventDefault();
      const author = document.getElementById('comment-author').value.trim();
      const contact = document.getElementById('comment-contact').value.trim();
      const content = document.getElementById('comment-content').value.trim();
      const isPrivate = document.querySelector('input[name="visibility"]:checked').value === 'private';
      const btn = document.getElementById('submit-btn');

      if (!author || !content) return;
      btn.disabled = true;
      btn.innerText = "发送中...";

      try {
        await db.collection("comments").add({
          articleId: articleId,
          author: author,
          contact: contact,
          content: content,
          isPrivate: isPrivate,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('comment-form').reset();
        alert("留言成功！");
        loadComments();
      } catch (err) {
        console.error("提交留言失败：", err);
        alert("留言失败：" + (err.message.includes("permission") ? "Firebase 数据库拒绝写入权限，请检查 Firestore Rules 配置" : err.message));
      } finally {
        btn.disabled = false;
        btn.innerHTML = `<i class="fa-solid fa-paper-plane me-1"></i> 发送`;
      }
    }

    async function loadComments() {
      const container = document.getElementById('comments-list');
      if (!articleId) return;

      try {
        const snap = await db.collection("comments").where("articleId", "==", articleId).get();
        if (snap.empty) {
          container.innerHTML = `<p class="text-[11px] text-slate-400 text-center py-2">暂无留言，抢先发表第一条吧！</p>`;
          return;
        }

        let comments = [];
        snap.forEach(doc => comments.push({ id: doc.id, ...doc.data() }));

        comments.sort((a, b) => getArticleTimestamp(b) - getArticleTimestamp(a));

        let html = '';
        comments.forEach(c => {
          const dateStr = parseArticleDate(c);
          if (c.isPrivate && !isAdmin) {
            html += `
              <div class="p-2 rounded bg-amber-50 border border-amber-100 text-[11px] text-amber-800 flex items-center space-x-1">
                <i class="fa-solid fa-lock text-amber-600"></i>
                <span>🔒 该留言仅博主可见</span>
              </div>`;
            return;
          }

          html += `
            <div class="p-2.5 rounded bg-slate-50 border border-slate-100 text-xs space-y-1">
              <div class="flex items-center justify-between text-slate-500">
                <span class="font-bold text-slate-700">${c.author} ${c.isPrivate ? '<span class="text-amber-600 font-normal">[🔒 仅博主可见]</span>' : ''}</span>
                <span class="text-[10px] text-slate-400">${dateStr}</span>
              </div>
              <p class="text-slate-700 leading-relaxed text-[11px]">${c.content}</p>
            </div>`;
        });

        container.innerHTML = html;
      } catch (err) {
        console.error("加载留言报错：", err);
        container.innerHTML = `<p class="text-[11px] text-red-400 text-center py-2">留言加载失败：权限缺失或配置错误</p>`;
      }
    }

    window.addEventListener('DOMContentLoaded', initPage);
  </script>
</body>
</html>
