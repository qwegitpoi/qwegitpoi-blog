<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情 - Rogue Blog</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
    .prose h1 { font-size: 1.35rem; font-weight: 700; margin-top: 1.2rem; margin-bottom: 0.5rem; color: #1e293b; }
    .prose h2 { font-size: 1.15rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.4rem; color: #1e293b; }
    .prose h3 { font-size: 1rem; font-weight: 600; margin-top: 0.8rem; margin-bottom: 0.3rem; color: #334155; }
    .prose p { margin-bottom: 0.75rem; line-height: 1.6; font-size: 0.9rem; }
    .prose ul { list-style-type: disc; padding-left: 1.2rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .prose ol { list-style-type: decimal; padding-left: 1.2rem; margin-bottom: 0.75rem; font-size: 0.9rem; }
    .prose code { background-color: #f1f5f9; color: #0284c7; padding: 0.15rem 0.3rem; rounded: 0.2rem; font-size: 0.8rem; }
    .prose pre { background-color: #1e293b; color: #f8fafc; padding: 0.75rem; rounded: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; }
    .prose pre code { background-color: transparent; color: inherit; padding: 0; }
    .prose blockquote { border-left: 3px solid #cbd5e1; padding-left: 0.75rem; color: #64748b; italic: true; margin-bottom: 0.75rem; }
    .prose img { max-width: 100%; height: auto; border-radius: 0.375rem; margin: 0.75rem 0; }
    .prose a { color: #2563eb; text-decoration: underline; }
  </style>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
</head>
<body class="min-h-screen flex flex-col">

  <header class="sticky top-0 z-50 glass-header">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-slate-700 hover:text-blue-600 transition text-sm font-medium">
        <i class="fa-solid fa-arrow-left text-xs"></i>
        <span>返回首页</span>
      </a>
      <span class="text-base font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent">
        Rogue Blog
      </span>
      <div class="w-16"></div>
    </div>
  </header>

  <main class="flex-1 max-w-3xl w-full mx-auto px-4 py-6">
    <div id="loading" class="text-center py-12 text-slate-400 text-sm">
      <i class="fa-solid fa-spinner fa-spin mr-2"></i>正在加载文章内容...
    </div>

    <article id="article-container" class="hidden bg-white rounded-xl border border-slate-200/80 shadow-sm p-5 sm:p-7 mb-6">
      <div class="border-b border-slate-100 pb-4 mb-5">
        <div class="flex items-center space-x-2 mb-2">
          <span id="article-tag" class="px-2 py-0.5 text-xs font-semibold text-blue-600 bg-blue-50 rounded-md border border-blue-100">
            随笔
          </span>
          <span id="article-date" class="text-xs text-slate-400 font-mono">
            2026/01/01
          </span>
        </div>
        <h1 id="article-title" class="text-xl sm:text-2xl font-bold text-slate-900 leading-snug">
          加载中...
        </h1>
      </div>

      <div id="article-content" class="prose max-w-none text-slate-700"></div>

      <div class="mt-8 pt-6 border-t border-slate-100 grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
        <div id="prev-article" class="p-3 rounded-lg border border-slate-100 bg-slate-50/50 hover:bg-slate-100/80 transition flex flex-col justify-center">
          <span class="text-slate-400 mb-1 flex items-center gap-1"><i class="fa-solid fa-chevron-left text-[10px]"></i> 上一篇</span>
          <span class="text-slate-400 italic">已是最新文章</span>
        </div>
        <div id="next-article" class="p-3 rounded-lg border border-slate-100 bg-slate-50/50 hover:bg-slate-100/80 transition flex flex-col justify-center text-right">
          <span class="text-slate-400 mb-1 flex items-center justify-end gap-1">下一篇 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
          <span class="text-slate-400 italic">已是最后一篇</span>
        </div>
      </div>
    </article>

    <section id="comment-section" class="hidden bg-white rounded-xl border border-slate-200/80 shadow-sm p-5 sm:p-7">
      <h3 class="text-base font-bold text-slate-800 mb-4 flex items-center space-x-2 border-b border-slate-100 pb-3">
        <i class="fa-regular fa-comments text-blue-500"></i>
        <span>互动留言</span>
      </h3>

      <div id="comment-list" class="space-y-3 mb-6">
        <div class="text-center py-4 text-slate-400 text-xs">暂无留言，快来抢沙发吧~</div>
      </div>

      <div class="border-t border-slate-100 pt-5">
        <h4 class="text-xs font-bold text-slate-600 mb-3 flex items-center gap-1">
          <i class="fa-solid fa-pen-to-square text-blue-500"></i> 发表留言
        </h4>
        <form id="comment-form" class="space-y-3">
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <input type="text" id="comment-author" placeholder="您的昵称 *" required class="w-full text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
            <input type="email" id="comment-email" placeholder="电子邮箱 (选填，不公开)" class="w-full text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition">
          </div>
          <textarea id="comment-content" rows="3" placeholder="写下您的留言内容..." required class="w-full text-xs px-3 py-2 rounded-lg border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition"></textarea>

          <div class="flex items-center justify-between pt-1">
            <label class="flex items-center space-x-1.5 text-xs text-slate-500 cursor-pointer select-none">
              <input type="checkbox" id="comment-private" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500 text-xs">
              <span>私密留言 (仅博主可见)</span>
            </label>

            <button type="submit" id="submit-btn" class="px-4 py-1.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-medium rounded-lg shadow-sm transition flex items-center space-x-1">
              <i class="fa-regular fa-paper-plane"></i>
              <span>提交留言</span>
            </button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <footer class="border-t border-slate-200 bg-white py-6 mt-auto">
    <div class="max-w-3xl mx-auto px-4 text-center text-xs text-slate-400">
      <p>© 2026 Rogue Blog. Powered by GitHub Pages & Firebase.</p>
    </div>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qwegitpoi-blog",
      storageBucket: "qwegitpoi-blog.firebasestorage.app",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963",
      measurementId: "G-M01JQCZ0WX"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();
    const auth = firebase.auth();

    let currentArticleId = '';
    let isAdmin = false;

    // 时间戳解析函数
    function getArticleTimestamp(data) {
      if (!data) return 0;
      const fields = ['createdAt', 'created_at', 'createTime', 'publishedAt', 'published_at', 'timestamp', 'date', 'time'];
      for (let field of fields) {
        let val = data[field];
        if (!val) continue;
        if (typeof val.toDate === 'function') {
          try { return val.toDate().getTime(); } catch(e){}
        }
        if (typeof val === 'object' && val.seconds !== undefined) {
          return val.seconds * 1000;
        }
        if (typeof val === 'number') {
          return val < 10000000000 ? val * 1000 : val;
        }
        if (typeof val === 'string') {
          let parsed = Date.parse(val.replace(/-/g, '/'));
          if (!isNaN(parsed)) return parsed;
        }
      }
      return 0;
    }

    // 时间格式化
    function parseArticleDate(data) {
      let ts = getArticleTimestamp(data);
      if (ts > 0) {
        let d = new Date(ts);
        let y = d.getFullYear();
        let m = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }
      return '近期发布';
    }

    // 标签解析函数
    function parseArticleTag(data) {
      if (!data) return '随笔';
      let tagVal = data.tag || data.category || data.tags || data.categories;
      if (Array.isArray(tagVal) && tagVal.length > 0) return tagVal[0];
      if (typeof tagVal === 'string' && tagVal.trim() !== '') return tagVal.trim();
      return '随笔';
    }

    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    // 加载上一篇 / 下一篇 导航
    async function loadNavigation(currentId, currentTs) {
      try {
        let docs = [];
        try {
          const snapshot = await db.collection("posts").get();
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
        } catch(e) {}

        if (docs.length === 0) {
          const snapshot = await db.collection("articles").get();
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
        }

        // 过滤隐藏文章
        let publicArticles = docs.filter(a => !(a.hide === true || a.status === 'hidden' || a.isHidden === true));

        // 按时间从新到旧排序
        publicArticles.sort((a, b) => getArticleTimestamp(b) - getArticleTimestamp(a));

        let index = publicArticles.findIndex(a => a.id === currentId);
        if (index === -1) return;

        const prevBox = document.getElementById('prev-article');
        const nextBox = document.getElementById('next-article');

        // 上一篇（比当前更新的文章：index - 1）
        if (index > 0) {
          let prev = publicArticles[index - 1];
          prevBox.innerHTML = `
            <a href="article.html?id=${prev.id}" class="group block">
              <span class="text-slate-400 mb-1 flex items-center gap-1 group-hover:text-blue-600 transition"><i class="fa-solid fa-chevron-left text-[10px]"></i> 上一篇</span>
              <span class="font-bold text-slate-800 group-hover:text-blue-600 transition line-clamp-1">${prev.title || '无标题'}</span>
            </a>
          `;
        } else {
          prevBox.innerHTML = `
            <span class="text-slate-400 mb-1 flex items-center gap-1"><i class="fa-solid fa-chevron-left text-[10px]"></i> 上一篇</span>
            <span class="text-slate-400 italic">已是最新文章</span>
          `;
        }

        // 下一篇（比当前更旧的文章：index + 1）
        if (index < publicArticles.length - 1) {
          let next = publicArticles[index + 1];
          nextBox.innerHTML = `
            <a href="article.html?id=${next.id}" class="group block text-right">
              <span class="text-slate-400 mb-1 flex items-center justify-end gap-1 group-hover:text-blue-600 transition">下一篇 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
              <span class="font-bold text-slate-800 group-hover:text-blue-600 transition line-clamp-1">${next.title || '无标题'}</span>
            </a>
          `;
        } else {
          nextBox.innerHTML = `
            <span class="text-slate-400 mb-1 flex items-center justify-end gap-1">下一篇 <i class="fa-solid fa-chevron-right text-[10px]"></i></span>
            <span class="text-slate-400 italic">已是最后一篇</span>
          `;
        }
      } catch (e) {
        console.error("加载导航链接失败:", e);
      }
    }

    async function init() {
      currentArticleId = getQueryParam('id');
      if (!currentArticleId) {
        document.getElementById('loading').innerHTML = '<span class="text-red-500">参数错误：未找到文章 ID</span>';
        return;
      }

      auth.onAuthStateChanged(user => {
        if (user) isAdmin = true;
        loadComments();
      });

      try {
        let docRef = db.collection("posts").doc(currentArticleId);
        let docSnap = await docRef.get();

        if (!docSnap.exists) {
          docRef = db.collection("articles").doc(currentArticleId);
          docSnap = await docRef.get();
        }

        if (!docSnap.exists) {
          document.getElementById('loading').innerHTML = '<span class="text-red-500">文章不存在或已被删除</span>';
          return;
        }

        const data = docSnap.data();

        if (data.hide === true || data.status === 'hidden' || data.isHidden === true) {
          document.getElementById('loading').innerHTML = '<span class="text-slate-500">该文章已被博主隐藏</span>';
          return;
        }

        document.title = `${data.title || '文章详情'} - Rogue Blog`;
        document.getElementById('article-title').innerText = data.title || '无标题';
        document.getElementById('article-tag').innerText = parseArticleTag(data);
        document.getElementById('article-date').innerText = parseArticleDate(data);

        let markdownContent = data.content || '*(暂无内容)*';
        document.getElementById('article-content').innerHTML = marked.parse(markdownContent);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('article-container').classList.remove('hidden');
        document.getElementById('comment-section').classList.remove('hidden');

        // 加载上下篇导航
        loadNavigation(currentArticleId, getArticleTimestamp(data));

      } catch (err) {
        console.error(err);
        document.getElementById('loading').innerHTML = '<span class="text-red-500">加载文章失败，请刷新重试</span>';
      }
    }

    async function loadComments() {
      const listContainer = document.getElementById('comment-list');
      try {
        const snapshot = await db.collection("comments")
          .where("articleId", "==", currentArticleId)
          .get();

        let comments = [];
        snapshot.forEach(doc => comments.push({ id: doc.id, ...doc.data() }));

        comments.sort((a, b) => getArticleTimestamp(b) - getArticleTimestamp(a));

        let html = '';
        comments.forEach(c => {
          const dateStr = parseArticleDate(c);
          if (c.isPrivate && !isAdmin) {
            html += `
              <div class="p-2.5 rounded-lg bg-amber-50/60 border border-amber-100 text-xs text-amber-800 flex items-center space-x-1.5">
                <i class="fa-solid fa-lock text-amber-600"></i>
                <span>🔒 该留言为私密留言，仅博主可见</span>
              </div>`;
            return;
          }

          html += `
            <div class="p-3 rounded-lg bg-slate-50 border border-slate-100 text-xs space-y-1">
              <div class="flex items-center justify-between text-slate-500">
                <span class="font-bold text-slate-700">${c.author} ${c.isPrivate ? '<span class="text-amber-600 font-normal">[🔒 仅博主可见]</span>' : ''}</span>
                <span class="text-[10px] text-slate-400 font-mono">${dateStr}</span>
              </div>
              <p class="text-slate-700 leading-relaxed">${c.content}</p>
            </div>`;
        });

        if (html === '') {
          listContainer.innerHTML = '<div class="text-center py-4 text-slate-400 text-xs">暂无留言，快来抢沙发吧~</div>';
        } else {
          listContainer.innerHTML = html;
        }

      } catch (e) {
        console.error("加载留言失败", e);
        listContainer.innerHTML = '<div class="text-center py-2 text-red-400 text-xs">留言加载失败</div>';
      }
    }

    document.getElementById('comment-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> <span>发送中...</span>';

      const author = document.getElementById('comment-author').value.trim();
      const email = document.getElementById('comment-email').value.trim();
      const content = document.getElementById('comment-content').value.trim();
      const isPrivate = document.getElementById('comment-private').checked;

      try {
        await db.collection("comments").add({
          articleId: currentArticleId,
          author: author,
          email: email,
          content: content,
          isPrivate: isPrivate,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById('comment-content').value = '';
        document.getElementById('comment-private').checked = false;

        alert('留言成功！');
        loadComments();
      } catch (err) {
        console.error(err);
        alert('留言提交失败，请重试');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="fa-regular fa-paper-plane"></i> <span>提交留言</span>';
      }
    });

    window.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
