<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
文章阅读
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

}



.container{

max-width:900px;

margin:40px auto;

background:white;

padding:40px;

border-radius:10px;

}



.nav{

display:flex;

justify-content:space-between;

margin-bottom:30px;

}



.title{

font-size:36px;

font-weight:bold;

margin-bottom:20px;

}



.info{

color:#777;

font-size:14px;

border-bottom:1px solid #eee;

padding-bottom:20px;

line-height:2;

}



.content{

margin-top:30px;

font-size:18px;

line-height:2;

}



.content h1{

font-size:32px;

}



.content h2{

font-size:26px;

}



.content strong{

font-weight:bold;

}



.content blockquote{

border-left:5px solid #ddd;

padding-left:15px;

color:#666;

}



.content code{

background:#eee;

padding:3px 6px;

}



.content pre{

background:#222;

color:white;

padding:15px;

overflow:auto;

}




.content a{

color:#1677ff;

}



.history{

margin-top:40px;

background:#f7f7f7;

padding:20px;

border-radius:8px;

}



button{

padding:10px 18px;

cursor:pointer;

}



</style>


</head>



<body>



<div class="container">


<div class="nav">


<a href="index.html">

<button>

返回首页

</button>

</a>



<a href="archive.html">

<button>

文章列表

</button>

</a>


</div>





<div id="article">

加载中...

</div>



</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();






let params =
new URLSearchParams(
location.search
);



let id =
params.get("id");






if(id){


loadArticle();


}

else{


document.getElementById(
"article"
)

.innerHTML=

"文章不存在";


}








function loadArticle(){



db.collection("articles")

.doc(id)

.get()



.then(doc=>{



if(!doc.exists){


document.getElementById(
"article"
)

.innerHTML=

"文章不存在";


return;


}



let data =
doc.data();






let html=`


<div class="title">

${data.title}

</div>



<div class="info">


发布时间：

${formatTime(data.createTime)}


<br>


作者：

${data.author || "管理员"}



<br>


最后编辑：

${lastEdit(data.updateTime)}



</div>





<div class="content">


${markdownToHtml(data.content)}


</div>



`;








if(data.updateTime && data.updateTime.length>1){



html+=`

<div class="history">


<h3>

编辑记录

</h3>


<ul>

`;





data.updateTime.forEach(t=>{


html+=`

<li>

${t}

</li>

`;



});





html+=`

</ul>

</div>

`;



}






document.getElementById(
"article"
)

.innerHTML=html;



})



.catch(error=>{


document.getElementById(
"article"
)

.innerHTML=

"加载失败："+error.message;



});



}









// 简单Markdown解析


function markdownToHtml(md){



if(!md){

return "";

}





let html =
md;



// 转义


html =
html.replace(
/&/g,
"&amp;"
);


html =
html.replace(
/</g,
"&lt;"
);


html =
html.replace(
/>/g,
"&gt;"
);







// 代码块


html =
html.replace(

/```([\s\S]*?)```/g,

"<pre>$1</pre>"

);







// 标题


html =
html.replace(
/^### (.*)$/gm,

"<h3>$1</h3>"

);



html =
html.replace(
/^## (.*)$/gm,

"<h2>$1</h2>"

);



html =
html.replace(
/^# (.*)$/gm,

"<h1>$1</h1>"

);







// 加粗


html =
html.replace(

/\*\*(.*?)\*\*/g,

"<strong>$1</strong>"

);





// 斜体


html =
html.replace(

/\*(.*?)\*/g,

"<em>$1</em>"

);






// 链接


html =
html.replace(

/\[(.*?)\]\((.*?)\)/g,

'<a href="$2" target="_blank">$1</a>'

);







// 引用


html =
html.replace(

/^> (.*)$/gm,

"<blockquote>$1</blockquote>"

);







// 无序列表


html =
html.replace(

/^- (.*)$/gm,

"<li>$1</li>"

);



html =
html.replace(

/(<li>.*<\/li>)/gs,

"<ul>$1</ul>"

);







// 换行


html =
html.replace(

/\n/g,

"<br>"

);





return html;



}









function formatTime(time){


if(time && time.toDate){


return time.toDate()

.toLocaleString(
"zh-CN"
);


}


return "";



}






function lastEdit(list){


if(list && list.length){


return list[list.length-1];


}


return "暂无";



}



</script>


</body>

</html>
