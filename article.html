<!DOCTYPE html>
<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
文章阅读
</title>


<link rel="stylesheet" href="css/style.css">



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



</head>




<body>



<header class="header">


<div class="logo">

qwe博客

</div>



<a href="index.html"

class="nav-btn">

返回首页

</a>


</header>







<div class="container">



<a href="archive.html"

class="back-home">

← 返回文章列表

</a>





<div class="article-box"

id="articleBox">


正在加载文章...


</div>




</div>









<script>




// =====================
// Firebase配置
// =====================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};






firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();









// 获取文章ID


const params =
new URLSearchParams(
window.location.search
);



const id =
params.get("id");







if(!id){



document.getElementById(
"articleBox"
)
.innerHTML=

"文章不存在";



}

else{


loadArticle();


}









function loadArticle(){



db.collection("articles")

.doc(id)

.get()



.then(doc=>{



if(!doc.exists){



document.getElementById(
"articleBox"
)
.innerHTML=

"文章不存在";

return;


}





let data =
doc.data();






let updateHtml="";



if(
data.updateTime
&&
Array.isArray(data.updateTime)
){



updateHtml = `



<div>

编辑记录：

</div>



<ul>

${

data.updateTime.map(

item=>`

<li>${item}</li>`

).join("")

}

</ul>


`;



}







document.getElementById(
"articleBox"
)
.innerHTML=

`


<h1 class="article-title">

${data.title}

</h1>





<div class="article-info">


作者：

${data.author || "管理员"}



<br>



发布时间：

${formatTime(data.createTime)}



${updateHtml}


</div>







<div class="article-content">


${data.content || ""}


</div>




`;





})



.catch(error=>{


document.getElementById(
"articleBox"
)
innerHTML=

"加载失败："

+
error.message;


});



}









function formatTime(time){



if(time && time.toDate){



return time.toDate()

.toLocaleString(
"zh-CN"
);



}



return time || "";



}





</script>



</body>


</html>
