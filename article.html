<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章详情</title>
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background:#f5f5f7; padding: 20px; }
    .article-container { max-width: 720px; margin: 0 auto; background: #fff; padding: 20px; border-radius: 12px; }
    
    /* 互动按钮组 */
    .interaction-bar {
      display: flex; gap: 12px; justify-content: center; align-items: center;
      margin-top: 30px; padding-top: 16px; border-top: 1px solid #f0f0f0;
    }
    .action-btn {
      display: flex; align-items: center; gap: 6px; font-size: 0.85rem;
      padding: 8px 14px; border-radius: 20px; border: 1px solid #e5e5ea;
      background: #fafafa; color: #1d1d1f; cursor: pointer; transition: all 0.2s;
    }
    .action-btn:hover { background: #f2f2f7; }
    .action-btn.active { background: #e8f2ff; color: #0066cc; border-color: #0066cc; }
  </style>
</head>
<body>

  <div class="article-container">
    <h1 id="article-title">加载中...</h1>
    <div id="article-content" style="margin-top:16px; line-height:1.6;"></div>

    <div class="interaction-bar">
      <button class="action-btn" id="btn-like" onclick="handleLike()">
        👍 赞 <span id="like-count">0</span>
      </button>

      <button class="action-btn" id="btn-dislike" onclick="handleDislike()">
        👎 踩 <span id="dislike-count">0</span>
      </button>

      <button class="action-btn" id="btn-bookmark" onclick="handleBookmark()">
        ⭐ <span id="bookmark-text">收藏</span>
      </button>

      <button class="action-btn" onclick="handleShare()">
        🔗 分享
      </button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const urlParams = new URLSearchParams(window.location.search);
    const articleId = urlParams.get('id');

    let currentArticleData = {};

    if (articleId) {
      db.collection('articles').doc(articleId).get().then(doc => {
        if (doc.exists) {
          currentArticleData = doc.data();
          document.getElementById('article-title').innerText = currentArticleData.title || '';
          document.getElementById('article-content').innerHTML = currentArticleData.content || '';
          
          // 更新数字
          document.getElementById('like-count').innerText = currentArticleData.likes || 0;
          document.getElementById('dislike-count').innerText = currentArticleData.dislikes || 0;

          // 初始化检查本地收藏状态
          checkBookmarkStatus();
        }
      });
    }

    // 点赞
    function handleLike() {
      if (!articleId) return;
      db.collection('articles').doc(articleId).update({
        likes: firebase.firestore.FieldValue.increment(1)
      }).then(() => {
        const el = document.getElementById('like-count');
        el.innerText = parseInt(el.innerText) + 1;
      });
    }

    // 点踩
    function handleDislike() {
      if (!articleId) return;
      db.collection('articles').doc(articleId).update({
        dislikes: firebase.firestore.FieldValue.increment(1)
      }).then(() => {
        const el = document.getElementById('dislike-count');
        el.innerText = parseInt(el.innerText) + 1;
      });
    }

    // 收藏 (保存在 LocalStorage)
    function handleBookmark() {
      let bookmarks = JSON.parse(localStorage.getItem('my_bookmarks') || '[]');
      const index = bookmarks.indexOf(articleId);

      if (index === -1) {
        bookmarks.push(articleId);
        alert('已成功添加到收藏！');
      } else {
        bookmarks.splice(index, 1);
        alert('已取消收藏！');
      }
      localStorage.setItem('my_bookmarks', JSON.stringify(bookmarks));
      checkBookmarkStatus();
    }

    function checkBookmarkStatus() {
      let bookmarks = JSON.parse(localStorage.getItem('my_bookmarks') || '[]');
      const btn = document.getElementById('btn-bookmark');
      const text = document.getElementById('bookmark-text');

      if (bookmarks.includes(articleId)) {
        btn.classList.add('active');
        text.innerText = '已收藏';
      } else {
        btn.classList.remove('active');
        text.innerText = '收藏';
      }
    }

    // 分享 (复制链接)
    function handleShare() {
      navigator.clipboard.writeText(window.location.href).then(() => {
        alert('文章链接已复制到剪贴板，快去分享吧！');
      }).catch(() => {
        alert('复制失败，请手动复制当前网页地址：\n' + window.location.href);
      });
    }
  </script>
</body>
</html>
