<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章阅读
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<!-- Markdown解析 -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>



<style>


*{

box-sizing:border-box;

}


body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}



/* 阅读进度 */

.progress{

position:fixed;

top:0;

left:0;

height:4px;

background:#1677ff;

width:0%;

z-index:100;


}





.header{


background:white;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

z-index:20;

box-shadow:0 2px 8px rgba(0,0,0,.08);


}





.back{


color:#1677ff;

text-decoration:none;

font-size:15px;


}



.container{


padding:15px;


}




.article{


background:white;

padding:20px;

border-radius:12px;


}





h1{


font-size:25px;

line-height:1.5;

margin-top:0;


}




.meta{


font-size:14px;

color:#888;

line-height:2;


}




.tags{


margin:15px 0;


}




.tag{


display:inline-block;

background:#eef5ff;

color:#1677ff;

padding:6px 12px;

border-radius:20px;

margin:4px;

font-size:13px;


}






.toc{


background:#f8f8f8;

padding:15px;

border-radius:10px;

margin:20px 0;


}



.toc-title{


font-weight:bold;

margin-bottom:10px;


}



.toc a{


display:block;

font-size:14px;

color:#555;

text-decoration:none;

padding:5px 0;


}






.content{


font-size:17px;

line-height:1.9;


}




.content h1,
.content h2,
.content h3{


margin-top:30px;


}





.content img{


max-width:100%;

}





.nav{


display:flex;

justify-content:space-between;

margin-top:30px;


}



.nav a{


background:white;

padding:15px;

border-radius:10px;

text-decoration:none;

color:#333;

font-size:14px;


}




</style>

</head>








<body>



<div class="progress"

id="progress">

</div>






<div class="header">


<a class="back"

href="index.html">

← 返回首页

</a>



<a href="archive.html">

文章归档

</a>


</div>








<div class="container">





<div class="article">





<h1 id="title">

加载中...

</h1>






<div class="meta"

id="meta">

</div>





<div class="tags"

id="tags">

</div>







<div class="toc"

id="toc">

</div>








<div class="content"

id="content">

</div>







<div class="nav">


<div id="prev">

</div>



<div id="next">

</div>


</div>







</div>


</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();





let id="";


let articles=[];


let currentIndex=0;







let params=

new URLSearchParams(
location.search
);



id=params.get("id");








// 加载文章


function load(){



db.collection("articles")

.get()



.then(snapshot=>{


snapshot.forEach(doc=>{


let a={

id:doc.id,

...doc.data()

};



if(a.status==="published"){


articles.push(a);


}


});






articles.sort((a,b)=>{


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


});






currentIndex=

articles.findIndex(

a=>a.id===id

);






showArticle(

articles[currentIndex]

);



showNav();



})



.catch(e=>{


document.getElementById(
"content"
)

.innerHTML=

"加载失败："+e.message;



});



}









function showArticle(a){



if(!a)return;




document.title=a.title;





document.getElementById(
"title"
)

.innerHTML=a.title;







document.getElementById(
"meta"
)

.innerHTML=

`

发布时间：

${format(a.createTime)}

<br>

作者：

${a.author||"管理员"}

`;








let tagHtml="";





(a.tags||[])

.forEach(t=>{



tagHtml+=`

<span class="tag">

${t}

</span>

`;



});






document.getElementById(
"tags"
)

.innerHTML=

tagHtml;







document.getElementById(
"content"
)

.innerHTML=

marked.parse(a.content);







createToc();



}









// 自动目录


function createToc(){



let content=

document.getElementById(
"content"
);





let headings=

content.querySelectorAll(
"h1,h2,h3"
);



let html="";





if(headings.length){



html+=`

<div class="toc-title">

文章目录

</div>

`;






headings.forEach((h,i)=>{



let id=

"heading-"+i;



h.id=id;



html+=`

<a href="#${id}">

${h.innerText}

</a>

`;



});





}

else{


html="";


}






document.getElementById(
"toc"
)

.innerHTML=html;



}









// 上下一篇


function showNav(){



if(currentIndex>0){


let p=

articles[currentIndex-1];



document.getElementById(
"prev"
)

.innerHTML=

`

<a href="article.html?id=${p.id}">

上一篇<br>

${p.title}

</a>

`;



}







if(currentIndex<articles.length-1){



let n=

articles[currentIndex+1];



document.getElementById(
"next"
)

.innerHTML=

`

<a href="article.html?id=${n.id}">

下一篇<br>

${n.title}

</a>

`;



}



}








function format(t){



if(t&&t.toDate){


return t.toDate()

.toLocaleString(
"zh-CN"
);


}


return "";



}









// 阅读进度


window.addEventListener(
"scroll",

()=>{


let h=

document.documentElement;


let percent=

h.scrollTop/

(h.scrollHeight-h.clientHeight)

*100;



document.getElementById(
"progress"
)

.style.width=

percent+"%";



}

);







load();



</script>



</body>

</html>
