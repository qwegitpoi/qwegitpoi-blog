<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章阅读
</title>


<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<!-- Markdown解析 -->

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}


/* 阅读进度条 */

.progress{


position:fixed;

top:0;

left:0;

height:4px;

background:#1677ff;

width:0%;

z-index:100;


}





/* 顶部导航 */


.header{


background:white;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

z-index:20;

box-shadow:

0 2px 8px rgba(0,0,0,.08);


}



.header a{


text-decoration:none;

color:#1677ff;

font-size:15px;


}





.container{


padding:15px;


}





.article{


background:white;

padding:20px;

border-radius:14px;


}





.article-title{


font-size:25px;

line-height:1.5;

font-weight:bold;

margin:0 0 15px;


}





.meta{


font-size:14px;

color:#888;

line-height:2;


}





/* 标签 */


.tags{


margin:15px 0;


}



.tag{


display:inline-block;

background:#eef5ff;

color:#1677ff;

padding:6px 12px;

border-radius:20px;

margin:4px;

font-size:13px;


}





/* 自动目录 */


.toc{


background:#f8f8f8;

padding:15px;

border-radius:12px;

margin:20px 0;


}



.toc-title{


font-weight:bold;

font-size:16px;

margin-bottom:10px;


}



.toc a{


display:block;

padding:6px 0;

font-size:14px;

text-decoration:none;

color:#555;


}





/* 正文 */


.content{


font-size:17px;

line-height:1.9;


}



.content h1,
.content h2,
.content h3{


margin-top:35px;

}





.content img{


max-width:100%;


}





/* ===================== */
/* 上一篇 下一篇 卡片 */
/* ===================== */


.nav{


margin-top:45px;

padding-bottom:30px;


}




.nav div{


margin-bottom:15px;


}





.nav a{


display:block;

background:#fff;

border-radius:14px;

padding:18px;

text-decoration:none;

color:#333;

box-shadow:

0 2px 8px rgba(0,0,0,.06);


}



.nav-label{


font-size:13px;

color:#1677ff;

margin-bottom:8px;


}





.nav-title{


font-size:16px;

font-weight:bold;

line-height:1.6;

overflow:hidden;

display:-webkit-box;

-webkit-line-clamp:2;

-webkit-box-orient:vertical;


}





.nav a:active{


background:#f5f5f5;


}





/* 手机优化 */


@media(max-width:600px){



.article{


padding:18px;


}



.article-title{


font-size:23px;


}




.content{


font-size:16px;


}


}





</style>


</head>





<body>



<!-- 阅读进度 -->

<div id="progress"

class="progress">

</div>








<!-- 顶部 -->

<div class="header">


<a href="index.html">

← 返回首页

</a>



<a href="archive.html">

文章归档

</a>


</div>








<div class="container">



<div class="article">





<h1 id="title"

class="article-title">

加载中...

</h1>






<div id="meta"

class="meta">

</div>







<div id="tags"

class="tags">

</div>







<div id="toc"

class="toc">

</div>







<div id="content"

class="content">

加载中...

</div>









<!-- 上一篇 下一篇 -->


<div class="nav">


<div id="prev">

</div>



<div id="next">

</div>



</div>








</div>


</div>








<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();


let articleId = "";

let articles = [];

let currentIndex = -1;



// 获取URL文章ID

const params = new URLSearchParams(location.search);

articleId = params.get("id");






// 加载文章

function loadArticle(){


db.collection("articles")

.get()


.then(snapshot=>{


articles=[];



snapshot.forEach(doc=>{


let data=doc.data();



if(data.status==="published"){


articles.push({

id:doc.id,

...data

});


}


});





// 按发布时间排序

articles.sort((a,b)=>{


return (

b.createTime?.seconds || 0

)

-

(

a.createTime?.seconds || 0

);


});






currentIndex = articles.findIndex(

item=>item.id===articleId

);





if(currentIndex===-1){


document.getElementById("content")

.innerHTML=

"文章不存在";


return;


}





showArticle(

articles[currentIndex]

);



showNavigation();



})

.catch(error=>{


document.getElementById("content")

.innerHTML=

"加载失败："+error.message;


});



}









// 显示文章


function showArticle(article){



document.title = article.title;






document.getElementById("title")

.innerHTML =

article.title;







document.getElementById("meta")

.innerHTML=

`

发布时间：

${formatTime(article.createTime)}

<br>

作者：

${article.author || "管理员"}

`;









// 标签


let tagHTML="";



(article.tags || [])

.forEach(tag=>{


tagHTML +=

`

<span class="tag">

${tag}

</span>

`;



});





document.getElementById("tags")

.innerHTML=tagHTML;










// Markdown解析


document.getElementById("content")

.innerHTML=

marked.parse(

article.content || ""

);







createTOC();



}











// 自动目录


function createTOC(){



let content =

document.getElementById("content");



let headings =

content.querySelectorAll(

"h1,h2,h3"

);




let html="";




if(headings.length>0){



html+=`

<div class="toc-title">

文章目录

</div>

`;





headings.forEach((h,index)=>{


let id=

"heading-"+index;



h.id=id;



html+=`

<a href="#${id}">

${h.innerText}

</a>

`;



});



}





document.getElementById("toc")

.innerHTML=html;



}











// 上一篇 下一篇卡片


function showNavigation(){



let prev =

document.getElementById("prev");



let next =

document.getElementById("next");







prev.innerHTML="";

next.innerHTML="";








// 上一篇


if(currentIndex > 0){



let article =

articles[currentIndex-1];



prev.innerHTML=

`

<a href="article.html?id=${article.id}">


<div class="nav-label">

← 上一篇

</div>


<div class="nav-title">

${article.title}

</div>


</a>

`;



}









// 下一篇


if(

currentIndex < articles.length-1

){



let article =

articles[currentIndex+1];



next.innerHTML=

`

<a href="article.html?id=${article.id}">


<div class="nav-label">

下一篇 →

</div>


<div class="nav-title">

${article.title}

</div>


</a>


`;



}



}












// 时间格式化


function formatTime(time){



if(time && time.toDate){


return time.toDate()

.toLocaleString(

"zh-CN"

);



}



return "";



}











// 阅读进度条


window.addEventListener(

"scroll",

()=>{


let scrollTop =

document.documentElement.scrollTop

|| document.body.scrollTop;



let height =

document.documentElement.scrollHeight

-

document.documentElement.clientHeight;





let percent =

height

?

(scrollTop / height) * 100

:

0;






document.getElementById("progress")

.style.width=

percent+"%";



}

);









// 启动


loadArticle();
