<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>文章</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}





.header{

background:white;

padding:15px;

display:flex;

justify-content:space-between;

box-shadow:

0 2px 8px rgba(0,0,0,.08);

}



.header a{

color:#1677ff;

text-decoration:none;

font-size:14px;

}





.container{

padding:15px;

}





.article{

background:white;

padding:20px;

border-radius:10px;

}




h1{

font-size:24px;

line-height:1.5;

margin-top:0;

}





.info{

font-size:14px;

color:#888;

line-height:2;

}





.tags{

margin:15px 0;

}



.tag{


display:inline-block;

background:#eef5ff;

color:#1677ff;

padding:4px 10px;

border-radius:15px;

font-size:13px;

margin-right:5px;

}




.content{

font-size:16px;

line-height:1.9;

}



.content h2{

margin-top:30px;

}



.content img{

max-width:100%;

}




.nav{


margin-top:30px;

border-top:1px solid #eee;

padding-top:20px;

}



.nav a{

display:block;

color:#1677ff;

text-decoration:none;

margin:12px 0;

font-size:15px;

}





</style>


</head>




<body>




<div class="header">


<a href="./index.html">

← 返回首页

</a>



<a href="archive.html">

文章列表

</a>



</div>







<div class="container">


<div class="article">


<h1 id="title">

加载中...

</h1>



<div id="info"

class="info">

</div>



<div id="tags"

class="tags">

</div>



<hr>



<div id="content"

class="content">

加载文章中...

</div>





<div class="nav">


<div id="prev">

</div>


<div id="next">

</div>



</div>



</div>


</div>







<script>


const firebaseConfig={



apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};



firebase.initializeApp(firebaseConfig);



const db=

firebase.firestore();




let id=

new URLSearchParams(location.search)

.get("id");



let articles=[];

let currentIndex=-1;







async function load(){


try{


let doc=

await db.collection("articles")

.doc(id)

.get();



if(!doc.exists){


document.getElementById("content")

.innerHTML=

"文章不存在";


return;


}



let article={

id:doc.id,

...doc.data()

};





document.title=

article.title;



document.getElementById("title")

.innerHTML=

article.title;





document.getElementById("info")

.innerHTML=

`

发布时间：

${format(article.createTime)}

<br>

作者：

${article.author||"管理员"}

`;






let tagHtml="";



(article.tags||[])

.forEach(t=>{


tagHtml+=`

<span class="tag">

${t}

</span>

`;

});



document.getElementById("tags")

.innerHTML=

tagHtml;








if(window.marked){



document.getElementById("content")

.innerHTML=

marked.parse(

article.content||""

);



}else{



document.getElementById("content")

.innerText=

article.content||"";


}






loadNav();



}

catch(e){



document.getElementById("content")

.innerHTML=

"加载失败："+e.message;



}



}









async function loadNav(){



let snap=

await db.collection("articles")

.where(
"status",
"==",
"published"
)

.get();





articles=[];



snap.forEach(doc=>{


articles.push({

id:doc.id,

...doc.data()

});


});






articles.sort((a,b)=>{


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


});







currentIndex=

articles.findIndex(

a=>a.id===id

);







if(currentIndex>0){



let p=

articles[currentIndex-1];



document.getElementById("prev")

.innerHTML=

`

<a href="article.html?id=${p.id}">

上一篇：${p.title}

</a>

`;



}







if(currentIndex<articles.length-1){



let n=

articles[currentIndex+1];



document.getElementById("next")

.innerHTML=

`

<a href="article.html?id=${n.id}">

下一篇：${n.title}

</a>

`;



}



}







function format(t){



if(t&&t.toDate){



return t.toDate()

.toLocaleString("zh-CN");


}



return "";

}




load();



</script>



</body>

</html>
