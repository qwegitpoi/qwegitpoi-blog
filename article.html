<!DOCTYPE html>
<html lang="zh-CN">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
文章详情 - 曾永个人博客
</title>


<link rel="stylesheet" href="css/style.css">



<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



</head>




<body>




<header class="header">


<div class="logo">

曾永个人博客

</div>


<a class="admin-btn" href="index.html">

返回首页

</a>


</header>







<div class="container">



<div class="article-card" id="article">


正在加载文章...


</div>



</div>







<script>



// Firebase 配置


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





// 初始化 Firebase


firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();







// 获取网址中的文章ID


const params =
new URLSearchParams(
window.location.search
);



const articleId =
params.get("id");






if(!articleId){



document.getElementById("article").innerHTML=

"没有找到文章编号";



}

else{



loadArticle();



}







function loadArticle(){



db.collection("articles")
.doc(articleId)
.get()


.then(doc=>{



if(!doc.exists){



document.getElementById("article").innerHTML=

"文章不存在";



return;


}



let data =
doc.data();




document.getElementById("article").innerHTML=



`


<h1>

${data.title}

</h1>



<div class="time">

作者：
${data.author || "管理员"}

&nbsp;&nbsp;

发布时间：
${data.time}

</div>




<hr>



<div style="line-height:2;font-size:18px;white-space:pre-wrap;">

${data.content}

</div>



`;



})



.catch(error=>{



document.getElementById("article").innerHTML=

"加载失败："+error.message;



});



}





</script>




</body>


</html>
