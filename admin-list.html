<script>
  // 渲染文章列表函数片段
  function renderTable(articles) {
    const tbody = document.getElementById('article-tbody');
    tbody.innerHTML = articles.map(item => {
      const isFeatured = item.featured === true || item.is_featured === true;
      const isHidden = item.hide === true || item.status === 'hidden';

      return `
        <tr>
          <td>
            <span class="${isHidden ? 'status-hidden' : ''}">${item.title}</span>
            ${isFeatured ? '<span style="color:#ff9500; font-weight:bold; margin-left:4px;">[★ 精选]</span>' : ''}
            ${isHidden ? ' <small style="color:#8e8e93;">(已隐藏)</small>' : ''}
          </td>
          <td>${item.tag || '随笔'}</td>
          <td>
            <button onclick="editArticle('${item.id}')">编辑</button>
            
            <button onclick="toggleHide('${item.id}', ${isHidden})">
              ${isHidden ? '显示' : '隐藏'}
            </button>
            
            <button 
              style="background-color: ${isFeatured ? '#ff9500' : '#ffffff'}; color: ${isFeatured ? '#fff' : '#333'}; border: 1px solid #d1d1d6; border-radius: 4px; cursor: pointer; padding: 2px 8px;"
              onclick="toggleFeatured('${item.id}', ${isFeatured})"
            >
              ${isFeatured ? '取消精选' : '精选'}
            </button>

            <button onclick="deleteArticle('${item.id}')" style="color:red;">删除</button>
          </td>
        </tr>
      `;
    }).join('');
  }

  // 切换【精选】状态写入 Firebase Firestore
  function toggleFeatured(docId, currentFeatured) {
    db.collection('articles').doc(docId).update({
      featured: !currentFeatured
    }).then(() => {
      alert(currentFeatured ? '已取消精选' : '已设为精选');
      location.reload(); // 重新刷新数据
    }).catch(err => {
      alert('更新失败: ' + err.message);
    });
  }

  // 切换【隐藏】状态写入 Firebase Firestore
  function toggleHide(docId, currentHidden) {
    db.collection('articles').doc(docId).update({
      hide: !currentHidden,
      status: !currentHidden ? 'hidden' : 'published'
    }).then(() => {
      location.reload();
    });
  }
</script>
