<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>文章管理</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<style>


*{
box-sizing:border-box;
}



body{

margin:0;

background:#f5f6fa;

font-family:"Microsoft YaHei",Arial;

color:#333;

}



.header{

background:white;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}



.header a{

color:#1677ff;

text-decoration:none;

font-size:14px;

}



.container{

padding:12px;

}



.box{

background:white;

padding:12px;

border-radius:8px;

margin-bottom:12px;

}



input{

width:100%;

padding:10px;

border:1px solid #ddd;

border-radius:20px;

font-size:15px;

}



.box-title{

font-weight:bold;

margin-bottom:8px;

}



span{

display:inline-block;

font-size:14px;

color:#1677ff;

margin:5px 12px 5px 0;

cursor:pointer;

}





.item{

background:white;

padding:12px;

border-radius:8px;

margin-bottom:10px;

}



.top{

display:flex;

justify-content:space-between;

align-items:flex-start;

gap:8px;

}



.title{

font-size:16px;

font-weight:bold;

flex:1;

}



.title a{

color:#333;

text-decoration:none;

}



.summary{

font-size:14px;

color:#555;

margin-top:8px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;

}



.meta{

font-size:12px;

color:#888;

line-height:1.8;

margin-top:8px;

}





.actions{

white-space:nowrap;

}



.actions button{

border:0;

padding:4px 7px;

font-size:12px;

border-radius:4px;

margin-left:3px;

}



.hide{

background:#666;

color:white;

}



.edit{

background:#1677ff;

color:white;

}



.delete{

background:#e53935;

color:white;

}



.page{

text-align:center;

padding:15px;

}



.page button{

padding:8px 15px;

margin:5px;

}



.empty{

background:white;

padding:20px;

text-align:center;

color:#999;

border-radius:8px;

}



</style>


</head>


<body>



<div class="header">


<a href="admin.html">

← 后台首页

</a>


<div id="pageTitle">

文章管理

</div>


</div>





<div class="container">



<div class="box">


<input

id="search"

placeholder="搜索标题或正文"

oninput="filter()">


</div>





<div class="box">


<div class="box-title">

年月分类

</div>


<div id="months">

</div>


</div>





<div class="box">


<div class="box-title">

标签分类

</div>


<div id="tags">

</div>


</div>






<div id="list">

加载中...

</div>



<div class="page" id="pages">

</div>



</div>







<script>



const firebaseConfig={


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};



firebase.initializeApp(firebaseConfig);



const db=firebase.firestore();




let type=

new URLSearchParams(location.search)

.get("type")

||"published";



let all=[];

let showList=[];

let page=1;

let size=10;





if(type==="published")

pageTitle.innerHTML="已发表文章";


if(type==="hidden")

pageTitle.innerHTML="隐藏文章";


if(type==="draft")

pageTitle.innerHTML="草稿箱";







function load(){



db.collection("articles")

.get()

.then(snapshot=>{


all=[];



snapshot.forEach(doc=>{


let a={

id:doc.id,

...doc.data()

};



if(a.status===type){

all.push(a);

}



});





all.sort((a,b)=>{


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


});



showList=[...all];


showFilter();


render();



})

.catch(e=>{


list.innerHTML=

"加载失败："+e.message;


});


}










function filter(){



let key=

document.getElementById("search")

.value

.toLowerCase();



showList=all.filter(a=>{


return !key

||

(a.title||"")

.toLowerCase()

.includes(key)


||

(a.content||"")

.toLowerCase()

.includes(key);


});



page=1;


render();


}










function showFilter(){



let months={};

let tags={};



all.forEach(a=>{


if(a.createTime){


let d=a.createTime.toDate();



let m=

d.getFullYear()

+"年"

+(d.getMonth()+1)

+"月";



months[m]=true;


}



(a.tags||[])

.forEach(t=>{


tags[t]=true;


});


});





let mh="";



Object.keys(months)

.reverse()

.forEach(m=>{


mh+=`

<span onclick="monthFilter('${m}')">

${m}

</span>

`;

});



months.innerHTML=mh||"暂无";






let th="";



Object.keys(tags)

.forEach(t=>{


th+=`

<span onclick="tagFilter('${t}')">

${t}

</span>

`;

});


tags.innerHTML=th||"暂无";


}










function monthFilter(m){



showList=

all.filter(a=>{


let d=a.createTime.toDate();



return (

d.getFullYear()

+"年"

+(d.getMonth()+1)

+"月"

)

===m;


});



page=1;

render();

}








function tagFilter(t){



showList=

all.filter(a=>{


return (

a.tags||[]

)

.includes(t);


});


page=1;

render();

}









function render(){



let start=

(page-1)*size;



let data=

showList.slice(start,start+size);





if(data.length===0){


list.innerHTML=

`

<div class="empty">

暂无文章

</div>

`;

pages.innerHTML="";

return;


}





let html="";



data.forEach(a=>{



html+=`

<div class="item">


<div class="top">


<div class="title">

<a href="article.html?id=${a.id}">

${a.title}

</a>

</div>



<div class="actions">



${type!=="draft"

?

`

<button class="hide"

onclick="toggle('${a.id}','${a.status}')">

${a.status==="hidden"?"恢复":"隐藏"}

</button>

`

:""

}




<button class="edit"

onclick="edit('${a.id}')">

编辑

</button>



<button class="delete"

onclick="del('${a.id}')">

删除

</button>


</div>



</div>





<div class="summary">

${firstLine(a.content)}

</div>



<div class="meta">


发布时间：

${format(a.createTime)}


<br>


最后编辑：

${lastUpdate(a.updateTime)}


<br>


标签：

${(a.tags||[]).join(" ")}


</div>



</div>

`;



});




list.innerHTML=html;


showPage();


}









function showPage(){



let total=Math.ceil(showList.length/size);



let html="";



if(page>1){


html+=`

<button onclick="changePage(${page-1})">

上一页

</button>

`;

}



html+=`${page}/${total||1}`;



if(page<total){


html+=`

<button onclick="changePage(${page+1})">

下一页

</button>

`;

}



pages.innerHTML=html;


}







function changePage(p){

page=p;

render();

}








function toggle(id,status){



let newStatus=

status==="hidden"

?"published"

:"hidden";



db.collection("articles")

.doc(id)

.update({

status:newStatus

})

.then(load);



}







function edit(id){



location.href=

"admin-edit.html?id="+id;


}







function del(id){



if(confirm("确定删除？")){


db.collection("articles")

.doc(id)

.delete()

.then(load);


}



}







function firstLine(t){


if(!t)return "";


return t

.replace(/[#>*_-]/g,"")

.split("\n")

.filter(x=>x.trim())

[0]

.substring(0,80);


}







function format(t){


if(t&&t.toDate){


return t.toDate()

.toLocaleDateString("zh-CN");


}


return "";

}







function lastUpdate(arr){



if(!arr||arr.length===0)

return "暂无";



return arr[arr.length-1];


}






load();



</script>



</body>

</html>
