<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章管理 - 博客后台</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6fa;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #333;
    }

    .header {
      height: 60px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .header h1 {
      font-size: 18px;
      margin: 0;
    }

    .header a, .btn-link {
      text-decoration: none;
      color: #1677ff;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-logout {
      background: #ff4d4f;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
    }

    .btn-logout:hover {
      background: #d9363e;
    }

    .container {
      max-width: 900px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .btn-primary {
      background: #1677ff;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      cursor: pointer;
    }

    .article-item {
      background: white;
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 12px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .article-info h3 {
      margin: 0 0 8px 0;
      font-size: 16px;
    }

    .article-meta {
      font-size: 12px;
      color: #8c8c8c;
      display: flex;
      gap: 12px;
    }

    .tag-badge {
      background: #e6f4ff;
      color: #1677ff;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-op {
      padding: 5px 10px;
      border-radius: 4px;
      border: 1px solid #d9d9d9;
      background: white;
      cursor: pointer;
      font-size: 12px;
    }

    .btn-op.danger {
      color: #ff4d4f;
      border-color: #ff4d4f;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin-top: 20px;
    }

    .pagination button {
      padding: 5px 12px;
      border: 1px solid #d9d9d9;
      background: white;
      border-radius: 4px;
      cursor: pointer;
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: #999;
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-left">
      <a href="admin.html">← 返回控制台</a>
      <h1>文章管理列表</h1>
    </div>
    <div>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="container">
    <div class="actions">
      <div id="filterTitle">所有文章</div>
      <a href="admin-edit.html" class="btn-primary">+ 新增文章</a>
    </div>

    <div id="list">加载中...</div>

    <div class="pagination" id="pageBox"></div>
  </div>

  <script>
    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // 登录权限拦截
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "admin-login.html";
      } else {
        loadArticles();
      }
    });

    function logout() {
      auth.signOut().then(() => {
        window.location.href = "admin-login.html";
      });
    }

    let articles = [];
    let page = 1;
    const size = 5;

    // 解析 URL 参数（例如：?type=draft 或 ?type=hidden）
    const urlParams = new URLSearchParams(window.location.search);
    const filterType = urlParams.get("type");

    async function loadArticles() {
      try {
        let query = db.collection("articles");

        if (filterType) {
          query = query.where("status", "==", filterType);
          document.getElementById("filterTitle").innerText = 
            filterType === 'draft' ? '草稿箱' : (filterType === 'hidden' ? '已隐藏文章' : '已发布文章');
        }

        const snap = await query.get();
        articles = [];
        snap.forEach(doc => {
          articles.push({ id: doc.id, ...doc.data() });
        });

        // 优先按创建时间降序排列
        articles.sort((a, b) => (b.createTime?.seconds || 0) - (a.createTime?.seconds || 0));

        render();
      } catch (e) {
        document.getElementById("list").innerHTML = `<div class="empty">加载失败：${e.message}</div>`;
      }
    }

    function render() {
      const listEl = document.getElementById("list");
      if (articles.length === 0) {
        listEl.innerHTML = `<div class="empty">暂无文章</div>`;
        document.getElementById("pageBox").innerHTML = "";
        return;
      }

      const start = (page - 1) * size;
      const pageData = articles.slice(start, start + size);

      let html = "";
      pageData.forEach(item => {
        const isHidden = item.status === "hidden";
        html += `
          <div class="article-item">
            <div class="article-info">
              <h3>${escapeHtml(item.title || "无标题")}</h3>
              <div class="article-meta">
                <span>状态: ${item.status || "published"}</span>
                <span>标签: ${(item.tags || []).map(t => `<span class="tag-badge">${escapeHtml(t)}</span>`).join(" ")}</span>
              </div>
            </div>
            <div class="btn-group">
              <button class="btn-op" onclick="edit('${item.id}')">编辑</button>
              <button class="btn-op" onclick="toggleHide('${item.id}', '${item.status}')">
                ${isHidden ? '取消隐藏' : '隐藏'}
              </button>
              <button class="btn-op danger" onclick="deleteArticle('${item.id}')">删除</button>
            </div>
          </div>
        `;
      });

      listEl.innerHTML = html;
      showPage();
    }

    function showPage() {
      const total = Math.ceil(articles.length / size);
      const pageBox = document.getElementById("pageBox");
      let html = "";

      if (page > 1) {
        html += `<button onclick="changePage(${page - 1})">上一页</button>`;
      }
      html += `<span>${page} / ${total || 1}</span>`;
      if (page < total) {
        html += `<button onclick="changePage(${page + 1})">下一页</button>`;
      }

      pageBox.innerHTML = html;
    }

    function changePage(p) {
      page = p;
      render();
    }

    function edit(id) {
      location.href = "admin-edit.html?id=" + id;
    }

    async function toggleHide(id, status) {
      const newStatus = status === "hidden" ? "published" : "hidden";
      await db.collection("articles").doc(id).update({ status: newStatus });
      loadArticles();
    }

    async function deleteArticle(id) {
      if (confirm("确定要删除这篇文章吗？此操作无法撤销。")) {
        await db.collection("articles").doc(id).delete();
        loadArticles();
      }
    }

    function escapeHtml(str) {
      return (str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }
  </script>
</body>

</html>
