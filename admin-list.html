<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章管理列表 - 管理后台</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="glass-header sticky top-0 z-50">
    <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <a href="admin.html" class="font-bold text-slate-800 hover:text-blue-600 text-base transition">
          <i class="fa-solid fa-gear text-blue-600 me-1"></i> 管理后台
        </a>
        <span class="text-slate-300">/</span>
        <span class="text-xs font-semibold text-slate-600">文章列表</span>
      </div>

      <div class="flex items-center space-x-2 text-xs">
        <a href="admin-edit.html" class="px-3 py-1 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition flex items-center">
          <i class="fa-solid fa-plus me-1"></i> 新建文章
        </a>
        <button onclick="handleLogout()" class="px-2.5 py-1 bg-slate-100 hover:bg-rose-50 text-slate-600 hover:text-rose-600 font-medium rounded-lg transition flex items-center">
          <i class="fa-solid fa-right-from-bracket me-1"></i> 退出
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 sm:px-6 py-6 w-full flex-grow">
    
    <div class="bg-white rounded-2xl p-4 sm:p-6 border border-slate-100 shadow-sm mb-6 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-slate-800">已发表文章管理</h1>
        <p class="text-slate-400 text-xs mt-0.5">在线文章管理，支持精选状态、隐置与删除（按首次发表时间倒序）</p>
      </div>

      <div class="text-xs text-slate-500 font-medium">
        总文章数: <span id="total-count" class="text-blue-600 font-bold">0</span> 篇
      </div>
    </div>

    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-xs">
          <thead>
            <tr class="bg-slate-50 border-b border-slate-100 text-slate-500 font-semibold">
              <th class="p-3 sm:p-4">文章标题</th>
              <th class="p-3 sm:p-4">分类标签</th>
              <th class="p-3 sm:p-4">发表时间</th>
              <th class="p-3 sm:p-4 text-center">状态</th>
              <th class="p-3 sm:p-4 text-right">操作</th>
            </tr>
          </thead>
          <tbody id="table-body" class="divide-y divide-slate-100 text-slate-700">
            <tr>
              <td colspan="5" class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-xl text-blue-600 mb-2"></i>
                <p>正在读取文章列表...</p>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <footer class="bg-white border-t border-slate-200 py-3 text-center text-[11px] text-slate-500 mt-12">
    <p>© 2026 我的个人博客. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qwegitpoi-blog",
      storageBucket: "qwegitpoi-blog.firebasestorage.app",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963",
      measurementId: "G-M01JQCZ0WX"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let dbCollection = "posts";

    // 登录校验
    auth.onAuthStateChanged(user => {
      if (!user) {
        window.location.href = "admin-login.html";
      } else {
        loadAdminArticles();
      }
    });

    function handleLogout() {
      auth.signOut().then(() => window.location.href = "admin-login.html");
    }

    // ⭐ 全能强壮时间戳解析器
    function getArticleTimestamp(data) {
      if (!data || typeof data !== 'object') return 0;
      const raw = data.createdAt || data.created_at || data.createTime || data.create_time || data.created ||
                  data.publishedAt || data.published_at || data.pubDate || data.pub_date ||
                  data.timestamp || data.date || data.time || data.datetime ||
                  data.updatedAt || data.updated_at;

      if (raw === undefined || raw === null) return 0;

      try {
        if (typeof raw.toDate === 'function') {
          const d = raw.toDate();
          if (d && !isNaN(d.getTime())) return d.getTime();
        }
        if (raw instanceof Date) {
          if (!isNaN(raw.getTime())) return raw.getTime();
        }
        if (typeof raw === 'object') {
          const secs = raw.seconds !== undefined ? raw.seconds : raw._seconds;
          if (typeof secs === 'number') return secs * 1000;
        }
        if (typeof raw === 'number') {
          if (isNaN(raw)) return 0;
          return raw < 1e11 ? raw * 1000 : raw;
        }
        if (typeof raw === 'string') {
          const trimmed = raw.trim();
          if (!trimmed) return 0;
          if (/^\d+$/.test(trimmed)) {
            const num = Number(trimmed);
            return num < 1e11 ? num * 1000 : num;
          }
          const formattedStr = trimmed.replace(/-/g, '/').replace('T', ' ').replace('Z', '');
          const d = new Date(formattedStr);
          if (!isNaN(d.getTime())) return d.getTime();
          const d2 = new Date(trimmed);
          if (!isNaN(d2.getTime())) return d2.getTime();
        }
      } catch (e) {
        console.error("时间戳解析异常:", e);
      }
      return 0;
    }

    function parseArticleDate(data) {
      const ts = getArticleTimestamp(data);
      if (ts > 0) {
        const d = new Date(ts);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }
      if (data && typeof data === 'object') {
        for (const key of ['date', 'time', 'createdAt', 'created_at', 'publishedAt']) {
          if (typeof data[key] === 'string' && data[key].trim() !== '') {
            return data[key].trim();
          }
        }
      }
      return "暂无时间";
    }

    function parseArticleTag(data) {
      if (!data) return "随笔";
      let t = data.tag || data.category || data.tags || data.categories;
      if (Array.isArray(t)) return t.length > 0 ? t[0] : "随笔";
      if (typeof t === 'string' && t.trim() !== '') return t.trim();
      return "随笔";
    }

    async function loadAdminArticles() {
      const tbody = document.getElementById('table-body');
      const countEl = document.getElementById('total-count');

      try {
        let snapshot;
        try {
          snapshot = await db.collection("posts").get();
          if (snapshot.empty) throw new Error("posts empty");
        } catch (e) {
          snapshot = await db.collection("articles").get();
          dbCollection = "articles";
        }

        let list = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          list.push({
            id: doc.id,
            title: data.title || "无标题文章",
            tag: parseArticleTag(data),
            dateStr: parseArticleDate(data),
            timestamp: getArticleTimestamp(data),
            isHidden: data.hide === true || data.status === 'hidden' || data.isHidden === true,
            isFeatured: data.featured === true || data.is_featured === true || data.isFeatured === true
          });
        });

        // ⭐ 首次发表时间严格倒序排列
        list.sort((a, b) => b.timestamp - a.timestamp);
        countEl.innerText = list.length;

        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-slate-400">暂无任何文章记录</td></tr>`;
          return;
        }

        let html = '';
        list.forEach(item => {
          html += `
            <tr class="hover:bg-slate-50/80 transition">
              <td class="p-3 sm:p-4 font-semibold text-slate-800">
                <a href="article.html?id=${item.id}" target="_blank" class="hover:text-blue-600 transition">
                  ${item.title}
                </a>
              </td>
              <td class="p-3 sm:p-4">
                <span class="px-2 py-0.5 rounded-full bg-slate-100 text-slate-600 font-medium">
                  ${item.tag}
                </span>
              </td>
              <td class="p-3 sm:p-4 text-slate-400">${item.dateStr}</td>
              <td class="p-3 sm:p-4 text-center">
                <div class="flex items-center justify-center gap-1">
                  ${item.isHidden ? '<span class="px-2 py-0.5 rounded bg-rose-50 text-rose-600">隐置</span>' : '<span class="px-2 py-0.5 rounded bg-emerald-50 text-emerald-600">公开</span>'}
                  ${item.isFeatured ? '<span class="px-2 py-0.5 rounded bg-amber-50 text-amber-600">★ 精选</span>' : ''}
                </div>
              </td>
              <td class="p-3 sm:p-4 text-right space-x-1.5">
                <button onclick="toggleFeatured('${item.id}', ${item.isFeatured})" class="px-2 py-1 ${item.isFeatured ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 hover:bg-amber-50 text-slate-600'} rounded transition">
                  ${item.isFeatured ? '取消精选' : '精选'}
                </button>
                <button onclick="toggleHide('${item.id}', ${item.isHidden})" class="px-2 py-1 ${item.isHidden ? 'bg-rose-100 text-rose-700' : 'bg-slate-100 hover:bg-slate-200 text-slate-600'} rounded transition">
                  ${item.isHidden ? '取消隐置' : '隐藏'}
                </button>
                <a href="admin-edit.html?id=${item.id}" class="px-2 py-1 bg-blue-50 text-blue-600 hover:bg-blue-100 rounded transition inline-block">编辑</a>
                <button onclick="deleteArticle('${item.id}')" class="px-2 py-1 bg-slate-100 hover:bg-rose-600 hover:text-white text-slate-500 rounded transition">删除</button>
              </td>
            </tr>
          `;
        });

        tbody.innerHTML = html;

      } catch (err) {
        console.error("加载管理列表失败:", err);
        tbody.innerHTML = `<tr><td colspan="5" class="text-center py-8 text-rose-500">读取文章失败：${err.message}</td></tr>`;
      }
    }

    // 切换精选
    async function toggleFeatured(id, current) {
      try {
        await db.collection(dbCollection).doc(id).update({
          featured: !current,
          is_featured: !current,
          isFeatured: !current
        });
        loadAdminArticles();
      } catch (e) {
        alert("更新精选状态失败：" + e.message);
      }
    }

    // 切换隐藏
    async function toggleHide(id, current) {
      try {
        await db.collection(dbCollection).doc(id).update({
          hide: !current,
          status: !current ? 'hidden' : 'published',
          isHidden: !current
        });
        loadAdminArticles();
      } catch (e) {
        alert("更新隐置状态失败：" + e.message);
      }
    }

    // 删除文章
    async function deleteArticle(id) {
      if (!confirm("确定要永久删除这篇文章吗？")) return;
      try {
        await db.collection(dbCollection).doc(id).delete();
        loadAdminArticles();
      } catch (e) {
        alert("删除文章失败：" + e.message);
      }
    }
  </script>
</body>
</html>
