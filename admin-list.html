<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章管理
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial,
sans-serif;

color:#333;

}





/* 顶部 */

.header{


background:white;

height:55px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 15px;

box-shadow:

0 2px 8px rgba(0,0,0,.08);

}



.header a{

color:#1677ff;

text-decoration:none;

font-size:14px;

}



.header-title{

font-size:18px;

font-weight:bold;

}








.container{

padding:12px;

}








/* 搜索 */

.search-box{

background:white;

padding:12px;

border-radius:10px;

margin-bottom:12px;

}



.search-box input{


width:100%;

height:40px;

border:1px solid #ddd;

border-radius:20px;

padding:0 15px;

font-size:15px;

}









/* 分类 */

.filter-box{


background:white;

padding:12px;

border-radius:10px;

margin-bottom:12px;

}



.filter-title{


font-size:15px;

font-weight:bold;

margin-bottom:8px;

}



.filter-item{


display:inline-block;

font-size:14px;

color:#1677ff;

margin-right:12px;

margin-bottom:8px;

cursor:pointer;

}










/* 文章 */

.item{


background:white;

border-radius:10px;

padding:12px;

margin-bottom:10px;

}






.item-top{


display:flex;

align-items:center;

justify-content:space-between;

gap:8px;

}







.article-title{


font-size:16px;

font-weight:bold;

flex:1;

min-width:0;


}



.article-title a{


color:#333;

text-decoration:none;


}





.summary{


margin-top:8px;

font-size:14px;

color:#666;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;


}







.meta{


margin-top:8px;

font-size:12px;

color:#888;

line-height:1.8;

}










/* 操作按钮 */

.actions{


display:flex;

flex-shrink:0;

gap:4px;

position:relative;

z-index:20;


}





.actions button{


border:0;

padding:5px 8px;

font-size:12px;

border-radius:5px;

cursor:pointer;

position:relative;

z-index:30;


}




.btn-hide{


background:#666;

color:white;

}




.btn-edit{


background:#1677ff;

color:white;

}



.btn-delete{


background:#e53935;

color:white;

}










/* 分页 */

.page{


background:white;

padding:15px;

text-align:center;

border-radius:10px;

margin-top:10px;

}



.page button{


border:0;

background:#1677ff;

color:white;

padding:8px 15px;

border-radius:5px;

margin:0 5px;

cursor:pointer;

}





.page span{

color:#555;

}








.empty{


background:white;

padding:25px;

text-align:center;

color:#999;

border-radius:10px;

}



</style>


</head>



<body>



<div class="header">


<a href="admin.html">

← 后台首页

</a>


<div class="header-title"

id="pageTitle">

文章管理

</div>


<div></div>


</div>







<div class="container">






<div class="search-box">


<input

id="search"

placeholder="搜索标题或正文"

oninput="filterArticles()">


</div>









<div class="filter-box">


<div class="filter-title">

年月分类

</div>


<div id="monthList">

</div>


</div>









<div class="filter-box">


<div class="filter-title">

标签分类

</div>


<div id="tagList">

</div>


</div>









<div id="articleList">

加载中...

</div>







<div class="page"

id="pageBox">

</div>






</div>







<script>
// Firebase配置

const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};



firebase.initializeApp(firebaseConfig);



const db = firebase.firestore();




// 当前分类

let currentType =

new URLSearchParams(location.search)

.get("type")

||"published";





let allArticles=[];

let showArticles=[];



let currentPage=1;


const pageSize=10;








// 标题


if(currentType==="published"){

document.getElementById("pageTitle")

.innerHTML="已发表文章";

}


if(currentType==="hidden"){

document.getElementById("pageTitle")

.innerHTML="隐藏文章";

}


if(currentType==="draft"){

document.getElementById("pageTitle")

.innerHTML="草稿箱";

}










// 加载文章


function loadArticles(){



db.collection("articles")

.get()



.then(snapshot=>{


allArticles=[];



snapshot.forEach(doc=>{


let data={


id:doc.id,


...doc.data()


};



if(data.status===currentType){


allArticles.push(data);


}


});





allArticles.sort((a,b)=>{


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


});






showArticles=[...allArticles];



createFilters();



renderArticles();



})


.catch(error=>{


document.getElementById("articleList")

.innerHTML=

`

<div class="empty">

加载失败：

${error.message}

</div>

`;



});



}









// 创建分类


function createFilters(){



let monthData={};


let tagData={};





allArticles.forEach(article=>{



if(article.createTime){


let date=

article.createTime.toDate();



let month=

date.getFullYear()

+"年"

+(date.getMonth()+1)

+"月";



monthData[month]=true;


}






(article.tags||[])

.forEach(tag=>{


tagData[tag]=true;


});


});









let monthHtml="";



Object.keys(monthData)

.sort()

.reverse()

.forEach(month=>{


monthHtml+=`


<span class="filter-item"

onclick="selectMonth('${month}')">

${month}

</span>


`;



});



document.getElementById("monthList")

.innerHTML=

monthHtml||"暂无";









let tagHtml="";



Object.keys(tagData)

.sort()

.forEach(tag=>{


tagHtml+=`


<span class="filter-item"

onclick="selectTag('${tag}')">

${tag}

</span>


`;



});



document.getElementById("tagList")

.innerHTML=

tagHtml||"暂无";



}









// 搜索


function filterArticles(){



let keyword=

document.getElementById("search")

.value

.trim()

.toLowerCase();





showArticles=

allArticles.filter(article=>{



return (

!keyword

||


(article.title||"")

.toLowerCase()

.includes(keyword)



||


(article.content||"")

.toLowerCase()

.includes(keyword)


);


});



currentPage=1;


renderArticles();



}









// 年月筛选


function selectMonth(month){



showArticles=

allArticles.filter(article=>{


if(!article.createTime)

return false;



let date=

article.createTime.toDate();



let value=

date.getFullYear()

+"年"

+(date.getMonth()+1)

+"月";



return value===month;



});



currentPage=1;


renderArticles();


}









// 标签筛选


function selectTag(tag){



showArticles=

allArticles.filter(article=>{


return (

article.tags||[]

)

.includes(tag);



});



currentPage=1;


renderArticles();


}











// 渲染列表


function renderArticles(){



let start=

(currentPage-1)

*

pageSize;



let list=

showArticles.slice(

start,

start+pageSize

);







if(list.length===0){



document.getElementById("articleList")

.innerHTML=

`

<div class="empty">

暂无文章

</div>

`;



document.getElementById("pageBox")

.innerHTML="";



return;


}








let html="";





list.forEach(article=>{





let hideText=

article.status==="hidden"

?

"恢复"

:

"隐藏";





html+=`


<div class="item">


<div class="item-top">


<div class="article-title">


<a href="article.html?id=${article.id}">

${article.title}

</a>


</div>



<div class="actions">



${currentType!=="draft"

?

`

<button

class="btn-hide"

data-id="${article.id}"

data-status="${article.status}"

onclick="toggleStatus(this)">

${hideText}

</button>

`

:""

}





<button

class="btn-edit"

onclick="editArticle('${article.id}')">

编辑

</button>





<button

class="btn-delete"

onclick="deleteArticle('${article.id}')">

删除

</button>



</div>



</div>






<div class="summary">


${getFirstLine(article.content)}


</div>






<div class="meta">


发布时间：

${formatDate(article.createTime)}



<br>


最后编辑：

${getLastUpdate(article.updateTime)}



<br>


标签：

${(article.tags||[]).join(" ")}


</div>



</div>


`;





});






document.getElementById("articleList")

.innerHTML=html;



showPagination();


}









// 分页


function showPagination(){



let total=

Math.ceil(

showArticles.length/pageSize

);



let html="";





if(currentPage>1){



html+=`

<button onclick="changePage(${currentPage-1})">

上一页

</button>

`;

}



html+=`

<span>

${currentPage}/${total||1}

</span>

`;





if(currentPage<total){


html+=`

<button onclick="changePage(${currentPage+1})">

下一页

</button>

`;

}



document.getElementById("pageBox")

.innerHTML=html;



}









function changePage(page){


currentPage=page;


renderArticles();


}









// 隐藏 / 恢复


function toggleStatus(button){



let id=

button.dataset.id;



let oldStatus=

button.dataset.status;





let newStatus=

oldStatus==="hidden"

?

"published"

:

"hidden";






db.collection("articles")

.doc(id)

.update({

status:newStatus

})

.then(()=>{


alert(

newStatus==="hidden"

?

"文章已隐藏"

:

"文章已恢复"

);



loadArticles();


})

.catch(error=>{


alert(

"操作失败："+error.message

);


});


}









// 编辑


function editArticle(id){


location.href=

"admin-edit.html?id="+id;


}









// 删除


function deleteArticle(id){



if(!confirm("确定删除这篇文章？"))

return;



db.collection("articles")

.doc(id)

.delete()

.then(()=>{


alert("删除成功");


loadArticles();


});


}









// 第一行


function getFirstLine(text){



if(!text)

return "";



return text

.replace(/[#>*_-]/g,"")

.split("\n")

.filter(x=>x.trim())

[0]

.substring(0,80);



}









// 发布时间


function formatDate(time){



if(time&&time.toDate){


return time.toDate()

.toLocaleDateString("zh-CN");


}



return "";

}









// 最后编辑


function getLastUpdate(arr){



if(!arr||arr.length===0)

return "暂无";



return arr[arr.length-1];


}








loadArticles();
