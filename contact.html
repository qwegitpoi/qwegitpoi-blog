<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>发送私信</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f6fa;
      font-family: "Microsoft YaHei", Arial, sans-serif;
      color: #333;
    }

    .header {
      background: white;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .08);
    }

    .header a {
      color: #1677ff;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .05);
    }

    .card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      text-align: center;
      color: #1f2937;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }

    .form-group textarea {
      height: 120px;
      resize: vertical;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #1677ff;
    }

    /* 醒目提示文字 */
    .notice-tip {
      font-size: 12px;
      color: #ff4d4f;
      margin-top: 4px;
      line-height: 1.5;
    }

    .btn-submit {
      width: 100%;
      background: #1677ff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-submit:hover {
      background: #0958d9;
    }
  </style>
</head>

<body>

  <div class="header">
    <div style="font-size: 18px; font-weight: bold;">发送私信</div>
    <a href="index.html">← 返回首页</a>
  </div>

  <div class="container">
    <div class="card">
      <h2>✉️ 给博主发私信</h2>

      <div class="form-group">
        <label for="senderName">您的称呼（可选）</label>
        <input type="text" id="senderName" placeholder="例如：张三（选填）">
      </div>

      <div class="form-group">
        <label for="contactInfo">联系方式</label>
        <input type="text" id="contactInfo" placeholder="邮箱 / 微信 / QQ 等">
        <div class="notice-tip">⚠️ 提示：请留下联系方式，私信只能接收，博主无法私信回复你。</div>
      </div>

      <div class="form-group">
        <label for="message">私信内容 *</label>
        <textarea id="message" placeholder="请输入您想对博主说的话..."></textarea>
      </div>

      <button class="btn-submit" onclick="sendMessage()">发送私信</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function sendMessage() {
      let senderName = document.getElementById("senderName").value.trim() || "热心网友";
      let contactInfo = document.getElementById("contactInfo").value.trim();
      let message = document.getElementById("message").value.trim();

      if (!message) {
        alert("请输入私信内容！");
        return;
      }

      db.collection("messages").add({
        senderName: senderName,
        contactInfo: contactInfo,
        message: message,
        createTime: firebase.firestore.FieldValue.serverTimestamp()
      }).then(() => {
        alert("私信已成功发送给博主！");
        window.location.href = "index.html";
      }).catch(e => {
        alert("发送失败：" + e.message);
      });
    }
  </script>
</body>

</html>
