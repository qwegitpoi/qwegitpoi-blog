<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
我的个人博客
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}





.header{


background:white;

padding:18px 16px;

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

z-index:10;

box-shadow:0 2px 8px rgba(0,0,0,.08);


}



.logo{

font-size:22px;

font-weight:bold;

}



.admin{


font-size:14px;

color:#1677ff;

text-decoration:none;

}





.container{

padding:15px;

}





.tools{


display:flex;

gap:12px;

margin-bottom:20px;


}



.tool{


background:white;

flex:1;

padding:15px;

border-radius:12px;

text-align:center;

text-decoration:none;

color:#333;

box-shadow:0 2px 6px rgba(0,0,0,.05);

}




.title{


font-size:22px;

font-weight:bold;

margin:20px 0 15px;

}







.card{


background:white;

padding:18px;

border-radius:12px;

margin-bottom:15px;


}



.card h2{


font-size:19px;

margin:0 0 10px;


}



.card h2 a{


color:#222;

text-decoration:none;


}





.time{


font-size:13px;

color:#999;

margin-bottom:12px;

}




.summary{


font-size:15px;

line-height:1.8;

color:#555;


}





.more{


display:block;

background:#1677ff;

color:white;

text-align:center;

padding:14px;

border-radius:25px;

text-decoration:none;

margin:25px 0;


}







.footer{


text-align:center;

font-size:13px;

color:#999;

padding:30px;

}




</style>


</head>





<body>




<div class="header">


<div class="logo">

我的博客

</div>



<a class="admin"

href="admin-login.html">

管理员登录

</a>



</div>









<div class="container">





<div class="tools">


<a class="tool"

href="search.html">

🔍

<br>

搜索文章

</a>



<a class="tool"

href="archive.html">

🏷

<br>

文章归档

</a>



</div>








<div class="title">

最新文章

</div>





<div id="list">

加载中...

</div>





<a class="more"

href="archive.html">

查看更多文章

</a>





</div>







<div class="footer">

© 我的个人博客

</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};






firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();









function load(){



db.collection("articles")

.get()



.then(snapshot=>{



let articles=[];






snapshot.forEach(doc=>{


let data=doc.data();



if(data.status==="published"){



articles.push({

id:doc.id,

...data

});



}



});








articles.sort((a,b)=>{


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


});







articles=

articles.slice(0,6);








let html="";





if(articles.length===0){



html=

"<p>暂无文章</p>";



}





articles.forEach(a=>{



html+=`


<div class="card">


<h2>


<a href="article.html?id=${a.id}">

${a.title}

</a>


</h2>




<div class="time">


${format(a.createTime)}

</div>




<div class="summary">


${summary(a.content)}

</div>



</div>



`;



});







document.getElementById(
"list"
)

.innerHTML=html;



})



.catch(e=>{


document.getElementById(
"list"
)

.innerHTML=

"文章加载失败："+e.message;



});



}









function summary(md){



if(!md)return "";



let t=md;



t=t.replace(
/#{1,6}\s/g,
""
);



t=t.replace(
/\*\*/g,
""
);



t=t.replace(
/\*/g,
""
);



t=t.replace(
/<[^>]+>/g,
""
);



t=t.replace(
/\n+/g,
" "
);






return t.length>100

?

t.substring(0,100)+"..."

:

t;



}









function format(t){



if(t&&t.toDate){


return t.toDate()

.toLocaleDateString(
"zh-CN"
);



}



return "";



}







load();



</script>



</body>


</html>
