<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
qwe博客
</title>



<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial,
sans-serif;

}




.header{

height:70px;

background:#222;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;


}



.logo{

font-size:26px;

font-weight:bold;

}




.admin-btn{


background:#1976d2;

color:white;

text-decoration:none;

padding:8px 18px;

border-radius:5px;


}




.container{

max-width:1100px;

margin:40px auto;

padding:0 20px;


}




.title{

font-size:32px;

margin-bottom:30px;


}





.article-list{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(300px,1fr));

gap:25px;


}







.article-card{


background:white;

border-radius:12px;

overflow:hidden;

box-shadow:

0 3px 12px rgba(0,0,0,.1);


}




.article-card img{


width:100%;

height:220px;

object-fit:cover;


}





.content{


padding:20px;


}



.content h2{


margin-top:0;

font-size:24px;


}




.time{


font-size:14px;

color:#888;

margin-bottom:15px;


}





.summary{


color:#555;

line-height:1.8;

height:70px;

overflow:hidden;


}





.read{


display:inline-block;

margin-top:15px;

background:#1976d2;

color:white;

text-decoration:none;

padding:8px 18px;

border-radius:5px;


}





.empty{


text-align:center;

color:#777;

font-size:18px;

}




@media(max-width:700px){



.header{

padding:0 15px;

}



.logo{

font-size:20px;

}


.container{

margin-top:20px;

}


}



</style>


</head>





<body>



<header class="header">


<div class="logo">

qwe博客

</div>



<a href="admin-login.html"

class="admin-btn">

管理员登录

</a>



</header>






<div class="container">


<h1 class="title">

最新文章

</h1>



<div id="articleList"

class="article-list">

加载中...

</div>



</div>







<script>


// =====================
// Firebase配置
// =====================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);




const db =

firebase.firestore();







function loadArticles(){



db.collection("articles")


.orderBy(
"time",
"desc"
)


.get()



.then(snapshot=>{



let html="";





if(snapshot.empty){


document.getElementById(
"articleList"
)
.innerHTML=

`

<div class="empty">

暂无文章

</div>

`;

return;


}






snapshot.forEach(doc=>{



let data =
doc.data();





// 去除HTML生成摘要


let text =

data.content

.replace(
/<[^>]*>/g,
""
);



let summary =

text.substring(
0,
120
);






html += `



<div class="article-card">





${

data.cover

?

`

<img src="${data.cover}">

`

:

""

}




<div class="content">



<h2>

${data.title}

</h2>



<div class="time">

${data.time || ""}

</div>




<div class="summary">

${summary}

...

</div>




<a class="read"

href="article.html?id=${doc.id}">

阅读全文

</a>




</div>




</div>



`;



});






document.getElementById(
"articleList"
)
.innerHTML=html;



})



.catch(error=>{


document.getElementById(
"articleList"
)

.innerHTML=

`

<div class="empty">

文章加载失败：

${error.message}

</div>

`;



});



}





loadArticles();



</script>



</body>

</html>
