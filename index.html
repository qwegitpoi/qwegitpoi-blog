<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>首页 - Rogue Blog</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
  <style>
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <header class="sticky top-0 z-50 glass-header border-b border-slate-200/80 transition-all duration-300">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <a href="index.html" class="text-xl font-bold bg-gradient-to-r from-blue-600 to-indigo-600 bg-clip-text text-transparent hover:opacity-80 transition">
        Rogue Blog
      </a>
      <div class="flex items-center space-x-3 sm:space-x-4">
        <a href="contact.html" class="inline-flex items-center text-sm text-slate-600 hover:text-blue-600 font-medium px-3 py-1.5 rounded-full hover:bg-slate-100 transition">
          📩 给博主发私信
        </a>
        <a href="admin-login.html" class="inline-flex items-center text-sm text-slate-500 hover:text-slate-800 font-medium px-3 py-1.5 rounded-full hover:bg-slate-100 transition">
          ⚙️ 管理员登录
        </a>
      </div>
    </div>
  </header>

  <main class="flex-grow max-w-5xl w-full mx-auto px-4 sm:px-6 py-8">
    
    <section class="mb-12 bg-white rounded-2xl p-6 sm:p-8 border border-slate-100 shadow-sm relative overflow-hidden">
      <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-blue-100 to-indigo-50 rounded-bl-full -z-0 opacity-50"></div>
      <div class="relative z-10 flex flex-col sm:flex-row items-center sm:items-start gap-6">
        <div class="w-20 h-20 sm:w-24 sm:h-24 rounded-full bg-gradient-to-tr from-blue-500 to-indigo-600 flex items-center justify-center text-white text-3xl font-bold shadow-md shrink-0">
          R
        </div>
        <div class="text-center sm:text-left flex-1">
          <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight">欢迎来到 Rogue Blog</h1>
          <p class="mt-2 text-slate-600 leading-relaxed max-w-2xl">
            记录技术探索、个人思考与生活随笔。很高兴与你相遇，欢迎阅读文章或留言交流。
          </p>
        </div>
      </div>
    </section>

    <section class="mb-12">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <span>🔥</span> 最新动态
        </h2>
        <a href="all-articles.html" class="text-sm font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1 transition group">
          查看全部文章 <span class="group-hover:translate-x-1 transition-transform">→</span>
        </a>
      </div>

      <div id="latest-container" class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div class="col-span-full py-12 text-center text-slate-400">正在加载最新动态...</div>
      </div>
    </section>

    <section class="mb-12">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-xl font-bold text-slate-900 flex items-center gap-2">
          <span>🌟</span> 精选文章
        </h2>
        <a href="featured.html" class="text-sm font-semibold text-amber-600 hover:text-amber-700 flex items-center gap-1 transition group">
          查看更多精选文章 <span class="group-hover:translate-x-1 transition-transform">→</span>
        </a>
      </div>

      <div id="featured-container" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div class="col-span-full py-12 text-center text-slate-400">正在加载精选文章...</div>
      </div>
    </section>

  </main>

  <footer class="border-t border-slate-200 bg-white mt-auto py-6">
    <div class="max-w-5xl mx-auto px-4 text-center text-sm text-slate-500">
      <p>© 2026 Rogue Blog. Powered by GitHub Pages & Firebase.</p>
    </div>
  </footer>

  <script>
    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qwegitpoi-blog",
      storageBucket: "qwegitpoi-blog.firebasestorage.app",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963",
      measurementId: "G-M01JQCZ0WX"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 强壮的时间解析器
    function getArticleTimestamp(data) {
      if (!data) return 0;
      const fields = ['createdAt', 'created_at', 'createTime', 'publishedAt', 'published_at', 'timestamp', 'date', 'time'];
      for (let field of fields) {
        let val = data[field];
        if (!val) continue;
        if (typeof val.toDate === 'function') {
          try { return val.toDate().getTime(); } catch(e){}
        }
        if (typeof val === 'object' && val.seconds !== undefined) {
          return val.seconds * 1000;
        }
        if (typeof val === 'number') {
          return val < 10000000000 ? val * 1000 : val;
        }
        if (typeof val === 'string') {
          let parsed = Date.parse(val.replace(/-/g, '/'));
          if (!isNaN(parsed)) return parsed;
        }
      }
      return 0;
    }

    // 时间格式化
    function parseArticleDate(data) {
      let ts = getArticleTimestamp(data);
      if (ts > 0) {
        let d = new Date(ts);
        let y = d.getFullYear();
        let m = String(d.getMonth() + 1).padStart(2, '0');
        let day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }
      return '近期发布';
    }

    // 标签解析器
    function parseArticleTag(data) {
      if (!data) return '随笔';
      let tagVal = data.tag || data.category || data.tags || data.categories;
      if (Array.isArray(tagVal) && tagVal.length > 0) return tagVal[0];
      if (typeof tagVal === 'string' && tagVal.trim() !== '') return tagVal.trim();
      return '随笔';
    }

    // 纯文本摘要提取（取前3行）
    function getSummary(content) {
      if (!content) return '暂无正文内容...';
      let plainText = content.replace(/[#*`_~\[\]()>-]/g, '').trim();
      return plainText || '暂无正文内容...';
    }

    // 渲染页面数据
    async function loadIndexData() {
      const latestBox = document.getElementById('latest-container');
      const featuredBox = document.getElementById('featured-container');

      try {
        let docs = [];
        // 兼容 posts 和 articles 两个集合
        try {
          const snapshot = await db.collection("posts").get();
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
        } catch(e) {}

        if (docs.length === 0) {
          const snapshot = await db.collection("articles").get();
          snapshot.forEach(doc => docs.push({ id: doc.id, ...doc.data() }));
        }

        // 过滤公开文章（未被隐藏）
        let publicArticles = docs.filter(a => !(a.hide === true || a.status === 'hidden' || a.isHidden === true));

        // 按首次发表时间戳精准倒序排序
        publicArticles.sort((a, b) => getArticleTimestamp(b) - getArticleTimestamp(a));

        // 1. 渲染最新动态（最多最新 2 篇）
        let latestArticles = publicArticles.slice(0, 2);
        if (latestArticles.length === 0) {
          latestBox.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400">暂无公开发布的最新动态。</div>`;
        } else {
          latestBox.innerHTML = latestArticles.map(a => {
            let dateStr = parseArticleDate(a);
            let tagStr = parseArticleTag(a);
            let summary = getSummary(a.content);
            return `
              <a href="article.html?id=${a.id}" class="group bg-white rounded-xl p-6 border border-slate-200/80 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <span class="inline-block px-2.5 py-0.5 text-xs font-semibold text-blue-600 bg-blue-50 rounded-full border border-blue-100">
                      ${tagStr}
                    </span>
                    <span class="text-xs text-slate-400 font-mono">${dateStr}</span>
                  </div>
                  <h3 class="text-lg font-bold text-slate-900 group-hover:text-blue-600 transition-colors line-clamp-1 mb-2">
                    ${a.title || '无标题'}
                  </h3>
                  <p class="text-sm text-slate-600 line-clamp-3 leading-relaxed mb-4">
                    ${summary}
                  </p>
                </div>
                <div class="text-xs font-semibold text-blue-600 group-hover:translate-x-1 transition-transform flex items-center gap-1">
                  阅读全文 <span>→</span>
                </div>
              </a>
            `;
          }).join('');
        }

        // 2. 渲染精选文章（筛选 featured/is_featured 标记，最多 3 篇）
        let featuredArticles = publicArticles.filter(a => a.featured === true || a.is_featured === true || a.isFeatured === true).slice(0, 3);
        if (featuredArticles.length === 0) {
          featuredBox.innerHTML = `<div class="col-span-full py-8 text-center text-slate-400 bg-white rounded-xl border border-dashed border-slate-200">暂无标记为精选的文章。</div>`;
        } else {
          featuredBox.innerHTML = featuredArticles.map(a => {
            let dateStr = parseArticleDate(a);
            let tagStr = parseArticleTag(a);
            let summary = getSummary(a.content);
            return `
              <a href="article.html?id=${a.id}" class="group bg-white rounded-xl p-5 border border-amber-200/80 shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-200 flex flex-col justify-between relative overflow-hidden">
                <div class="absolute top-0 right-0 bg-amber-500 text-white text-[10px] font-bold px-2 py-0.5 rounded-bl">
                  ★ 精选
                </div>
                <div>
                  <div class="flex items-center justify-between gap-2 mb-3">
                    <span class="inline-block px-2.5 py-0.5 text-xs font-semibold text-amber-700 bg-amber-50 rounded-full border border-amber-200">
                      ${tagStr}
                    </span>
                    <span class="text-xs text-slate-400 font-mono">${dateStr}</span>
                  </div>
                  <h3 class="text-base font-bold text-slate-900 group-hover:text-amber-600 transition-colors line-clamp-1 mb-2">
                    ${a.title || '无标题'}
                  </h3>
                  <p class="text-xs text-slate-600 line-clamp-3 leading-relaxed mb-4">
                    ${summary}
                  </p>
                </div>
                <div class="text-xs font-semibold text-amber-600 group-hover:translate-x-1 transition-transform flex items-center gap-1">
                  查看精选 <span>→</span>
                </div>
              </a>
            `;
          }).join('');
        }

      } catch (err) {
        console.error("加载首页失败:", err);
        latestBox.innerHTML = `<div class="col-span-full py-8 text-center text-red-500">加载数据失败，请检查网络或配置。</div>`;
        featuredBox.innerHTML = `<div class="col-span-full py-8 text-center text-red-500">加载精选失败。</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadIndexData);
  </script>
</body>
</html>
