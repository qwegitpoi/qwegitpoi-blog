<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人博客</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    /* --------------------------------------------------
       1. 全局与 UI 变量定义 (高质感现代配色)
       -------------------------------------------------- */
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #f1f5f9;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      --shadow-hover: 0 10px 25px -5px rgba(37, 99, 235, 0.1);
      --radius-lg: 16px;
      --radius-md: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      padding: 24px 16px;
    }

    .container {
      max-width: 740px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }

    /* --------------------------------------------------
       2. 毛玻璃固顶 Header 导航
       -------------------------------------------------- */
    header {
      position: sticky;
      top: 12px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 999px;
      box-shadow: var(--shadow-md);
    }

    .blog-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      letter-spacing: -0.02em;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-links a {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    .nav-links a:hover { color: var(--primary-color); }

    .btn-pill {
      font-size: 0.8rem !important;
      padding: 6px 14px;
      border-radius: 999px;
      background-color: #eff6ff;
      color: var(--primary-color) !important;
      font-weight: 600 !important;
      transition: all 0.2s ease !important;
    }

    .btn-pill:hover {
      background-color: var(--primary-color);
      color: #ffffff !important;
    }

    /* --------------------------------------------------
       3. 个人 Hero 介绍看板
       -------------------------------------------------- */
    .hero-card {
      background: linear-gradient(135deg, #ffffff 0%, #f0f7ff 100%);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .hero-avatar {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
    }

    .hero-info h1 {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      margin-bottom: 4px;
    }

    .hero-info p {
      font-size: 0.875rem;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* --------------------------------------------------
       4. 板块标题与卡片布局 (保持紧凑与美感)
       -------------------------------------------------- */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .article-list {
      display: flex;
      flex-direction: column;
      gap: 12px; /* 保持适度紧凑卡片间距 */
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius-md);
      padding: 14px 18px; /* 紧凑内边距 */
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      line-height: 1.35;   /* 紧凑行距 */
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
      border-color: #dbeafe;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .title {
      font-size: 1.025rem;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      line-height: 1.3;
      transition: color 0.15s ease;
    }

    .title:hover { color: var(--primary-color); }

    /* 动态标签 (胶囊风格) */
    .tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background-color: #eff6ff;
      color: var(--primary-color);
      font-weight: 600;
      white-space: nowrap;
    }

    .tag-featured {
      background-color: #fff7ed;
      color: #ea580c;
    }

    .summary {
      font-size: 0.875rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      line-height: 1.42;
      display: -webkit-box;
      -webkit-line-clamp: 2; /* 最多保留 2 行截断 */
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      font-size: 0.75rem;
      color: #94a3b8;
    }

    /* 更多链接容器 */
    .more-link-container {
      margin-top: 10px;
      text-align: right;
    }

    .more-link {
      font-size: 0.85rem;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
      transition: opacity 0.15s ease;
    }

    .more-link:hover {
      text-decoration: underline;
      opacity: 0.85;
    }

    .loading-card {
      background: #ffffff;
      border-radius: var(--radius-md);
      padding: 16px;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.875rem;
      border: 1px dashed #cbd5e1;
    }

    footer {
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 12px;
      padding-top: 16px;
      border-top: 1px solid var(--border-color);
    }
  </style>
</head>
<body>

  <div class="container">
    
    <header>
      <a href="index.html" class="blog-title">My Blog</a>
      <nav class="nav-links">
        <a href="all-articles.html">全部文章</a>
        <a href="featured.html">精选文章</a>
        <a href="contact.html" class="btn-pill">📩 私信博主</a>
        <a href="admin.html">后台管理</a>
      </nav>
    </header>

    <div class="hero-card">
      <div class="hero-avatar">B</div>
      <div class="hero-info">
        <h1>欢迎来到我的博客</h1>
        <p>记录技术探索、生活感悟与深度思考空间。</p>
      </div>
    </div>

    <section>
      <div class="section-header">
        <h2 class="section-title">⚡ 最新动态</h2>
      </div>

      <div id="latest-list" class="article-list">
        <div class="loading-card">正在加载最新文章...</div>
      </div>

      <div class="more-link-container">
        <a href="all-articles.html" class="more-link">查看全部文章 →</a>
      </div>
    </section>

    <section>
      <div class="section-header">
        <h2 class="section-title">🌟 精选文章</h2>
      </div>

      <div id="featured-list" class="article-list">
        <div class="loading-card">正在加载精选文章...</div>
      </div>

      <div class="more-link-container">
        <a href="featured.html" class="more-link">查看更多精选文章 →</a>
      </div>
    </section>

    <footer>
      <p>© 2026 My Blog. Powered by GitHub Pages & Firebase.</p>
    </footer>

  </div>

  <script>
    // Firebase 初始化（请确保替换为您自己的 config 凭证）
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_AUTH_DOMAIN",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_STORAGE_BUCKET",
      messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    // 解析首次发表时间（兼容各种格式）
    function parseArticleDate(item) {
      const val = item.createdAt || item.created_at || item.date || item.timestamp;
      if (!val) return 0;
      if (typeof val === 'number') return val;
      if (val.seconds) return val.seconds * 1000;
      if (typeof val === 'string') return new Date(val).getTime() || 0;
      if (val.toDate && typeof val.toDate === 'function') return val.toDate().getTime();
      return 0;
    }

    // 格式化时间输出
    function formatDateStr(ms) {
      if (!ms) return '未记录时间';
      return new Date(ms).toLocaleDateString('zh-CN', {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit'
      });
    }

    // 判断隐藏文章
    function isHidden(data) {
      return data.hide === true || data.hidden === true || data.status === 'hidden';
    }

    // 判断精选文章
    function isFeatured(data) {
      return data.featured === true || data.is_featured === true || data.isFeatured === true;
    }

    // 核心读取与渲染逻辑
    async function initBlogHome() {
      try {
        let docs = [];

        // 优先尝试 posts 集合，若空尝试 articles 集合
        let snapshot = await db.collection('posts').get();
        if (snapshot.empty) {
          snapshot = await db.collection('articles').get();
        }

        snapshot.forEach(doc => {
          const data = doc.data();
          if (!isHidden(data)) {
            docs.push({ id: doc.id, ...data });
          }
        });

        // 按首次发表时间从新到旧降序排列
        docs.sort((a, b) => parseArticleDate(b) - parseArticleDate(a));

        // 1. 渲染最新 2 篇
        renderLatestList(docs.slice(0, 2));

        // 2. 筛选精选文章并渲染最新 3 篇
        const featuredDocs = docs.filter(item => isFeatured(item));
        renderFeaturedList(featuredDocs.slice(0, 3));

      } catch (err) {
        console.error("加载文章数据失败:", err);
        document.getElementById('latest-list').innerHTML = `<div class="loading-card">文章加载失败，请检查数据库设置。</div>`;
        document.getElementById('featured-list').innerHTML = `<div class="loading-card">精选文章加载失败。</div>`;
      }
    }

    // 渲染最新文章 2 篇
    function renderLatestList(list) {
      const container = document.getElementById('latest-list');
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="loading-card">暂无公开文章。</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const timeMs = parseArticleDate(item);
        const pubDate = formatDateStr(timeMs);
        const tagText = item.tag || item.tagName || '随笔';

        return `
          <article class="card">
            <div class="card-header">
              <a href="article.html?id=${item.id}" class="title">${item.title || '无标题文章'}</a>
              <span class="tag">${tagText}</span>
            </div>
            <p class="summary">${item.summary || item.content || ''}</p>
            <div class="card-footer">
              <span>发表于 ${pubDate}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    // 渲染精选文章 3 篇
    function renderFeaturedList(list) {
      const container = document.getElementById('featured-list');
      if (!list || list.length === 0) {
        container.innerHTML = `<div class="loading-card">暂无精选内容，可在后台点击“精选”加入。</div>`;
        return;
      }

      container.innerHTML = list.map(item => {
        const timeMs = parseArticleDate(item);
        const pubDate = formatDateStr(timeMs);
        const tagText = item.tag || item.tagName || '精选';

        return `
          <article class="card">
            <div class="card-header">
              <a href="article.html?id=${item.id}" class="title">${item.title || '无标题文章'}</a>
              <span class="tag tag-featured">★ ${tagText}</span>
            </div>
            <p class="summary">${item.summary || item.content || ''}</p>
            <div class="card-footer">
              <span>发表于 ${pubDate}</span>
            </div>
          </article>
        `;
      }).join('');
    }

    // 启动运行
    initBlogHome();
  </script>
</body>
</html>
