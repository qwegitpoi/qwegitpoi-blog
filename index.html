<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
qwe博客
</title>


<link rel="stylesheet" href="css/style.css">



<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


</head>



<body>



<!-- 顶部导航 -->

<header class="header">


<div class="logo">

qwe博客

</div>



<a href="admin-login.html"

class="nav-btn">

管理员登录

</a>



</header>






<div class="container">



<h1 class="page-title">

最新文章

</h1>





<div id="articleList"

class="article-list">


加载中...


</div>





<a href="archive.html"

class="more-btn">

查看更多文章

</a>




</div>









<script>


// ========================
// Firebase配置
// ========================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();






// ========================
// 加载首页文章
// ========================


function loadHomeArticles(){



db.collection("articles")


.where(
"status",
"==",
"published"
)


.orderBy(
"createTime",
"desc"
)


.limit(6)


.get()



.then(snapshot=>{



let html="";





if(snapshot.empty){


html=

`

<div class="article-card">

暂无文章

</div>

`;



document.getElementById(
"articleList"
)
.innerHTML=html;


return;


}






snapshot.forEach(doc=>{


let data =
doc.data();




let summary =
removeHTML(
data.content || ""
)
.substring(
0,
120
);





html += `



<div class="article-card">



<h2>

<a href="article.html?id=${doc.id}">

${data.title}

</a>

</h2>



<div class="article-meta">

发布时间：

${formatTime(data.createTime)}

</div>




<div class="article-summary">

${summary}...

</div>



</div>



`;




});





document.getElementById(
"articleList"
)
.innerHTML=html;




})



.catch(error=>{


document.getElementById(
"articleList"
)
.innerHTML=

`

<div class="article-card">

文章加载失败：

${error.message}

</div>

`;



});



}









// ========================
// 去除HTML标签
// ========================


function removeHTML(str){


return str.replace(
/<[^>]*>/g,
""
);


}








// ========================
// 时间格式化
// ========================


function formatTime(time){



if(!time){

return "";

}




if(time.toDate){


return time.toDate()
.toLocaleString(
"zh-CN"
);


}



return time;



}







loadHomeArticles();



</script>



</body>


</html>
