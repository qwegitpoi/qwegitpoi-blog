<!DOCTYPE html>
<html lang="zh-CN">

<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
qwe个人博客
</title>



<link rel="stylesheet" href="css/style.css">



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{


margin:0;

font-family:

"Microsoft YaHei",
Arial,
sans-serif;

background:#f5f6fa;


}





.header{


height:70px;

background:#222;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;


}




.logo{


font-size:26px;

font-weight:bold;


}




.admin-btn{


color:white;

text-decoration:none;

background:#1976d2;

padding:8px 15px;

border-radius:6px;


}




.container{


max-width:1100px;

margin:40px auto;

padding:0 20px;


}





.blog-title{


font-size:30px;

margin-bottom:30px;


}





.article-list{


display:grid;

grid-template-columns:

repeat(auto-fit,minmax(300px,1fr));

gap:25px;


}





.article-card{


background:white;

border-radius:12px;

overflow:hidden;

box-shadow:

0 3px 12px rgba(0,0,0,.08);


}





.article-card img{


width:100%;

height:220px;

object-fit:cover;


}





.article-body{


padding:20px;


}





.article-body h2{


margin-top:0;


}




.time{


color:#888;

font-size:14px;


}





.summary{


line-height:1.7;

color:#555;

height:70px;

overflow:hidden;


}





.read-btn{


display:inline-block;

margin-top:15px;

background:#1976d2;

color:white;

padding:8px 18px;

border-radius:5px;

text-decoration:none;


}





.empty{


text-align:center;

color:#777;


}



</style>


</head>





<body>



<header class="header">


<div class="logo">

qwe个人博客

</div>



<a class="admin-btn" href="admin-login.html">

管理员登录

</a>


</header>







<div class="container">



<h1 class="blog-title">

最新文章

</h1>



<div id="articleList" class="article-list">

加载中...

</div>



</div>







<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};



firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();







function loadArticles(){



db.collection("articles")

.orderBy(
"time",
"desc"
)

.get()


.then(snapshot=>{


let html="";



if(snapshot.empty){


document.getElementById(
"articleList"
)
.innerHTML=

"<div class='empty'>暂无文章</div>";


return;


}





snapshot.forEach(doc=>{



let data=
doc.data();




let summary=
data.content

.replace(/<[^>]+>/g,"")

.substring(0,120);




html+=`


<div class="article-card">





${
data.cover

?

`

<img src="${data.cover}">

`

:

""

}





<div class="article-body">


<h2>

${data.title}

</h2>



<div class="time">

${data.time}

</div>




<p class="summary">

${summary}

...

</p>



<a class="read-btn"

href="article.html?id=${doc.id}">

阅读全文

</a>



</div>



</div>


`;



});




document.getElementById(
"articleList"
)
.innerHTML=html;



})


.catch(error=>{


document.getElementById(
"articleList"
)

.innerHTML=

"读取失败："+error.message;



});



}



loadArticles();



</script>




</body>

</html>
