<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>qwe博客 - 首页</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-body: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-hover: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-body);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 顶部导航 */
    .header {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 14px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-nav {
      font-size: 14px;
      font-weight: 500;
      color: var(--text-muted);
      text-decoration: none;
      padding: 6px 14px;
      border-radius: 20px;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-nav:hover {
      color: var(--primary);
      background-color: #eff6ff;
    }

    .btn-nav-primary {
      background-color: var(--primary);
      color: white !important;
    }

    .btn-nav-primary:hover {
      background-color: var(--primary-hover) !important;
    }

    /* 主容器 */
    .container {
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 30px 20px 60px;
      flex: 1;
    }

    /* 个人英雄榜 (Hero Section) */
    .hero {
      background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 32px;
      display: flex;
      align-items: center;
      gap: 20px;
      box-shadow: var(--shadow-sm);
    }

    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--primary);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 700;
      flex-shrink: 0;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.3);
    }

    .hero-info h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .hero-info p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 栏目标题 */
    .section-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 文章列表卡片 */
    .article-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px 24px;
      margin-bottom: 16px;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: var(--shadow-sm);
      position: relative;
    }

    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-hover);
      border-color: #cbd5e1;
    }

    .article-title {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.4;
      margin-bottom: 10px;
    }

    .article-title a {
      color: var(--text-main);
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .article-title a:hover {
      color: var(--primary);
    }

    .summary {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.6;
      margin-bottom: 14px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta {
      font-size: 13px;
      color: #94a3b8;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .tags-container {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tag-badge {
      background: #eff6ff;
      color: var(--primary);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }

    /* 查看更多按钮 */
    .more-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 14px;
      border-radius: 12px;
      color: var(--primary);
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      margin-top: 24px;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .more-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
    }

    /* 空状态/加载中 */
    .status-box {
      background: var(--card-bg);
      border: 1px dashed var(--border-color);
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      border-radius: 12px;
      font-size: 15px;
    }

    /* 页脚 */
    .footer {
      border-top: 1px solid var(--border-color);
      background: white;
      text-align: center;
      padding: 24px;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: auto;
    }

    .footer a {
      color: var(--primary);
      text-decoration: none;
    }

    @media (max-width: 640px) {
      .hero {
        flex-direction: column;
        text-align: center;
      }
      .container {
        padding-top: 16px;
      }
    }
  </style>
</head>

<body>

  <header class="header">
    <a href="index.html" class="logo">
      <i class="fa-solid fa-blog" style="color: var(--primary);"></i> qwe博客
    </a>
    <nav class="nav-links">
      <a href="contact.html" class="btn-nav btn-nav-primary">
        <i class="fa-regular fa-paper-plane"></i> 📩 私信博主
      </a>
      <a href="admin-login.html" class="btn-nav">
        <i class="fa-solid fa-user-gear"></i> 管理员
      </a>
    </nav>
  </header>

  <div class="container">

    <section class="hero">
      <div class="avatar">
        <i class="fa-solid fa-code"></i>
      </div>
      <div class="hero-info">
        <h1>欢迎来到我的个人博客 👋</h1>
        <p>记录技术探索、个人思考与生活日常。基于 GitHub Pages & Firebase 构建。</p>
      </div>
    </section>

    <main>
      <div class="section-title">
        <span><i class="fa-regular fa-clock" style="color: var(--primary);"></i> 最新文章</span>
      </div>

      <div id="list">
        <div class="status-box">
          <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> 正在精彩呈现，加载中...
        </div>
      </div>

      <a class="more-btn" href="archive.html">
        查看全部文章 <i class="fa-solid fa-arrow-right"></i>
      </a>
    </main>

  </div>

  <footer class="footer">
    <p>© 2026 qwe博客. Powered by <a href="https://pages.github.com/" target="_blank">GitHub Pages</a> & <a href="https://firebase.google.com/" target="_blank">Firebase</a>.</p>
  </footer>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    function loadArticles() {
      db.collection("articles")
        .where("status", "==", "published")
        .get()
        .then(snapshot => {
          let list = [];
          snapshot.forEach(doc => {
            list.push({
              id: doc.id,
              ...doc.data()
            });
          });

          list.sort((a, b) => (b.createTime?.seconds || 0) - (a.createTime?.seconds || 0));
          show(list.slice(0, 6));
        })
        .catch(e => {
          document.getElementById("list").innerHTML = `
            <div class="status-box" style="color: #ef4444;">
              <i class="fa-solid fa-triangle-exclamation"></i> 文章加载失败：${e.message}
            </div>
          `;
        });
    }

    function show(list) {
      if (list.length === 0) {
        document.getElementById("list").innerHTML = `
          <div class="status-box">
            <i class="fa-regular fa-folder-open" style="font-size: 24px; display: block; margin-bottom: 8px;"></i> 暂无已发布的文章
          </div>
        `;
        return;
      }

      let html = "";
      list.forEach(a => {
        let tagsHtml = (a.tags || [])
          .map(t => `<span class="tag-badge"># ${escapeHtml(t)}</span>`)
          .join("");

        html += `
          <article class="article-card">
            <h2 class="article-title">
              <a href="article.html?id=${a.id}">${escapeHtml(a.title || "无标题")}</a>
            </h2>
            <p class="summary">${firstLine(a.content)}</p>
            <div class="meta">
              <div class="meta-item">
                <i class="fa-regular fa-calendar"></i> ${format(a.createTime)}
              </div>
              ${tagsHtml ? `<div class="tags-container">${tagsHtml}</div>` : ''}
            </div>
          </article>
        `;
      });

      document.getElementById("list").innerHTML = html;
    }

    function firstLine(text) {
      if (!text) return "暂无摘要内容...";
      return text
        .replace(/[#>\*_\-]/g, "")
        .split("\n")
        .filter(x => x.trim())[0]?.substring(0, 100) || "暂无摘要内容...";
    }

    function format(t) {
      if (t && t.toDate) {
        return t.toDate().toLocaleDateString("zh-CN");
      }
      return "未知时间";
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    loadArticles();
  </script>
</body>

</html>
