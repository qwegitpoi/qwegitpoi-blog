<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>博客管理后台</title>


<!-- Quill 富文本编辑器 -->

<link 
href="https://cdn.quilljs.com/1.3.7/quill.snow.css"
rel="stylesheet">


<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>



<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>



<style>


*{

box-sizing:border-box;

}


body{

margin:0;

background:#f5f6fa;

font-family:
"Microsoft YaHei",
Arial,
sans-serif;

}



.header{

height:65px;

background:#222;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

}



.logo{

font-size:24px;

font-weight:bold;

}



.header button{

background:#1976d2;

border:none;

color:white;

padding:8px 18px;

border-radius:5px;

cursor:pointer;

}



.container{

max-width:1100px;

margin:30px auto;

background:white;

padding:30px;

border-radius:12px;

}



input{

width:100%;

padding:12px;

font-size:18px;

border:1px solid #ddd;

border-radius:5px;

margin-bottom:20px;

}



#editor{

height:400px;

background:white;

margin-bottom:20px;

}



.toolbar-tip{

color:#666;

font-size:14px;

margin-bottom:10px;

}



button{

padding:10px 20px;

border:none;

border-radius:5px;

background:#1976d2;

color:white;

cursor:pointer;

margin-right:10px;

}



button:hover{

opacity:.85;

}



.cancel{

background:#777;

}



.message{

color:#1976d2;

margin:15px 0;

}



.article-card{

border:1px solid #ddd;

border-radius:8px;

padding:15px;

margin:15px 0;

}



.article-card img{

width:180px;

height:120px;

object-fit:cover;

border-radius:6px;

}



.article-card h3{

margin:10px 0;

}



.delete{

background:#d32f2f;

}



.edit{

background:#388e3c;

}



@media(max-width:700px){


.container{

margin:10px;

padding:15px;

}


#editor{

height:300px;

}


}


</style>


</head>



<body>


<header class="header">


<div class="logo">

博客管理后台

</div>


<button onclick="logout()">

退出登录

</button>


</header>





<div class="container">


<h2>
文章编辑
</h2>


<input 
id="title"
placeholder="请输入文章标题">



<div class="toolbar-tip">

支持：标题、加粗、列表、链接、图片上传

</div>



<div id="editor"></div>



<button onclick="saveArticle()">

发布文章

</button>


<button 
class="cancel"
id="cancelBtn"
onclick="cancelEdit()"
style="display:none">

取消编辑

</button>



<div id="message" class="message"></div>



<hr>



<h2>

文章管理

</h2>



<div id="articleList">

正在加载...

</div>



</div>







<script>


// ============================
// Firebase 配置
// ============================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};




firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();



const db =
firebase.firestore();



const storage =
firebase.storage();




// 当前编辑文章ID

let editId = null;


// 当前文章图片

let uploadImages = [];




// ============================
// 初始化 Quill
// ============================


const quill = new Quill(
"#editor",
{

theme:"snow",


modules:{


toolbar:{


container:[


[
"header",
1,
2
],


[
"bold",
"italic",
"underline"
],


[
"blockquote"
],


[
"list",
"ordered",
"bullet"
],


[
"link",
"image"
]


],


handlers:{


image:function(){

chooseImage();

}


}


}



}


});




// ============================
// 登录状态检测
// ============================


auth.onAuthStateChanged(user=>{


    if(!user){


        window.location.href =
        "admin-login.html";


    }else{


        loadArticles();


    }


});




// ============================
// 图片上传
// ============================


function chooseImage(){


    const input =
    document.createElement("input");


    input.type="file";


    input.accept="image/*";


    input.click();



    input.onchange=function(){


        const file =
        input.files[0];


        if(file){


            uploadImage(file);


        }


    };


}







function uploadImage(file){



    const filename =

    Date.now()+"_"+file.name;



    const ref =

    storage.ref(
        "images/"+filename
    );



    const task =

    ref.put(file);





    task.on(

        "state_changed",


        snapshot=>{


            const progress =

            snapshot.bytesTransferred /

            snapshot.totalBytes *

            100;



            document.getElementById("message")
            .innerHTML =

            "上传图片："

            + progress.toFixed(0)

            +"%";


        },


        error=>{


            alert(
                "上传失败："+error.message
            );


        },


        ()=>{


            task.snapshot.ref
            .getDownloadURL()

            .then(url=>{


                uploadImages.push(url);



                let range =
                quill.getSelection();



                if(range){


                    quill.insertEmbed(

                        range.index,

                        "image",

                        url

                    );


                }



                document.getElementById("message")
                .innerHTML =
                "图片上传成功";


            });



        }


    );


}







// ============================
// 保存文章
// 新增 / 编辑
// ============================


function saveArticle(){



    const title =

    document.getElementById("title")
    .value.trim();




    const content =

    quill.root.innerHTML;




    if(!title){


        alert(
            "请输入文章标题"
        );


        return;


    }





    const articleData = {


        title:title,


        content:content,


        cover:

        uploadImages.length>0

        ?

        uploadImages[0]

        :

        "",



        images:

        uploadImages,



        author:

        "管理员",



        time:

        new Date()
        .toLocaleString("zh-CN")

    };







    // 编辑模式

    if(editId){



        db.collection("articles")

        .doc(editId)

        .update(articleData)


        .then(()=>{


            alert(
                "修改成功"
            );


            cancelEdit();


            loadArticles();


        });



    }



    // 新增模式

    else{



        db.collection("articles")

        .add(articleData)


        .then(()=>{


            alert(
                "发布成功"
            );


            clearEditor();


            loadArticles();


        });



    }



}








// ============================
// 读取文章列表
// ============================


function loadArticles(){



    db.collection("articles")

    .orderBy(
        "time",
        "desc"
    )

    .get()



    .then(snapshot=>{



        let html="";




        if(snapshot.empty){


            html =
            "暂无文章";


        }



        snapshot.forEach(doc=>{


            const data =
            doc.data();




            html += `


            <div class="article-card">



            ${
                data.cover

                ?

                `<img src="${data.cover}">`

                :

                ""

            }



            <h3>

            ${data.title}

            </h3>



            <p>

            ${data.time}

            </p>



            <button 
            class="edit"
            onclick="editArticle('${doc.id}')">

            编辑

            </button>



            <button 
            class="delete"
            onclick="deleteArticle('${doc.id}')">

            删除

            </button>



            </div>


            `;



        });





        document.getElementById(
            "articleList"
        )
        .innerHTML = html;



    })


    .catch(error=>{


        document.getElementById(
            "articleList"
        )
        .innerHTML =

        "读取失败："+error.message;



    });



}








// ============================
// 编辑文章
// ============================


function editArticle(id){



    db.collection("articles")

    .doc(id)

    .get()


    .then(doc=>{



        if(!doc.exists){

            return;

        }




        const data =
        doc.data();




        editId=id;




        document.getElementById(
            "title"
        )
        .value=data.title;





        quill.root.innerHTML =
        data.content;





        uploadImages =
        data.images || [];





        document.querySelector(
            "button[onclick='saveArticle()']"
        )
        .innerHTML =
        "保存修改";





        document.getElementById(
            "cancelBtn"
        )
        .style.display =
        "inline-block";





        window.scrollTo(
            0,
            0
        );



    });



}








// ============================
// 取消编辑
// ============================


function cancelEdit(){


    editId=null;


    clearEditor();



    document.querySelector(
        "button[onclick='saveArticle()']"
    )
    .innerHTML =
    "发布文章";



    document.getElementById(
        "cancelBtn"
    )
    .style.display =
    "none";



}








function clearEditor(){



    document.getElementById(
        "title"
    )
    .value="";



    quill.setContents([]);



    uploadImages=[];



}








// ============================
// 删除文章
// 同时删除Storage图片
// ============================


async function deleteArticle(id){



    if(
        !confirm(
            "确定删除这篇文章？"
        )
    ){

        return;

    }




    const ref =

    db.collection("articles")
    .doc(id);




    const doc =
    await ref.get();



    const data =
    doc.data();





    if(data.images){



        for(
            const url of data.images
        ){


            try{


                const imgRef =
                storage.refFromURL(url);



                await imgRef.delete();



            }

            catch(e){


                console.log(
                    "图片删除失败",
                    e
                );


            }



        }



    }






    await ref.delete();




    alert(
        "删除完成"
    );



    loadArticles();



}








// ============================
// 退出登录
// ============================


function logout(){



    auth.signOut()

    .then(()=>{


        window.location.href =
        "admin-login.html";


    });


}
