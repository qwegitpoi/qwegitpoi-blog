<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>我的个人博客 - 首页</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: rgba(255, 255, 255, 0.9);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius-lg: 16px;
      --radius-md: 10px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.6;
      padding-bottom: 60px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* 毛玻璃 Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 0;
      margin-bottom: 30px;
    }

    .header-content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--text-main);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links {
      display: flex;
      gap: 16px;
      align-items: center;
    }

    .nav-item {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 500;
      font-size: 0.9rem;
      transition: color 0.2s ease;
    }

    .nav-item:hover {
      color: var(--primary-color);
    }

    .btn-admin {
      background-color: #f1f5f9;
      color: var(--text-main);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-admin:hover {
      background-color: #e2e8f0;
    }

    /* Hero 区域 */
    .hero {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
      color: #ffffff;
      padding: 40px 32px;
      border-radius: var(--radius-lg);
      margin-bottom: 40px;
      box-shadow: var(--shadow-md);
    }

    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 10px;
    }

    .hero p {
      font-size: 1.05rem;
      opacity: 0.9;
    }

    /* 区域标题 */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .view-all-link {
      font-size: 0.9rem;
      color: var(--primary-color);
      text-decoration: none;
      font-weight: 600;
    }

    .view-all-link:hover {
      text-decoration: underline;
    }

    /* 文章网格布局 */
    .article-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 40px;
    }

    /* 卡片通用样式 */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 20px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .card-featured {
      border: 1.5px solid #fed7aa;
      background: linear-gradient(180deg, #fffbf5 0%, #ffffff 100%);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .badge-tag {
      background-color: #eff6ff;
      color: var(--primary-color);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .badge-featured {
      background-color: #fff7ed;
      color: #ea580c;
      border: 1px solid #ffedd5;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }

    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card-title a {
      color: var(--text-main);
      text-decoration: none;
    }

    .card-title a:hover {
      color: var(--primary-color);
    }

    .card-excerpt {
      font-size: 0.875rem;
      color
