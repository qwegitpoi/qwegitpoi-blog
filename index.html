<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>博客管理后台 - 控制台</title>
  
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      min-height: 100vh;
    }

    /* 顶部导航与毛玻璃效果 */
    .header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      box-shadow: var(--shadow);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 统一的退出登录按钮样式 */
    .btn-logout {
      background: #fee2e2;
      color: var(--danger);
      border: 1px solid #fca5a5;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
      transform: translateY(-1px);
    }

    /* 主内容区容器 */
    .container {
      max-width: 1000px;
      margin: 32px auto;
      padding: 0 20px;
    }

    .welcome-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      margin-bottom: 24px;
    }

    .welcome-card h2 {
      font-size: 18px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    .welcome-card p {
      font-size: 14px;
      color: var(--text-muted);
    }

    /* 数据看板卡片网格 */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px -4px rgba(0, 0, 0, 0.08);
      border-color: #cbd5e1;
    }

    .card .icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .card-info {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary);
    }
  </style>
</head>

<body>

  <div class="header">
    <h1>⚙️ 博客管理后台</h1>
    <button onclick="logout()" class="btn-logout">
      <span>🚪</span> 退出登录
    </button>
  </div>

  <div class="container">
    <div class="welcome-card">
      <h2>欢迎回来，管理员！</h2>
      <p>在下方快捷看板中可以快速管理已发布的文章、审核隐藏内容或管理草稿。</p>
    </div>

    <div class="grid">
      <div class="card" onclick="location.href='admin-edit.html'">
        <div class="icon">✏️</div>
        <div class="card-title">新建文章</div>
        <div class="card-info" style="font-size: 14px; color: var(--text-muted); font-weight: normal;">点击撰写新内容</div>
      </div>

      <div class="card" onclick="location.href='admin-list.html?type=published'">
        <div class="icon">📢</div>
        <div class="card-title">已发布文章</div>
        <div class="card-info" id="publishedCount">加载中...</div>
      </div>

      <div class="card" onclick="location.href='admin-list.html?type=hidden'">
        <div class="icon">🔒</div>
        <div class="card-title">隐藏文章</div>
        <div class="card-info" id="hiddenCount">加载中...</div>
      </div>

      <div class="card" onclick="location.href='admin-list.html?type=draft'">
        <div class="icon">📝</div>
        <div class="card-title">草稿箱</div>
        <div class="card-info" id="draftCount">加载中...</div>
      </div>
    </div>
  </div>

  <script>
    // Firebase 配置
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    // 1. 登录拦截与安全验证
    auth.onAuthStateChanged((user) => {
      if (!user) {
        location.href = "admin-login.html";
      } else {
        loadCounts();
      }
    });

    // 2. 登出逻辑
    function logout() {
      if (confirm("确定要退出登录吗？")) {
        auth.signOut().then(() => {
          location.href = "admin-login.html";
        }).catch((err) => {
          alert("退出失败：" + err.message);
        });
      }
    }

    // 3. 统计数量加载
    async function loadCounts() {
      try {
        const snap = await db.collection("articles").get();
        let pub = 0, hid = 0, dra = 0;
        snap.forEach(doc => {
          const status = doc.data().status;
          if (status === "published") pub++;
          else if (status === "hidden") hid++;
          else if (status === "draft") dra++;
        });

        document.getElementById("publishedCount").innerText = pub;
        document.getElementById("hiddenCount").innerText = hid;
        document.getElementById("draftCount").innerText = dra;
      } catch (e) {
        console.error("数据加载失败:", e);
      }
    }
  </script>
</body>
</html>
