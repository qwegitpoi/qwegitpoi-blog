</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="glass-header sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-base sm:text-lg font-bold text-slate-800 hover:text-blue-600 transition">
        <i class="fa-solid fa-book-open text-blue-600"></i>
        <span>Rogue</span>
      </a>
      <nav class="flex items-center space-x-2 sm:space-x-3 text-xs sm:text-sm font-medium">
        <a href="index.html" class="text-blue-600 font-semibold bg-blue-50 px-2.5 py-1 rounded-lg transition">首页</a>
        <a href="all-articles.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">全部文章</a>
        <a href="featured.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">★ 精选</a>
        <a href="contact.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">📩 私信</a>
        <a href="admin-login.html" class="text-slate-400 hover:text-slate-700 px-1.5 py-1 transition" title="后台管理">
          <i class="fa-solid fa-gear"></i>

      </nav>
    </div>

  <main class="max-w-5xl mx-auto px-3 sm:px-6 py-6 w-full flex-grow space-y-8">
    
    <div class="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-2xl p-6 sm:p-8 text-white shadow-md relative overflow-hidden">
      <div class="relative z-10 space-y-2">
        <span class="px-2.5 py-0.5 rounded-full bg-white/20 text-xs font-semibold uppercase tracking-wider">Welcome</span>
        <h1 class="text-2xl sm:text-3xl font-bold">记录技术、思考与生活</h1>
        <p class="text-blue-100 text-xs sm:text-sm max-w-xl">欢迎来到我的blog，这里汇集了最新的技术经验总结、思考随笔与精选深度文章。</p>
      </div>
      <i class="fa-solid fa-laptop-code absolute -right-4 -bottom-4 text-8xl text-white/10 pointer-events-none"></i>
    </div>

    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-star text-amber-500 me-2"></i> 精选文章
        </h2>
        <a href="featured.html" class="text-xs text-amber-600 font-semibold hover:text-amber-700 flex items-center">
          查看更多精选 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
        </a>
      </div>

      <div id="featured-container" class="grid grid-cols-1 sm:grid-cols-3 gap-4">
        <div class="col-span-3 text-center py-8 bg-white rounded-xl border border-slate-100 shadow-sm">
          <i class="fa-solid fa-circle-notch fa-spin text-xl text-amber-500 mb-2"></i>
          <p class="text-slate-400 text-xs">正在读取精选文章...</p>
        </div>
      </div>
    </section>

    <section>
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-bold text-slate-800 flex items-center">
          <i class="fa-solid fa-clock-rotate-left text-blue-600 me-2"></i> 最新动态
        </h2>
        <a href="all-articles.html" class="text-xs text-blue-600 font-semibold hover:text-blue-700 flex items-center">
          查看全部文章 <i class="fa-solid fa-chevron-right ml-1 text-[10px]"></i>
        </a>
      </div>

      <div id="latest-container" class="space-y-4">
        <div class="text-center py-8 bg-white rounded-xl border border-slate-100 shadow-sm">
          <i class="fa-solid fa-circle-notch fa-spin text-xl text-blue-600 mb-2"></i>
          <p class="text-slate-400 text-xs">正在读取最新动态...</p>
        </div>
      </div>
    </section>

  </main>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-[11px] text-slate-500 mt-12">
    <p>© 2026 我的blog. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qwegitpoi-blog",
      storageBucket: "qwegitpoi-blog.firebasestorage.app",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963",
      measurementId: "G-M01JQCZ0WX"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ⭐ 全能强壮时间戳解析器
    function getArticleTimestamp(data) {
      if (!data || typeof data !== 'object') return 0;
      const raw = data.createdAt || data.created_at || data.createTime || data.create_time || data.created ||
                  data.publishedAt || data.published_at || data.pubDate || data.pub_date ||
                  data.timestamp || data.date || data.time || data.datetime ||
                  data.updatedAt || data.updated_at;

      if (raw === undefined || raw === null) return 0;

      try {
        if (typeof raw.toDate === 'function') {
          const d = raw.toDate();
          if (d && !isNaN(d.getTime())) return d.getTime();
        }
        if (raw instanceof Date) {
          if (!isNaN(raw.getTime())) return raw.getTime();
        }
        if (typeof raw === 'object') {
          const secs = raw.seconds !== undefined ? raw.seconds : raw._seconds;
          if (typeof secs === 'number') return secs * 1000;
        }
        if (typeof raw === 'number') {
          if (isNaN(raw)) return 0;
          return raw < 1e11 ? raw * 1000 : raw;
        }
        if (typeof raw === 'string') {
          const trimmed = raw.trim();
          if (!trimmed) return 0;
          if (/^\d+$/.test(trimmed)) {
            const num = Number(trimmed);
            return num < 1e11 ? num * 1000 : num;
          }
          const formattedStr = trimmed.replace(/-/g, '/').replace('T', ' ').replace('Z', '');
          const d = new Date(formattedStr);
          if (!isNaN(d.getTime())) return d.getTime();
          const d2 = new Date(trimmed);
          if (!isNaN(d2.getTime())) return d2.getTime();
        }
      } catch (e) {
        console.error("时间戳解析异常:", e);
      }
      return 0;
    }

    function parseArticleDate(data) {
      const ts = getArticleTimestamp(data);
      if (ts > 0) {
        const d = new Date(ts);
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}/${m}/${day}`;
      }
      if (data && typeof data === 'object') {
        for (const key of ['date', 'time', 'createdAt', 'created_at', 'publishedAt']) {
          if (typeof data[key] === 'string' && data[key].trim() !== '') {
            return data[key].trim();
          }
        }
      }
      return "暂无时间";
    }

    function parseArticleTag(data) {
      if (!data) return "随笔";
      let t = data.tag || data.category || data.tags || data.categories;
      if (Array.isArray(t)) return t.length > 0 ? t[0] : "随笔";
      if (typeof t === 'string' && t.trim() !== '') return t.trim();
      return "随笔";
    }

    function extractSummary(content) {
      if (!content) return "暂无正文内容...";
      return content
        .replace(/#+\s+/g, '')
        .replace(/[\*\_~`]/g, '')
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
        .replace(/!\[[^\]]*\]\([^\)]+\)/g, '')
        .replace(/>\s+/g, '')
        .replace(/\n+/g, ' ')
        .trim();
    }

    async function loadIndexData() {
      const featuredContainer = document.getElementById('featured-container');
      const latestContainer = document.getElementById('latest-container');

      try {
        let snapshot;
        try {
          snapshot = await db.collection("posts").get();
          if (snapshot.empty) throw new Error("posts empty");
        } catch (e) {
          snapshot = await db.collection("articles").get();
        }

        let allList = [];
        snapshot.forEach(doc => {
          const data = doc.data();
          const isHidden = data.hide === true || data.status === 'hidden' || data.isHidden === true;
          if (isHidden) return;

          allList.push({
            id: doc.id,
            title: data.title || "无标题文章",
            content: data.content || "",
            tag: parseArticleTag(data),
            dateStr: parseArticleDate(data),
            timestamp: getArticleTimestamp(data),
            isFeatured: data.featured === true || data.is_featured === true || data.isFeatured === true
          });
        });

        // ⭐ 首次发表时间倒序排列
        allList.sort((a, b) => b.timestamp - a.timestamp);

        // 1. 渲染精选文章（最新 3 篇）
        const featuredList = allList.filter(item => item.isFeatured).slice(0, 3);
        if (featuredList.length === 0) {
          featuredContainer.innerHTML = `
            <div class="col-span-3 text-center py-6 bg-amber-50/50 rounded-xl border border-amber-100 p-4">
              <p class="text-amber-800 text-xs">博主正在挑选精彩内容，先看看最新动态吧！</p>
            </div>`;
        } else {
          let fHtml = '';
          featuredList.forEach(item => {
            fHtml += `
              <article class="article-card bg-white rounded-xl p-4 border border-amber-100/80 shadow-sm relative group flex flex-col justify-between">
                <div>
                  <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
                    <span class="px-2 py-0.5 rounded-full bg-amber-50 text-amber-600 font-medium text-[11px]">
                      ★ ${item.tag}
                    </span>
                    <span>${item.dateStr}</span>
                  </div>
                  <h3 class="text-sm font-bold text-slate-800 group-hover:text-amber-600 transition mb-1.5 line-clamp-2">
                    <a href="article.html?id=${item.id}">${item.title}</a>
                  </h3>
                  <p class="text-slate-600 text-xs line-clamp-3 leading-relaxed mb-3">
                    ${extractSummary(item.content)}
                  </p>
                </div>
                <div class="pt-2 border-t border-slate-50 flex items-center justify-between text-[11px]">
                  <a href="article.html?id=${item.id}" class="text-amber-600 hover:text-amber-700 font-semibold">阅读详情 →</a>
                </div>
              </article>
            `;
          });
          featuredContainer.innerHTML = fHtml;
        }

        // 2. 渲染最新动态（最新 2 篇）
        const latestList = allList.slice(0, 2);
        if (latestList.length === 0) {
          latestContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-6">暂无发布的公开文章</p>`;
        } else {
          let lHtml = '';
          latestList.forEach(item => {
            lHtml += `
              <article class="article-card bg-white rounded-xl p-4 sm:p-5 border border-slate-100 shadow-sm relative group">
                <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
                  <div class="flex items-center space-x-2">
                    <span class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-medium text-[11px]">
                      ${item.tag}
                    </span>
                    <span>•</span>
                    <span><i class="fa-regular fa-calendar-alt me-1"></i>${item.dateStr}</span>
                  </div>
                </div>

                <h2 class="text-base sm:text-lg font-bold text-slate-800 group-hover:text-blue-600 transition mb-1.5">
                  <a href="article.html?id=${item.id}">${item.title}</a>
                </h2>

                <p class="text-slate-600 text-xs sm:text-sm line-clamp-3 leading-relaxed mb-3">
                  ${extractSummary(item.content)}
                </p>

                <div class="pt-2 border-t border-slate-50 flex items-center justify-between text-xs">
                  <a href="article.html?id=${item.id}" class="text-blue-600 hover:text-blue-700 font-semibold inline-flex items-center">
                    阅读全文 <i class="fa-solid fa-arrow-right ml-1 text-[10px]"></i>
                  </a>
                  <span class="text-slate-300 text-[10px]">点击查看详情</span>
                </div>
              </article>
            `;
          });
          latestContainer.innerHTML = lHtml;
        }

      } catch (err) {
        console.error("加载首页失败:", err);
      }
    }

    window.addEventListener('DOMContentLoaded', loadIndexData);
  </script>
</body>
