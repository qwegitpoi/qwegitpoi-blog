<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
我的个人博客
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

margin:0;

background:#f5f6fa;

font-family:
"Microsoft YaHei",
Arial;

}



.header{

background:white;

height:70px;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 40px;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}



.logo{

font-size:24px;

font-weight:bold;

}



.nav a{

margin-left:20px;

text-decoration:none;

}



.container{

max-width:1000px;

margin:40px auto;

}



.article-card{

background:white;

padding:25px;

margin-bottom:20px;

border-radius:10px;

}



.article-card h2{

margin-top:0;

}



.article-card a{

color:#333;

text-decoration:none;

}



.summary{

color:#555;

line-height:1.8;

}



.time{

font-size:14px;

color:#888;

}



button{

padding:10px 20px;

cursor:pointer;

}



</style>


</head>



<body>



<header class="header">


<div class="logo">

我的个人博客

</div>



<div class="nav">


<a href="index.html">

首页

</a>


<a href="archive.html">

文章列表

</a>


<a href="admin-login.html">

管理员登录

</a>


</div>



</header>







<div class="container">


<h1>

最新文章

</h1>



<div id="articleList">

加载中...

</div>




<div style="text-align:center;margin:30px;">


<a href="archive.html">


<button>

查看更多文章

</button>


</a>


</div>



</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();







function loadArticles(){



db.collection("articles")

.get()



.then(snapshot=>{



let articles=[];






snapshot.forEach(doc=>{


let data=doc.data();



if(data.status==="published"){


articles.push({

id:doc.id,

...data

});


}



});







articles.sort((a,b)=>{


let ta =
a.createTime?.seconds || 0;



let tb =
b.createTime?.seconds || 0;



return tb-ta;



});







articles =
articles.slice(0,6);






let html="";






if(articles.length===0){


html="<p>暂无文章</p>";


}






articles.forEach(article=>{



html += `



<div class="article-card">


<h2>


<a href="article.html?id=${article.id}">


${article.title}


</a>


</h2>



<div class="time">


发布时间：

${formatTime(article.createTime)}


</div>



<p class="summary">


${getSummary(article.content)}


</p>



</div>


`;



});








document.getElementById(
"articleList"
)

.innerHTML=html;



})



.catch(error=>{


document.getElementById(
"articleList"
)

.innerHTML=

"文章加载失败："+error.message;



});



}









// Markdown摘要处理


function getSummary(md){



if(!md){

return "";

}



let text=md;



// 去标题符号


text=text.replace(
/#{1,6}\s/g,
""
);



// 去粗体


text=text.replace(
/\*\*/g,
""
);



// 去斜体


text=text.replace(
/\*/g,
""
);



// 去链接格式


text=text.replace(
/\[([^\]]+)\]\([^)]+\)/g,
"$1"
);



// 去多余换行


text=text.replace(
/\n+/g,
" "
);





if(text.length>120){


return text.substring(0,120)+"...";


}



return text;



}








function formatTime(time){


if(time && time.toDate){


return time.toDate()

.toLocaleDateString(
"zh-CN"
);


}



return "";



}







loadArticles();



</script>



</body>


</html>
