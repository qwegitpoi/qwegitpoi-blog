<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私信信箱 - 后台</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f5f5; font-family: "Microsoft YaHei", Arial; color: #333; }
    .header { height: 55px; background: white; display: flex; align-items: center; justify-content: space-between; padding: 0 15px; box-shadow: 0 2px 6px #ddd; }
    .header a { text-decoration: none; color: #1677ff; font-size: 14px; }
    .title { font-size: 18px; font-weight: bold; }
    .container { padding: 15px; max-width: 800px; margin: 0 auto; }
    .msg-card { background: white; padding: 15px; border-radius: 8px; margin-bottom: 12px; box-shadow: 0 2px 5px rgba(0,0,0,.05); }
    .msg-header { display: flex; justify-content: space-between; font-size: 13px; color: #888; margin-bottom: 8px; border-bottom: 1px dashed #eee; padding-bottom: 6px; }
    .sender-name { font-size: 15px; font-weight: bold; color: #1677ff; }
    .contact-info { font-size: 13px; color: #666; margin-bottom: 8px; background: #f8f9fa; padding: 6px 10px; border-radius: 4px; }
    .msg-content { font-size: 15px; line-height: 1.6; color: #333; white-space: pre-wrap; margin-bottom: 10px; }
    .actions { text-align: right; }
    .delete-btn { background: #e53935; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; }
    .empty { background: white; padding: 30px; text-align: center; color: #999; border-radius: 8px; }
  </style>
</head>

<body>

  <div class="header">
    <a href="admin.html">← 返回后台</a>
    <div class="title">私信信箱</div>
    <div></div>
  </div>

  <div class="container">
    <div id="list">验证身份中...</div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    auth.onAuthStateChanged(user => {
      if (user) {
        loadMessages();
      } else {
        alert("请先登录管理员账号");
        window.location.href = "admin-login.html";
      }
    });

    function loadMessages() {
      db.collection("messages").get().then(snapshot => {
        let list = [];
        snapshot.forEach(doc => { list.push({ id: doc.id, ...doc.data() }); });
        list.sort((a, b) => (b.createTime?.seconds || 0) - (a.createTime?.seconds || 0));

        if (list.length === 0) {
          document.getElementById("list").innerHTML = `<div class="empty">信箱空空如也，暂无私信</div>`;
          return;
        }

        let html = "";
        list.forEach(m => {
          html += `
            <div class="msg-card">
              <div class="msg-header">
                <span class="sender-name">${escapeHtml(m.senderName || "匿名")}</span>
                <span>${format(m.createTime)}</span>
              </div>
              <div class="contact-info">📞 联系方式：${escapeHtml(m.contactInfo || "未留联系方式")}</div>
              <div class="msg-content">${escapeHtml(m.message || "")}</div>
              <div class="actions">
                <button class="delete-btn" onclick="deleteMessage('${m.id}')">删除私信</button>
              </div>
            </div>
          `;
        });
        document.getElementById("list").innerHTML = html;
      }).catch(e => {
        document.getElementById("list").innerHTML = `<div class="empty">加载私信失败：${e.message}</div>`;
      });
    }

    function deleteMessage(id) {
      if (!confirm("确定删除这条私信？")) return;
      db.collection("messages").doc(id).delete().then(() => {
        loadMessages();
      }).catch(e => {
        alert("删除失败：" + e.message);
      });
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    function format(t) {
      return (t && t.toDate) ? t.toDate().toLocaleString("zh-CN") : "";
    }
  </script>
</body>

</html>
