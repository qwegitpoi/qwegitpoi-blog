<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
搜索文章
</title>



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}





.header{


background:white;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:

0 2px 8px rgba(0,0,0,.08);


}



.header a{

color:#1677ff;

text-decoration:none;

font-size:14px;

}



.container{

padding:15px;

}




.search-box{

background:white;

padding:15px;

border-radius:10px;

}




input{

width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:25px;

font-size:16px;

}





.article{


background:white;

padding:15px;

margin-top:12px;

border-radius:10px;


}




.article h2{


font-size:18px;

margin:0 0 10px;


}



.article h2 a{


text-decoration:none;

color:#333;


}



.summary{

font-size:14px;

color:#555;

line-height:1.7;

}



.meta{

font-size:12px;

color:#999;

margin-top:10px;

}




.empty{


background:white;

padding:20px;

border-radius:10px;

text-align:center;

color:#888;

}



</style>


</head>




<body>



<div class="header">


<a href="index.html">

← 首页

</a>



<span>

搜索

</span>



</div>








<div class="container">



<div class="search-box">


<input

id="keyword"

placeholder="输入关键词搜索"

oninput="search()">


</div>





<div id="list">


请输入关键词


</div>




</div>







<script>



const firebaseConfig={



apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const db=

firebase.firestore();



let articles=[];







function load(){



db.collection("articles")

.where(
"status",
"==",
"published"
)

.get()



.then(snapshot=>{


articles=[];



snapshot.forEach(doc=>{


articles.push({

id:doc.id,

...doc.data()

});


});


});



}









function search(){



let key=

document.getElementById("keyword")

.value

.trim()

.toLowerCase();





if(!key){


document.getElementById("list")

.innerHTML=

"请输入关键词";


return;


}





let result=

articles.filter(a=>{


return (


(a.title||"")

.toLowerCase()

.includes(key)



||



(a.content||"")

.toLowerCase()

.includes(key)


);


});





show(result);



}








function show(list){



if(list.length===0){


document.getElementById("list")

.innerHTML=

`

<div class="empty">

没有找到相关文章

</div>

`;

return;


}





let html="";



list.forEach(a=>{


html+=`


<div class="article">


<h2>


<a href="article.html?id=${a.id}">

${a.title}

</a>


</h2>




<div class="summary">

${firstLine(a.content)}

</div>



<div class="meta">

${format(a.createTime)}

&nbsp;

${(a.tags||[]).join(" ")}

</div>



</div>


`;



});





document.getElementById("list")

.innerHTML=

html;


}








function firstLine(text){


if(!text)

return "";



return text

.replace(/[#>*_-]/g,"")

.split("\n")

.filter(x=>x.trim())

[0]

.substring(0,100);


}







function format(t){



if(t&&t.toDate){



return t.toDate()

.toLocaleDateString("zh-CN");


}



return "";

}



load();


</script>



</body>

</html>
