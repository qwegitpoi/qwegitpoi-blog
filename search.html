<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
搜索文章
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}


body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}




.header{


background:white;

padding:16px;

display:flex;

justify-content:space-between;

align-items:center;

position:sticky;

top:0;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}




.header h1{

font-size:22px;

margin:0;

}



.home{


color:#1677ff;

text-decoration:none;

font-size:14px;

}




.container{


padding:15px;

}





.search-box{


background:white;

padding:15px;

border-radius:12px;

margin-bottom:20px;


}



input{


width:100%;

padding:14px;

font-size:16px;

border:1px solid #ddd;

border-radius:25px;


}





.result{


background:white;

padding:18px;

border-radius:12px;

margin-bottom:15px;

}



.result a{


font-size:18px;

font-weight:bold;

color:#222;

text-decoration:none;


}




.time{


font-size:13px;

color:#999;

margin:8px 0;


}




.summary{


font-size:15px;

line-height:1.7;

color:#555;


}





.empty{


background:white;

padding:30px;

text-align:center;

color:#888;

border-radius:12px;


}


</style>



</head>






<body>



<div class="header">


<h1>

搜索文章

</h1>


<a class="home"

href="index.html">

返回首页

</a>


</div>








<div class="container">





<div class="search-box">


<input id="keyword"

placeholder="输入关键词搜索..."

oninput="search()">



</div>





<div id="results">


请输入关键词

</div>






</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();





let articles=[];









// 加载文章


function loadArticles(){



db.collection("articles")

.get()



.then(snapshot=>{


snapshot.forEach(doc=>{


let data=doc.data();



if(data.status==="published"){



articles.push({

id:doc.id,

...data

});


}



});



})



.catch(e=>{


document.getElementById(
"results"
)

.innerHTML=

"加载失败："+e.message;


});



}











// 搜索


function search(){



let key=

document.getElementById(
"keyword"
)

.value

.trim()

.toLowerCase();






if(!key){


document.getElementById(
"results"
)

.innerHTML=

"请输入关键词";


return;


}







let list=

articles.filter(a=>{



let title=

(a.title||"")
.toLowerCase();



let content=

(a.content||"")
.toLowerCase();





return title.includes(key)

||

content.includes(key);



});








showResults(list);



}









function showResults(list){



let html="";





if(list.length===0){


html=

`

<div class="empty">

没有找到相关文章

</div>

`;



}







list.forEach(a=>{



html+=`


<div class="result">


<a href="article.html?id=${a.id}">


${a.title}


</a>



<div class="time">


发布时间：

${format(a.createTime)}

</div>




<div class="summary">


${summary(a.content)}


</div>



</div>



`;



});







document.getElementById(
"results"
)

.innerHTML=html;



}









function summary(md){



if(!md)return "";



let t=md;



t=t.replace(
/#{1,6}\s/g,
""
);



t=t.replace(
/\*\*/g,
""
);



t=t.replace(
/\*/g,
""
);



t=t.replace(
/<[^>]+>/g,
""
);



t=t.replace(
/\n+/g,
" "
);






return t.length>100

?

t.substring(0,100)+"..."

:

t;



}









function format(t){


if(t&&t.toDate){


return t.toDate()

.toLocaleDateString(
"zh-CN"
);



}



return "";



}








loadArticles();



</script>



</body>

</html>
