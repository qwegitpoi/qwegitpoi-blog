<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理员登录</title>

  <link rel="stylesheet" href="css/style.css">

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

  <style>
    .login-box {
      max-width: 420px;
      margin: 100px auto;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,.1);
    }

    .login-box h1 {
      text-align: center;
      margin-bottom: 30px;
    }

    .login-box input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 16px;
      box-sizing: border-box;
    }

    .login-box button {
      width: 100%;
      margin-top: 20px;
      padding: 12px;
      font-size: 16px;
      background: #1677ff;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .error {
      color: #d32f2f;
      margin-top: 15px;
      text-align: center;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #1677ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="logo">qwe博客</div>
    <a href="index.html" class="nav-btn">返回首页</a>
  </header>

  <div class="login-box">
    <h1>管理员登录</h1>

    <input id="email" type="email" placeholder="请输入邮箱">
    <br><br>
    <input id="password" type="password" placeholder="请输入密码">

    <button onclick="login()">登录</button>

    <div id="error" class="error"></div>

    <a href="index.html" class="back">返回首页</a>
  </div>

  <script>
    // Firebase配置
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // 登录检测（如果已登录，可自动跳转到后台主页）
    auth.onAuthStateChanged(user => {
      if (user) {
        console.log("当前用户:", user.email);
      }
    });

    // 登录函数
    function login() {
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();

      if (!email || !password) {
        document.getElementById("error").innerHTML = "请输入邮箱和密码";
        return;
      }

      document.getElementById("error").innerHTML = "登录中...";

      auth.signInWithEmailAndPassword(email, password)
        .then(() => {
          window.location.href = "admin.html";
        })
        .catch(error => {
          document.getElementById("error").innerHTML = "登录失败：" + error.message;
        });
    }
  </script>

</body>

</html>
