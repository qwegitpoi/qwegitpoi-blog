<!DOCTYPE html>
<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
管理员登录
</title>



<link rel="stylesheet" href="css/style.css">



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>



<style>


.login-box{


max-width:420px;

margin:100px auto;

background:white;

padding:40px;

border-radius:10px;

box-shadow:

0 3px 15px rgba(0,0,0,.1);


}



.login-box h1{


text-align:center;

margin-bottom:30px;


}



.login-box button{


width:100%;

margin-top:20px;

font-size:16px;


}



.error{


color:#d32f2f;

margin-top:15px;

text-align:center;


}



.back{


display:block;

text-align:center;

margin-top:20px;


}



</style>



</head>




<body>




<header class="header">


<div class="logo">

qwe博客

</div>



<a href="index.html"

class="nav-btn">

返回首页

</a>



</header>








<div class="login-box">


<h1>

管理员登录

</h1>




<input

id="email"

type="email"

placeholder="邮箱"

value="flashzeng@gmail.com"

>




<br><br>




<input

id="password"

type="password"

placeholder="密码"

value="12345678"

>





<button onclick="login()">

登录

</button>





<div id="error"

class="error">

</div>




<a href="index.html"

class="back">

返回首页

</a>



</div>










<script>





// ========================
// Firebase配置
// ========================



const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);




const auth = firebase.auth();








// ========================
// 登录检测
// ========================



auth.onAuthStateChanged(user=>{


if(user){



// 已登录


console.log(
"当前用户:",
user.email
);



}



});









// ========================
// 登录函数
// ========================


function login(){



let email =

document.getElementById(
"email"
)
.value;



let password =

document.getElementById(
"password"
)
.value;






document.getElementById(
"error"
)
.innerHTML="登录中...";






auth.signInWithEmailAndPassword(

email,

password

)



.then(()=>{



window.location.href=

"admin.html";



})



.catch(error=>{



document.getElementById(
"error"
)
.innerHTML=

"登录失败："

+

error.message;



});



}





</script>





</body>


</html>
