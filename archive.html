<!DOCTYPE html>
<html lang="zh-CN">

<head>


<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章归档
</title>



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

margin:0;

}



.header{

background:white;

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 2px 8px rgba(0,0,0,.1);

}



.container{

max-width:1000px;

margin:30px auto;

}




button{

padding:10px 18px;

cursor:pointer;

}



.tags-box{

background:white;

padding:20px;

border-radius:10px;

margin-bottom:30px;

}



.tag{

display:inline-block;

padding:6px 15px;

background:#eee;

margin:5px;

border-radius:20px;

cursor:pointer;

}



.tag:hover{

background:#ddd;

}



.active{

background:#1677ff;

color:white;

}




.group{

background:white;

padding:25px;

margin-bottom:30px;

border-radius:10px;

}



.month-title{

font-size:25px;

border-bottom:1px solid #ddd;

padding-bottom:10px;

}



.article{

padding:15px 0;

border-bottom:1px solid #eee;

}



.article:last-child{

border:none;

}



.article a{

text-decoration:none;

color:#333;

font-size:20px;

}



.time{

font-size:14px;

color:#888;

}



.empty{

background:white;

padding:30px;

}




</style>


</head>






<body>



<div class="header">


<h1>

文章归档

</h1>



<a href="index.html">

<button>

返回首页

</button>

</a>


</div>









<div class="container">





<div class="tags-box">


<h2>

文章标签

</h2>


<div id="tags">

加载中...

</div>


</div>






<div id="current">

</div>






<div id="archive">

加载中...

</div>





</div>









<script>





const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();







let allArticles=[];



let currentTag="";







// 获取标签参数


let params =
new URLSearchParams(
location.search
);



currentTag =
params.get("tag") || "";









function loadArticles(){



db.collection("articles")

.get()



.then(snapshot=>{



snapshot.forEach(doc=>{


let data =
doc.data();



if(data.status==="published"){



allArticles.push({

id:doc.id,

...data

});


}



});







allArticles.sort((a,b)=>{


let ta =
a.createTime?.seconds || 0;


let tb =
b.createTime?.seconds || 0;


return tb-ta;


});





showTags();


showArchive();



})

.catch(error=>{


document.getElementById(
"archive"
)

.innerHTML=

"加载失败："+error.message;


});



}











// 标签统计


function showTags(){



let count={};





allArticles.forEach(article=>{



if(article.tags){



article.tags.forEach(tag=>{


count[tag]=(count[tag]||0)+1;



});


}



});






let html="";



if(!currentTag){


html+=`

<span class="tag active">

全部

</span>

`;

}

else{


html+=`

<span class="tag"

onclick="selectTag('')">

全部

</span>

`;

}









Object.keys(count)

.forEach(tag=>{



html+=`


<span class="tag ${tag===currentTag?'active':''}"

onclick="selectTag('${tag}')">


${tag}

(${count[tag]})


</span>


`;



});






document.getElementById(
"tags"
)

.innerHTML=html;



}









function selectTag(tag){



if(tag){


location.href=

"archive.html?tag="+

encodeURIComponent(tag);


}

else{


location.href="archive.html";


}


}











// 显示文章


function showArchive(){



let articles=allArticles;



if(currentTag){



articles=

articles.filter(article=>{


return article.tags &&

article.tags.includes(currentTag);



});



}






if(currentTag){


document.getElementById(
"current"
)

.innerHTML=

`

<h2>

当前标签：

${currentTag}

</h2>

`;

}


else{


document.getElementById(
"current"
)

.innerHTML="";


}







let groups={};





articles.forEach(article=>{



let d=getDate(article.createTime);



let key=

d.year+"年"+d.month+"月";





if(!groups[key]){


groups[key]=[];


}



groups[key].push(article);



});








let html="";





if(articles.length===0){


html=

`

<div class="empty">

暂无相关文章

</div>

`;


}





Object.keys(groups)

.forEach(month=>{



html+=`

<div class="group">


<div class="month-title">

${month}

</div>


`;







groups[month].forEach(article=>{



html+=`

<div class="article">


<a href="article.html?id=${article.id}">

${article.title}

</a>



<div class="time">

${formatTime(article.createTime)}

</div>


</div>


`;



});






html+="</div>";



});








document.getElementById(
"archive"
)

.innerHTML=html;



}









function getDate(time){



if(time&&time.toDate){


let d=time.toDate();



return {

year:d.getFullYear(),

month:d.getMonth()+1

};


}



return {

year:"未知",

month:"未知"

};


}









function formatTime(time){



if(time&&time.toDate){



return time.toDate()

.toLocaleDateString(
"zh-CN"
);



}



return "";



}







loadArticles();



</script>



</body>

</html>
