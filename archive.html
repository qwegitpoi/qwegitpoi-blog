<!DOCTYPE html>
<html lang="zh-CN">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
文章列表
</title>


<link rel="stylesheet" href="css/style.css">



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



</head>



<body>



<header class="header">


<div class="logo">

qwe博客

</div>


<a href="index.html"

class="nav-btn">

返回首页

</a>


</header>







<div class="container">



<a href="index.html"

class="back-home">

← 返回首页

</a>




<h1 class="page-title">

全部文章

</h1>




<div id="archiveList">

加载中...

</div>





</div>









<script>


// =====================
// Firebase配置
// =====================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();








// 保存文章结构


let articles=[];









function loadArticles(){



db.collection("articles")


.where(
"status",
"==",
"published"
)


.orderBy(
"createTime",
"desc"
)


.get()



.then(snapshot=>{



articles=[];




snapshot.forEach(doc=>{


let data =
doc.data();



articles.push({

id:doc.id,

...data


});



});




showArchive();



})



.catch(error=>{


document.getElementById(
"archiveList"
)
.innerHTML=

`

<div class="article-card">

加载失败：

${error.message}

</div>

`;



});



}








// =====================
// 分类显示
// =====================


function showArchive(){



let groups={};





articles.forEach(article=>{



let date =
getDate(article.createTime);



let year =
date.year;



let month =
date.month;




if(!groups[year]){


groups[year]={};


}



if(!groups[year][month]){


groups[year][month]=[];


}



groups[year][month]
.push(article);



});






let html="";





Object.keys(groups)

.sort(
(a,b)=>b-a
)

.forEach(year=>{





html += `


<div class="year-title">

${year}年

</div>


`;





Object.keys(groups[year])

.sort(
(a,b)=>b-a
)

.forEach(month=>{





html += `


<div class="month-title">

${month}月

</div>


`;






groups[year][month]

.forEach(article=>{





html += `


<div class="archive-item">


<h3>

<a href="article.html?id=${article.id}">

${article.title}

</a>

</h3>



<div class="article-meta">

${formatTime(article.createTime)}

</div>


</div>


`;





});





});





});







document.getElementById(
"archiveList"
)
.innerHTML=html;



}








// =====================
// 日期处理
// =====================


function getDate(time){



let d;



if(time && time.toDate){


d=time.toDate();


}

else{


d=new Date(time);


}





return {


year:d.getFullYear(),


month:d.getMonth()+1


};



}









function formatTime(time){



if(time && time.toDate){


return time.toDate()
.toLocaleString(
"zh-CN"
);


}



return time || "";



}







loadArticles();



</script>





</body>


</html>
