<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
文章列表
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

}



.header{


background:white;

padding:20px 40px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:0 2px 8px rgba(0,0,0,.08);

}



.container{


max-width:1000px;

margin:40px auto;

}




.year-group{


background:white;

padding:25px;

margin-bottom:30px;

border-radius:10px;

}




.year-title{


font-size:26px;

margin-bottom:20px;

border-bottom:1px solid #eee;

padding-bottom:10px;

}




.article-item{


padding:15px 0;

border-bottom:1px solid #eee;

}



.article-item:last-child{


border-bottom:none;


}



.article-title{


font-size:20px;

}



.article-title a{


text-decoration:none;

color:#333;


}



.time{


font-size:14px;

color:#888;

margin-top:8px;

}



button{


padding:10px 18px;

cursor:pointer;

}



</style>


</head>



<body>



<div class="header">


<h1>

文章列表

</h1>



<a href="index.html">


<button>

返回首页

</button>


</a>


</div>







<div class="container">


<div id="archive">


加载中...

</div>


</div>









<script>



// Firebase配置


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};







firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();









// 加载文章


function loadArchive(){



db.collection("articles")

.get()



.then(snapshot=>{



let articles=[];





snapshot.forEach(doc=>{



let data=doc.data();




// 只显示已发布文章


if(data.status==="published"){



articles.push({


id:doc.id,


...data


});



}



});








// 时间排序


articles.sort((a,b)=>{


let ta =
a.createTime?.seconds || 0;


let tb =
b.createTime?.seconds || 0;



return tb-ta;



});








// 按年月分组



let groups={};





articles.forEach(article=>{



let date =
getDate(article.createTime);



let key =

date.year+"年"+date.month+"月";





if(!groups[key]){


groups[key]=[];


}



groups[key].push(article);



});









let html="";





if(articles.length===0){


html=

"<h3>暂无文章</h3>";


}






// 年月排序


Object.keys(groups)

.forEach(month=>{





html+=`


<div class="year-group">


<div class="year-title">

${month}

</div>



`;







groups[month].forEach(article=>{



html+=`


<div class="article-item">



<div class="article-title">


<a href="article.html?id=${article.id}">


${article.title}


</a>


</div>




<div class="time">


发布时间：

${formatTime(article.createTime)}


</div>



</div>


`;



});







html+=`

</div>

`;




});







document.getElementById(
"archive"
)

.innerHTML=html;



})



.catch(error=>{


document.getElementById(
"archive"
)

.innerHTML=

"文章加载失败："+error.message;



});



}











// 获取年月


function getDate(time){



if(time && time.toDate){



let d=time.toDate();



return {


year:d.getFullYear(),


month:d.getMonth()+1


};


}



return {


year:"未知",


month:"未知"


};



}









// 时间格式


function formatTime(time){



if(time && time.toDate){



return time.toDate()

.toLocaleDateString(
"zh-CN"
);



}



return "";



}







loadArchive();



</script>



</body>


</html>
