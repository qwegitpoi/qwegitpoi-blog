<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章列表
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}



.header{


background:white;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:

0 2px 8px rgba(0,0,0,.08);


}



.header a{


color:#1677ff;

text-decoration:none;

font-size:14px;


}



.container{


padding:15px;


}



.title{


font-size:21px;

font-weight:bold;

margin:15px 0;


}





.filter{


background:white;

padding:12px;

border-radius:8px;

margin-bottom:15px;


}




.filter-title{


font-size:15px;

font-weight:bold;

margin-bottom:8px;


}




.filter span{


display:inline-block;

color:#1677ff;

font-size:14px;

margin:5px 12px 5px 0;

cursor:pointer;


}







.article{


background:white;

padding:14px;

border-radius:8px;

margin-bottom:10px;


}





.article h2{


font-size:17px;

margin:0 0 8px;


}



.article h2 a{


color:#333;

text-decoration:none;


}





.summary{


font-size:14px;

color:#555;

line-height:1.6;


}



.meta{


font-size:12px;

color:#999;

margin-top:8px;


}





.empty{


background:white;

padding:20px;

text-align:center;

color:#999;

border-radius:8px;


}


</style>



</head>




<body>



<div class="header">


<a href="index.html">

← 首页

</a>


<span>

文章列表

</span>



</div>







<div class="container">



<div class="title">

全部文章

</div>





<div class="filter">


<div class="filter-title">

按年月

</div>



<div id="months">

加载中...

</div>


</div>







<div class="filter">


<div class="filter-title">

按标签

</div>



<div id="tags">

加载中...

</div>


</div>






<div id="list">

加载中...

</div>





</div>









<script>


const firebaseConfig={



apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const db=

firebase.firestore();




let articles=[];







function load(){



db.collection("articles")

.where(
"status",
"==",
"published"
)

.get()



.then(snapshot=>{


articles=[];



snapshot.forEach(doc=>{


articles.push({

id:doc.id,

...doc.data()

});


});




articles.sort((a,b)=>{


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


});




showFilters();

showArticles(articles);



})

.catch(e=>{


document.getElementById("list")

.innerHTML=

`

<div class="empty">

加载失败：

${e.message}

</div>

`;


});



}









// 年月标签


function showFilters(){



let months={};

let tags={};



articles.forEach(a=>{


if(a.createTime){


let d=a.createTime.toDate();



let m=

d.getFullYear()

+"年"

+(d.getMonth()+1)

+"月";



months[m]=true;


}



(a.tags||[])

.forEach(t=>{


tags[t]=true;


});


});






let mh="";



Object.keys(months)

.sort()

.reverse()

.forEach(m=>{


mh+=`

<span onclick="filterMonth('${m}')">

${m}

</span>

`;

});



document.getElementById("months")

.innerHTML=

mh||"暂无";







let th="";



Object.keys(tags)

.sort()

.forEach(t=>{


th+=`

<span onclick="filterTag('${t}')">

${t}

</span>

`;

});



document.getElementById("tags")

.innerHTML=

th||"暂无";


}









// 年月筛选


function filterMonth(month){



let result=articles.filter(a=>{


let d=a.createTime.toDate();



return (

d.getFullYear()

+"年"

+(d.getMonth()+1)

+"月"

)

===month;


});



showArticles(result);



}









// 标签筛选


function filterTag(tag){



let result=

articles.filter(a=>{


return (

a.tags||[]

)

.includes(tag);


});



showArticles(result);



}









// 显示文章


function showArticles(list){



if(list.length===0){


document.getElementById("list")

.innerHTML=

`

<div class="empty">

暂无文章

</div>

`;

return;


}





let html="";



list.forEach(a=>{


html+=`


<div class="article">


<h2>

<a href="article.html?id=${a.id}">

${a.title}

</a>

</h2>



<div class="summary">

${firstLine(a.content)}

</div>



<div class="meta">


${format(a.createTime)}

&nbsp;

${(a.tags||[]).join(" ")}


</div>



</div>


`;



});



document.getElementById("list")

.innerHTML=html;


}









function firstLine(text){


if(!text)

return "";



return text

.replace(/[#>*_-]/g,"")

.split("\n")

.filter(x=>x.trim())

[0]

.substring(0,100);


}






function format(t){


if(t&&t.toDate){


return t.toDate()

.toLocaleDateString("zh-CN");


}



return "";

}



load();


</script>



</body>

</html>
