<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
文章列表
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

background:#f5f6fa;

font-family:
"Microsoft YaHei",
Arial;

}



.container{

max-width:1000px;

margin:40px auto;

}



.header{

background:white;

padding:20px;

display:flex;

justify-content:space-between;

}



.group{

background:white;

padding:25px;

margin:25px 0;

border-radius:10px;

}



.article{

border-bottom:1px solid #ddd;

padding:15px 0;

}



.article:last-child{

border:none;

}



.article h3{

margin:5px 0;

}



.article a{

text-decoration:none;

color:#333;

}



.time{

color:#888;

font-size:14px;

}



button{

padding:10px 20px;

cursor:pointer;

}


</style>



</head>



<body>



<div class="header">


<h1>

文章列表

</h1>


<a href="index.html">

<button>

返回首页

</button>

</a>


</div>






<div class="container">


<div id="archive">

加载中...

</div>


</div>







<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();









function loadArchive(){



db.collection("articles")

.where(
"status",
"==",
"published"
)

.get()



.then(snapshot=>{



let articles=[];



snapshot.forEach(doc=>{


articles.push({

id:doc.id,

...doc.data()

});


});







// 按时间排序


articles.sort((a,b)=>{


let ta =
a.createTime?.seconds || 0;


let tb =
b.createTime?.seconds || 0;



return tb-ta;


});







// 年月分类


let groups={};






articles.forEach(article=>{


let date =
getDate(article.createTime);



let key =
date.year+"年"+date.month+"月";





if(!groups[key]){


groups[key]=[];


}



groups[key].push(article);



});









let html="";





if(articles.length===0){


html="<p>暂无文章</p>";


}








Object.keys(groups)

.forEach(month=>{



html+=`

<div class="group">


<h2>

${month}

</h2>



`;





groups[month].forEach(article=>{



html+=`


<div class="article">


<h3>


<a href="article.html?id=${article.id}">


${article.title}


</a>


</h3>



<div class="time">


发布时间：

${formatTime(article.createTime)}


</div>



</div>



`;



});






html+=`

</div>

`;





});







document.getElementById(
"archive"
)
.innerHTML=html;



})



.catch(error=>{


document.getElementById(
"archive"
)

.innerHTML=

"加载失败："+error.message;


});



}









function getDate(time){



if(time && time.toDate){



let d=time.toDate();



return {

year:d.getFullYear(),

month:d.getMonth()+1


};


}



return {

year:"",

month:""

};


}









function formatTime(time){



if(time && time.toDate){


return time.toDate()

.toLocaleDateString(
"zh-CN"
);


}



return "";



}







loadArchive();



</script>


</body>


</html>
