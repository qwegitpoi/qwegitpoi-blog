<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部文章 - 我的个人博客</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    body {
      background-color: #f8fafc;
      color: #334155;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      scroll-behavior: smooth;
    }
    .glass-header {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(226, 232, 240, 0.8);
    }
    .article-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .article-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.06);
    }
    /* 最多截取 3 行摘要 */
    .line-clamp-3 {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <header class="glass-header sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-4 h-14 sm:h-16 flex items-center justify-between">
      <a href="index.html" class="flex items-center space-x-2 text-base sm:text-lg font-bold text-slate-800 hover:text-blue-600 transition">
        <i class="fa-solid fa-book-open text-blue-600"></i>
        <span>我的个人博客</span>
      </a>
      <nav class="flex items-center space-x-2 sm:space-x-3 text-xs sm:text-sm font-medium">
        <a href="index.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">首页</a>
        <a href="all-articles.html" class="text-blue-600 font-semibold bg-blue-50 px-2.5 py-1 rounded-lg transition">全部文章</a>
        <a href="featured.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">★ 精选</a>
        <a href="contact.html" class="text-slate-600 hover:text-blue-600 px-2 py-1 hover:bg-slate-100 rounded-lg transition">📩 私信</a>
      </nav>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 sm:px-6 py-6 w-full flex-grow">
    
    <div class="bg-white rounded-2xl p-5 sm:p-6 border border-slate-100 shadow-sm mb-6">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h1 class="text-xl sm:text-2xl font-bold text-slate-800 flex items-center">
            <i class="fa-solid fa-layer-group text-blue-600 me-2 text-lg"></i> 全部文章
          </h1>
          <p class="text-slate-500 text-xs sm:text-sm mt-1">按首次发表时间由新到旧排列（每页 10 条）</p>
        </div>

        <div class="relative w-full sm:w-72">
          <input type="text" id="search-input" oninput="handleSearch()" placeholder="搜索文章标题、内容或标签..." class="w-full pl-9 pr-3 py-1.5 text-xs sm:text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition bg-slate-50/50">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-slate-400 text-xs"></i>
        </div>
      </div>
    </div>

    <div id="articles-container" class="space-y-4">
      <div class="text-center py-16 bg-white rounded-2xl border border-slate-100 shadow-sm">
        <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-600 mb-2"></i>
        <p class="text-slate-500 text-xs">正在按发表时间加载全部文章...</p>
      </div>
    </div>

    <div id="pagination-container" class="mt-8 flex justify-center items-center space-x-1.5 hidden">
      </div>

  </main>

  <footer class="bg-white border-t border-slate-200 py-4 text-center text-[11px] text-slate-500 mt-12">
    <p>© 2026 我的个人博客. All rights reserved.</p>
  </footer>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "qwegitpoi-blog",
      storageBucket: "qwegitpoi-blog.firebasestorage.app",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963",
      measurementId: "G-M01JQCZ0WX"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const PAGE_SIZE = 10;
    let currentPage = 1;
    let allArticles = [];
    let filteredArticles = [];

    // 1. 获取标准 Unix 时间戳（用于排序）
    function getArticleTimestamp(data) {
      const raw = data.createdAt || data.created_at || data.publishedAt || data.published_at || data.timestamp || data.date;
      if (!raw) return 0;

      try {
        if (raw && typeof raw.toDate === 'function') {
          return raw.toDate().getTime();
        }
        if (typeof raw === 'number') {
          return raw < 1e11 ? raw * 1000 : raw;
        }
        if (typeof raw === 'string') {
          const d = new Date(raw);
          return !isNaN(d.getTime()) ? d.getTime() : 0;
        }
      } catch (e) {
        console.error("时间戳解析异常:", e);
      }
      return 0;
    }

    // 2. 格式化发表时间为 YYYY/MM/DD
    function parseArticleDate(data) {
      const ts = getArticleTimestamp(data);
      if (!ts) return "近期发布";
      const d = new Date(ts);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}/${m}/${day}`;
    }

    // 3. 解析文章标签
    function parseArticleTag(data) {
      let t = data.tag || data.category || data.tags;
      if (Array.isArray(t)) return t.length > 0 ? t[0] : "随笔";
      if (typeof t === 'string' && t.trim() !== '') return t.trim();
      return "随笔";
    }

    // 4. 清理 Markdown 标记提取纯文本摘要
    function extractSummary(content) {
      if (!content) return "暂无正文内容...";
      return content
        .replace(/#+\s+/g, '')
        .replace(/[\*\_~`]/g, '')
        .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
        .replace(/!\[[^\]]*\]\([^\)]+\)/g, '')
        .replace(/>\s+/g, '')
        .replace(/\n+/g, ' ')
        .trim();
    }

    // 从 Firestore 加载全部公开文章并排序
    async function loadArticles() {
      const container = document.getElementById('articles-container');

      try {
        let snapshot;
        try {
          snapshot = await db.collection("posts").get();
          if (snapshot.empty) throw new Error("posts empty");
        } catch (e) {
          snapshot = await db.collection("articles").get();
        }

        let list = [];
        snapshot.forEach(doc => {
          const data = doc.data();

          // 剔除隐藏文章
          const isHidden = data.hide === true || data.status === 'hidden' || data.isHidden === true;
          if (isHidden) return;

          list.push({
            id: doc.id,
            title: data.title || "无标题文章",
            content: data.content || "",
            tag: parseArticleTag(data),
            dateStr: parseArticleDate(data),
            timestamp: getArticleTimestamp(data)
          });
        });

        // ⭐ 核心重点：按首次发表时间戳绝对降序排列（最新的排前面）
        list.sort((a, b) => b.timestamp - a.timestamp);

        allArticles = list;
        filteredArticles = [...allArticles];

        renderPage(1);

      } catch (err) {
        console.error("加载全部文章失败:", err);
        container.innerHTML = `
          <div class="text-center py-12 bg-white rounded-2xl border border-red-100 p-6">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
            <p class="text-slate-700 font-medium text-sm">加载文章列表失败</p>
            <p class="text-slate-400 text-xs mt-1">${err.message || '请检查数据库访问权限'}</p>
          </div>
        `;
      }
    }

    // 渲染指定页码的数据
    function renderPage(page) {
      currentPage = page;
      const container = document.getElementById('articles-container');
      const pagination = document.getElementById('pagination-container');

      if (filteredArticles.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 bg-white rounded-2xl border border-slate-100 shadow-sm p-6">
            <i class="fa-solid fa-folder-open text-3xl text-slate-300 mb-2"></i>
            <p class="text-slate-600 font-medium text-sm">没有检索到符合条件的文章</p>
            <p class="text-slate-400 text-xs mt-1">尝试更换搜索关键字重试</p>
          </div>
        `;
        pagination.classList.add('hidden');
        return;
      }

      const totalPages = Math.ceil(filteredArticles.length / PAGE_SIZE);
      const startIndex = (page - 1) * PAGE_SIZE;
      const pageArticles = filteredArticles.slice(startIndex, startIndex + PAGE_SIZE);

      let html = '';
      pageArticles.forEach(item => {
        const summary = extractSummary(item.content);
        html += `
          <article class="article-card bg-white rounded-xl p-4 sm:p-5 border border-slate-100 shadow-sm relative group">
            <div class="flex items-center justify-between text-xs text-slate-400 mb-2">
              <div class="flex items-center space-x-2">
                <span class="px-2 py-0.5 rounded-full bg-blue-50 text-blue-600 font-medium text-[11px]">
                  ${item.tag}
                </span>
                <span>•</span>
                <span><i class="fa-regular fa-calendar-alt me-1"></i>${item.dateStr}</span>
              </div>
            </div>

            <h2 class="text-base sm:text-lg font-bold text-slate-800 group-hover:text-blue-600 transition mb-1.5">
              <a href="article.html?id=${item.id}">
                ${item.title}
              </a>
            </h2>

            <p class="text-slate-600 text-xs sm:text-sm line-clamp-3 leading-relaxed mb-3">
              ${summary}
            </p>

            <div class="pt-2 border-t border-slate-50 flex items-center justify-between text-xs">
              <a href="article.html?id=${item.id}" class="text-blue-600 hover:text-blue-700 font-semibold inline-flex items-center">
                阅读全文 <i class="fa-solid fa-arrow-right ml-1 text-[10px]"></i>
              </a>
              <span class="text-slate-300 text-[10px]">点击查看详情</span>
            </div>
          </article>
        `;
      });

      container.innerHTML = html;
      renderPagination(totalPages);
    }

    // 渲染底部分页按键
    function renderPagination(totalPages) {
      const pagination = document.getElementById('pagination-container');
      if (totalPages <= 1) {
        pagination.classList.add('hidden');
        return;
      }

      pagination.classList.remove('hidden');
      let html = '';

      // 上一页
      html += `
        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="opacity-40 cursor-not-allowed px-2.5 py-1 rounded-lg border bg-white text-slate-400 text-xs"' : 'class="px-2.5 py-1 rounded-lg border bg-white hover:bg-slate-50 text-slate-700 text-xs transition"'}>
          <i class="fa-solid fa-chevron-left"></i>
        </button>
      `;

      // 页码数字按钮
      for (let i = 1; i <= totalPages; i++) {
        if (i === currentPage) {
          html += `<span class="px-3 py-1 rounded-lg bg-blue-600 text-white font-bold text-xs shadow-sm">${i}</span>`;
        } else {
          html += `<button onclick="changePage(${i})" class="px-3 py-1 rounded-lg border bg-white hover:bg-slate-50 text-slate-700 text-xs transition">${i}</button>`;
        }
      }

      // 下一页
      html += `
        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="opacity-40 cursor-not-allowed px-2.5 py-1 rounded-lg border bg-white text-slate-400 text-xs"' : 'class="px-2.5 py-1 rounded-lg border bg-white hover:bg-slate-50 text-slate-700 text-xs transition"'}>
          <i class="fa-solid fa-chevron-right"></i>
        </button>
      `;

      pagination.innerHTML = html;
    }

    // 切换页码
    function changePage(page) {
      const totalPages = Math.ceil(filteredArticles.length / PAGE_SIZE);
      if (page < 1 || page > totalPages) return;
      renderPage(page);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // 实时搜索过滤
    function handleSearch() {
      const keyword = document.getElementById('search-input').value.trim().toLowerCase();
      if (!keyword) {
        filteredArticles = [...allArticles];
      } else {
        filteredArticles = allArticles.filter(item => 
          item.title.toLowerCase().includes(keyword) ||
          item.content.toLowerCase().includes(keyword) ||
          item.tag.toLowerCase().includes(keyword)
        );
      }
      renderPage(1);
    }

    window.addEventListener('DOMContentLoaded', loadArticles);
  </script>
</body>
</html>
