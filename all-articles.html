<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全部文章 - 博客</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <style>
        /* Modern Design Tokens */
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.85);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
            --shadow-md: 0 4px 20px -2px rgba(0,0,0,0.05);
            --shadow-hover: 0 10px 25px -5px rgba(37, 99, 235, 0.12);
            --radius-lg: 16px;
            --radius-md: 10px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Glassmorphism Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logo i {
            color: var(--primary);
        }

        .nav-links {
            display: flex;
            gap: 0.75rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            font-size: 0.875rem;
            font-weight: 600;
            border-radius: 9999px;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-ghost {
            color: var(--text-muted);
            background: transparent;
        }

        .btn-ghost:hover {
            color: var(--primary);
            background: rgba(37, 99, 235, 0.08);
        }

        .btn-outline {
            color: var(--primary);
            border-color: rgba(37, 99, 235, 0.3);
            background: transparent;
        }

        .btn-outline:hover {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        /* Main Container */
        .main-container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            flex: 1;
            width: 100%;
        }

        /* Page Banner / Search Section */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2rem;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 1.5rem;
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
        }

        .page-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .page-title p {
            font-size: 0.875rem;
            color: var(--text-muted);
            margin-top: 0.25rem;
        }

        .search-box {
            position: relative;
            min-width: 260px;
        }

        .search-box input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border: 1px solid var(--border-color);
            border-radius: 9999px;
            font-size: 0.875rem;
            outline: none;
            transition: all 0.2s ease;
            background: #ffffff;
        }

        .search-box input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .search-box i {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 0.875rem;
        }

        /* Articles Grid */
        .articles-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.25rem;
        }

        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .article-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-hover);
            border-color: rgba(37, 99, 235, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 1rem;
            margin-bottom: 0.75rem;
        }

        .article-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-main);
            transition: color 0.2s ease;
        }

        .article-card:hover .article-title {
            color: var(--primary);
        }

        .tag-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            background-color: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 9999px;
            white-space: nowrap;
        }

        .article-summary {
            color: var(--text-muted);
            font-size: 0.9375rem;
            line-height: 1.6;
            margin-bottom: 1.25rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8125rem;
            color: var(--text-muted);
            border-top: 1px solid rgba(226, 232, 240, 0.6);
            padding-top: 0.75rem;
        }

        .read-more {
            color: var(--primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        /* Pagination Controls */
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 2.5rem;
            margin-bottom: 2rem;
        }

        .page-btn {
            min-width: 38px;
            height: 38px;
            padding: 0 0.5rem;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .page-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(37, 99, 235, 0.05);
        }

        .page-btn.active {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        /* State Indicator */
        .state-box {
            text-align: center;
            padding: 4rem 2rem;
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
        }

        .state-box i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border-color);
            padding: 2rem 1.5rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.875rem;
            background: #ffffff;
            margin-top: auto;
        }

        @media (max-width: 640px) {
            .page-header {
                flex-direction: column;
                align-items: stretch;
            }
            .search-box {
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo">
                <i class="fa-solid fa-feather-pointed"></i> 我的个人博客
            </a>
            <nav class="nav-links">
                <a href="index.html" class="btn btn-ghost"><i class="fa-solid fa-house"></i> 首页</a>
                <a href="contact.html" class="btn btn-ghost"><i class="fa-regular fa-envelope"></i> 私信</a>
                <a href="admin-login.html" class="btn btn-outline"><i class="fa-solid fa-gear"></i> 管理员登录</a>
            </nav>
        </div>
    </header>

    <main class="main-container">
        
        <div class="page-header">
            <div class="page-title">
                <h1><i class="fa-solid fa-box-archive" style="color: var(--primary);"></i> 全部文章</h1>
                <p>探索所有公开发布的思考、技术与生活记录</p>
            </div>
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="搜索文章标题、标签或内容..." oninput="handleSearch()">
            </div>
        </div>

        <div id="articlesContainer" class="articles-grid">
            <div class="state-box">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <p>正在加载文章内容，请稍候...</p>
            </div>
        </div>

        <div id="pagination" class="pagination-container"></div>

    </main>

    <footer class="footer">
        <p>© 2026 个人博客. Powered by Firebase & GitHub Pages</p>
    </footer>

    <script>
        // 1. Firebase Credentials Setup
        const firebaseConfig = {
            apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
            authDomain: "qwegitpoi-blog.firebaseapp.com",
            databaseURL: "https://qwegitpoi-blog-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "qwegitpoi-blog",
            storageBucket: "qwegitpoi-blog.firebasestorage.app",
            messagingSenderId: "313324557146",
            appId: "1:313324557146:web:4a93868894c9329006d963",
            measurementId: "G-M01JQCZ0WX"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        // 2. Pagination & Search State Management
        const PAGE_SIZE = 10;
        let allArticles = [];
        let filteredArticles = [];
        let currentPage = 1;

        // Strip Markdown syntax to render clean preview text
        function cleanMarkdown(text) {
            if (!text) return "";
            return text
                .replace(/[#*`_~>-]/g, "")
                .replace(/\[(.*?)\]\(.*?\)/g, "$1")
                .trim();
        }

        // Helper: Robust Date Parsing for Various Firestore Formats
        function parseArticleDate(data) {
            const rawDate = data.createdAt || data.date || data.time || data.updatedAt;
            if (!rawDate) return new Date();

            // Handle Firestore Timestamp object
            if (rawDate && typeof rawDate.toDate === 'function') {
                return rawDate.toDate();
            }
            // Handle Unix Timestamp (seconds or milliseconds)
            if (typeof rawDate === 'number') {
                return new Date(rawDate < 1e11 ? rawDate * 1000 : rawDate);
            }
            // Handle ISO string or date format strings
            const parsed = new Date(rawDate);
            return isNaN(parsed.getTime()) ? new Date() : parsed;
        }

        // Load visible articles from Firestore
        async function loadAllArticles() {
            const container = document.getElementById('articlesContainer');
            try {
                const snapshot = await db.collection('articles').get();
                let articles = [];
                
                snapshot.forEach(doc => {
                    const data = doc.data();
                    
                    // Dual Filter Protection: Exclude articles marked as hidden in any format
                    const isExplicitlyHidden = data.hide === true || data.status === 'hidden' || data.isHidden === true;

                    if (!isExplicitlyHidden) {
                        articles.push({
                            id: doc.id,
                            title: data.title || "无标题文章",
                            content: data.content || "",
                            tag: data.tag || "随笔",
                            createdAt: parseArticleDate(data)
                        });
                    }
                });

                // Sort articles by creation date (Newest First)
                articles.sort((a, b) => b.createdAt - a.createdAt);

                allArticles = articles;
                filteredArticles = articles;
                renderPage(1);

            } catch (error) {
                console.error("Firestore Error:", error);
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fa-solid fa-triangle-exclamation" style="color: #ef4444;"></i>
                        <p>加载失败：${error.message}</p>
                    </div>
                `;
            }
        }

        // Render Page Articles
        function renderPage(page) {
            currentPage = page;
            const container = document.getElementById('articlesContainer');
            const totalArticles = filteredArticles.length;

            if (totalArticles === 0) {
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fa-regular fa-folder-open"></i>
                        <p>没有找到相关文章</p>
                    </div>
                `;
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            const startIndex = (page - 1) * PAGE_SIZE;
            const endIndex = Math.min(startIndex + PAGE_SIZE, totalArticles);
            const pageData = filteredArticles.slice(startIndex, endIndex);

            let html = '';
            pageData.forEach(art => {
                const dateStr = art.createdAt.toLocaleDateString('zh-CN', {
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                });
                const cleanText = cleanMarkdown(art.content);

                html += `
                    <a href="article.html?id=${art.id}" class="article-card">
                        <div>
                            <div class="card-header">
                                <h2 class="article-title">${escapeHtml(art.title)}</h2>
                                <span class="tag-badge"><i class="fa-solid fa-hashtag"></i> ${escapeHtml(art.tag)}</span>
                            </div>
                            <p class="article-summary">${escapeHtml(cleanText)}</p>
                        </div>
                        <div class="card-footer">
                            <span><i class="fa-regular fa-calendar"></i> ${dateStr}</span>
                            <span class="read-more">阅读全文 <i class="fa-solid fa-arrow-right"></i></span>
                        </div>
                    </a>
                `;
            });

            container.innerHTML = html;
            renderPaginationControls(totalArticles);
        }

        // Render Pagination Control Buttons
        function renderPaginationControls(totalItems) {
            const paginationEl = document.getElementById('pagination');
            const totalPages = Math.ceil(totalItems / PAGE_SIZE);

            if (totalPages <= 1) {
                paginationEl.innerHTML = '';
                return;
            }

            let html = '';

            // Previous Page Button
            html += `<button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})"><i class="fa-solid fa-chevron-left"></i></button>`;

            // Numeric Page Buttons
            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">${i}</button>`;
            }

            // Next Page Button
            html += `<button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})"><i class="fa-solid fa-chevron-right"></i></button>`;

            paginationEl.innerHTML = html;
        }

        // Switch Page Function
        function changePage(page) {
            renderPage(page);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Real-time Search Handler
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            if (!query) {
                filteredArticles = allArticles;
            } else {
                filteredArticles = allArticles.filter(art => 
                    art.title.toLowerCase().includes(query) ||
                    art.tag.toLowerCase().includes(query) ||
                    art.content.toLowerCase().includes(query)
                );
            }
            renderPage(1);
        }

        // Helper: Prevent XSS
        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Execute loading on page load
        window.onload = loadAllArticles;
    </script>
</body>
</html>
