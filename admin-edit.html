<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
文章编辑
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<style>


body{

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

margin:0;

}



.container{

max-width:1000px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;

}



h1{

margin-top:0;

}



input{

width:100%;

padding:12px;

font-size:18px;

box-sizing:border-box;

margin-bottom:15px;

border:1px solid #ddd;

border-radius:5px;

}



textarea{


width:100%;

height:500px;

box-sizing:border-box;

padding:20px;

font-size:16px;

line-height:1.8;

resize:vertical;

font-family:

Consolas,
"Microsoft YaHei";

border:1px solid #ddd;

border-radius:5px;

}





.toolbar{

background:#f5f5f5;

padding:12px;

margin-bottom:10px;

border-radius:5px;

}



.toolbar button{


padding:8px 14px;

margin:4px;

cursor:pointer;

border:1px solid #ccc;

background:white;

border-radius:4px;

}



.toolbar button:hover{

background:#eee;

}



.tags-tip{

font-size:14px;

color:#777;

margin-bottom:10px;

}



.action{

margin-top:20px;

}



.action button{


padding:12px 25px;

margin-right:15px;

cursor:pointer;

}



.save{


background:#666;

color:white;

}



.publish{


background:#1677ff;

color:white;

}



.back{


background:#eee;

}



#message{


margin-top:20px;

color:#1677ff;

}



</style>


</head>




<body>



<div class="container">



<h1>

Markdown文章编辑

</h1>



<a href="admin.html">

<button class="back">

返回后台

</button>

</a>



<hr>




<label>

文章标题

</label>



<input id="title"

placeholder="请输入文章标题">







<label>

文章标签

</label>


<input id="tags"

placeholder="例如：AI,教学,旅行">


<div class="tags-tip">

多个标签请使用英文逗号 , 分隔

</div>






<h3>

正文编辑

</h3>





<div class="toolbar">


<button onclick="insertText('# ')">

一级标题

</button>


<button onclick="insertText('## ')">

二级标题

</button>



<button onclick="wrapText('**','**')">

加粗

</button>



<button onclick="wrapText('*','*')">

斜体

</button>



<button onclick="insertText('<div align=&quot;center&quot;>\n\n')">

居中开始

</button>



<button onclick="insertText('\n\n</div>')">

居中结束

</button>



<button onclick="wrapText('[','](https://)')">

链接

</button>



<button onclick="insertText('- ')">

列表

</button>


</div>






<textarea id="content"

placeholder="

Markdown示例：

# 我的文章

这是正文

**重点内容**

- 项目1
- 项目2


<div align=&quot;center&quot;>

居中文字

</div>

">

</textarea>








<div class="action">


<button class="save"

onclick="saveArticle('draft')">

保存草稿

</button>




<button class="publish"

onclick="saveArticle('published')">

发布文章

</button>



</div>





<div id="message"></div>



</div>
<script>


// Firebase 配置

const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();



const db =
firebase.firestore();





let editId = null;








// 检查登录

auth.onAuthStateChanged(user=>{


if(!user){


location.href="admin-login.html";


}
else{


checkEdit();


}


});









// 判断是否编辑已有文章


function checkEdit(){


let params =
new URLSearchParams(
location.search
);



editId =
params.get("id");





if(editId){


loadArticle();


}



}









// 加载文章


function loadArticle(){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{



if(!doc.exists){


alert(
"文章不存在"
);


return;


}



let data =
doc.data();





document.getElementById(
"title"
).value =
data.title || "";





document.getElementById(
"content"
).value =
data.content || "";





if(data.tags){


document.getElementById(
"tags"
).value =

data.tags.join(",");


}



})



.catch(error=>{


alert(
"读取失败："+error.message
);


});



}









// 保存文章


function saveArticle(status){



let title =
document.getElementById(
"title"
)
.value
.trim();





let content =
document.getElementById(
"content"
)
.value
.trim();





let tags =
document.getElementById(
"tags"
)
.value

.split(",")

.map(t=>t.trim())

.filter(t=>t);







if(!title){


alert(
"请输入文章标题"
);


return;


}



if(!content){


alert(
"请输入文章内容"
);


return;


}






let now =

new Date()

.toLocaleString(
"zh-CN"
);








// 编辑已有文章


if(editId){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{



let data =
doc.data();



let history =
data.updateTime || [];



history.push(now);






return db.collection("articles")

.doc(editId)

.update({



title:title,



content:content,



tags:tags,



status:status,



updateTime:history



});



})



.then(()=>{


showMessage(
"保存成功"
);


setTimeout(()=>{


location.href="admin.html";


},1000);



})



.catch(error=>{


alert(
"保存失败："+error.message
);


});



}








// 新建文章


else{



db.collection("articles")

.add({



title:title,



content:content,



tags:tags,



status:status,



author:"管理员",




createTime:

firebase.firestore.FieldValue.serverTimestamp(),




updateTime:[now]



})



.then(()=>{



showMessage(

status==="published"

?

"发布成功"

:

"草稿保存成功"

);




setTimeout(()=>{


location.href="admin.html";


},1000);



})



.catch(error=>{


alert(
"保存失败："+error.message
);


});



}



}









// 显示提示


function showMessage(text){


document.getElementById(
"message"
)

.innerHTML=text;


}









// 插入文字


function insertText(text){



let textarea =
document.getElementById(
"content"
);



let start =
textarea.selectionStart;



let end =
textarea.selectionEnd;




let value =
textarea.value;





textarea.value =

value.substring(0,start)

+

text

+

value.substring(end);





textarea.focus();



textarea.selectionStart =

textarea.selectionEnd =

start + text.length;



}









// 包裹文字


function wrapText(before,after){



let textarea =
document.getElementById(
"content"
);



let start =
textarea.selectionStart;



let end =
textarea.selectionEnd;



let selected =

textarea.value.substring(
start,
end
);



if(!selected){


selected="文字";


}






let insert =

before +

selected +

after;





textarea.setRangeText(

insert,

start,

end,

"end"

);



textarea.focus();



}





</script>


</body>

</html>
