<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Markdown文章编辑
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<style>

body{

background:#f5f6fa;

font-family:
"Microsoft YaHei";

}



.container{

max-width:1000px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;

}



input{

width:100%;

padding:12px;

font-size:20px;

margin-bottom:20px;

}



textarea{

width:100%;

height:450px;

padding:20px;

font-size:16px;

line-height:1.8;

box-sizing:border-box;

resize:vertical;

font-family:

Consolas,
"Microsoft YaHei";

}



button{

padding:10px 20px;

margin-right:10px;

cursor:pointer;

}



.info{

color:#666;

margin-top:20px;

}


</style>


</head>



<body>



<div class="container">


<h1>

文章编辑

</h1>



<a href="admin.html">

<button type="button">

返回管理后台

</button>

</a>


<hr>



<input id="title"

placeholder="请输入文章标题">



<h3>

Markdown正文

</h3>



<textarea id="content"

placeholder="

# 标题


正文内容


**加粗文字**


- 列表

">

</textarea>





<br><br>



<button onclick="saveArticle('draft')">

保存草稿

</button>


<button onclick="saveArticle('published')">

发布文章

</button>




<p id="message"></p>


</div>









<script>


// Firebase配置


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();



const db =
firebase.firestore();





let editId=null;








// 登录检查


auth.onAuthStateChanged(user=>{


if(!user){


location.href="admin-login.html";


}

else{


checkEdit();


}


});








// 判断编辑模式


function checkEdit(){


let params =
new URLSearchParams(
location.search
);



editId =
params.get("id");





if(editId){


loadArticle();


}



}








// 加载文章


function loadArticle(){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{


if(!doc.exists){


alert(
"文章不存在"
);


return;


}



let data =
doc.data();





document.getElementById(
"title"
).value =
data.title || "";





document.getElementById(
"content"
).value =
data.content || "";



})

.catch(error=>{


alert(
"读取失败："+error.message
);


});



}









// 保存文章


function saveArticle(status){



let title =
document.getElementById(
"title"
).value.trim();





let content =
document.getElementById(
"content"
).value.trim();






if(!title){


alert(
"请输入标题"
);


return;


}



if(!content){


alert(
"请输入正文"
);


return;


}





let now =
new Date()

.toLocaleString(
"zh-CN"
);








// 编辑已有文章


if(editId){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{


let data =
doc.data();



let history =
data.updateTime || [];



history.push(now);






return db.collection("articles")

.doc(editId)

.update({


title:title,


content:content,


status:status,


updateTime:history



});



})

.then(()=>{


alert(
"保存成功"
);


location.href=
"admin.html";


})

.catch(error=>{


alert(
"保存失败："+error.message
);


});



}







// 新文章


else{



db.collection("articles")

.add({


title:title,


content:content,


status:status,


author:"管理员",



createTime:
firebase.firestore.FieldValue.serverTimestamp(),



updateTime:[now]



})



.then(()=>{


alert(
status==="published"

?

"发布成功"

:

"草稿保存成功"

);



location.href=
"admin.html";


})

.catch(error=>{


alert(
"保存失败："+error.message
);


});



}



}



</script>


</body>


</html>
