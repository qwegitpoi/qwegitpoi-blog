<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章编辑
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{
box-sizing:border-box;
}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}




.header{

background:white;

padding:15px;

display:flex;

justify-content:space-between;

box-shadow:

0 2px 8px rgba(0,0,0,.08);

}



.header a{

text-decoration:none;

color:#1677ff;

font-size:14px;

}



.container{

padding:15px;

}



.box{

background:white;

padding:15px;

border-radius:10px;

margin-bottom:15px;

}



label{

font-weight:bold;

display:block;

margin-bottom:8px;

}



input,
textarea{


width:100%;

padding:12px;

border:1px solid #ddd;

border-radius:8px;

font-size:16px;

font-family:inherit;

}



#content{

height:420px;

line-height:1.8;

resize:none;

}





button{

border:0;

padding:10px 15px;

border-radius:6px;

margin-right:8px;

font-size:15px;

}



.save{

background:#777;

color:white;

}



.publish{

background:#1677ff;

color:white;

}



.cancel{

background:#eee;

}



.tip{

font-size:13px;

color:#999;

margin-top:8px;

}



</style>


</head>



<body>




<div class="header">


<a href="admin.html">

← 后台首页

</a>



<a href="admin-list.html?type=published">

文章列表

</a>



</div>







<div class="container">



<div class="box">


<label>

文章标题

</label>


<input

id="title"

placeholder="请输入文章标题">


</div>






<div class="box">


<label>

标签 Tags

</label>


<input

id="tags"

placeholder="例如：AI,教学,旅行">


<div class="tip">

多个标签使用英文逗号分隔

</div>


</div>







<div class="box">


<label>

Markdown正文

</label>



<textarea

id="content"

placeholder="# 一级标题

## 二级标题

正文内容

**加粗**

">

</textarea>


</div>








<div class="box">


<button class="save"

onclick="saveArticle('draft')">

保存草稿

</button>



<button class="publish"

onclick="saveArticle('published')">

发布文章

</button>



<button class="cancel"

onclick="goBack()">

取消

</button>



</div>



</div>









<script>


const firebaseConfig={



apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const db=

firebase.firestore();






// 判断编辑状态


let editId=

new URLSearchParams(location.search)

.get("id");







// 编辑已有文章


if(editId){


loadArticle();


}









function loadArticle(){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{



if(!doc.exists){


alert("文章不存在");


return;


}




let a=doc.data();



document.getElementById("title")

.value=

a.title||"";



document.getElementById("content")

.value=

a.content||"";



document.getElementById("tags")

.value=

(a.tags||[])

.join(",");



});



}









// 保存


function saveArticle(status){



let title=

document.getElementById("title")

.value.trim();




let content=

document.getElementById("content")

.value.trim();




let tags=

document.getElementById("tags")

.value

.split(",")

.map(x=>x.trim())

.filter(x=>x);







if(!title){


alert("请输入文章标题");


return;


}







let now=

new Date()

.toLocaleString("zh-CN");







let data={



title:title,



content:content,



tags:tags,



status:status,



author:"管理员"


};









// 编辑


if(editId){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{


let old=doc.data();



let times=

old.updateTime||[];



times.push(now);






return db.collection("articles")

.doc(editId)

.update({


...data,


updateTime:times


});


})

.then(()=>{


alert("保存成功");


goBack();


});






}






// 新文章


else{



data.createTime=

firebase.firestore.FieldValue.serverTimestamp();



data.updateTime=[now];





db.collection("articles")

.add(data)



.then(()=>{


alert("保存成功");


location.href="admin.html";


});



}




}









// 返回


function goBack(){



if(editId){



history.back();



}

else{


location.href="admin.html";


}



}



</script>



</body>

</html>
