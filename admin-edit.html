<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
文章编辑
</title>



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}



.header{


background:white;

padding:15px;

display:flex;

justify-content:space-between;

align-items:center;

box-shadow:

0 2px 8px rgba(0,0,0,.08);

}



.header a{

text-decoration:none;

color:#1677ff;

font-size:14px;

}



.container{

padding:15px;

}



.box{

background:white;

padding:15px;

border-radius:10px;

margin-bottom:15px;

}



label{

font-weight:bold;

display:block;

margin-bottom:8px;

}



input,textarea{


width:100%;

border:1px solid #ddd;

border-radius:8px;

padding:12px;

font-size:16px;

font-family:inherit;

}



#content{

height:420px;

line-height:1.8;

}



button{


border:0;

border-radius:6px;

padding:10px 18px;

font-size:15px;

}



.save{

background:#777;

color:white;

}



.publish{

background:#1677ff;

color:white;

}



</style>


</head>



<body>



<div class="header">


<a href="admin.html">

← 返回后台

</a>



<a href="index.html">

首页

</a>



</div>








<div class="container">





<div class="box">


<label>

文章标题

</label>


<input

id="title"

placeholder="请输入文章标题">


</div>






<div class="box">


<label>

标签 Tags

</label>


<input

id="tags"

placeholder="例如：AI,教学,旅行">


</div>








<div class="box">


<label>

Markdown正文

</label>



<textarea

id="content"

placeholder="# 标题

正文内容...

**加粗文字**

">

</textarea>


</div>







<div class="box">


<button class="save"

onclick="saveArticle('draft')">

保存草稿

</button>




<button class="publish"

onclick="saveArticle('published')">

发布文章

</button>


</div>





</div>





<script>
const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};



firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();





// 判断是否编辑已有文章

let editId =

new URLSearchParams(location.search)

.get("id");









// 页面加载


if(editId){


loadArticle();


}











// 读取旧文章


function loadArticle(){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{


if(!doc.exists){


alert("文章不存在");


return;


}



let a=doc.data();





document.getElementById("title")

.value=

a.title||"";






document.getElementById("content")

.value=

a.content||"";






document.getElementById("tags")

.value=

(a.tags||[])

.join(",");





})

.catch(e=>{


alert(

"读取失败："+e.message

);


});



}











// 保存文章


function saveArticle(status){



let title=

document.getElementById("title")

.value.trim();




let content=

document.getElementById("content")

.value.trim();




let tags=

document.getElementById("tags")

.value

.split(",")

.map(t=>t.trim())

.filter(t=>t);







if(!title){


alert("请输入标题");


return;


}








let now=

new Date()

.toLocaleString("zh-CN");







let data={



title:title,



content:content,



tags:tags,



status:status,



author:"管理员"




};









if(editId){



// 编辑已有文章



db.collection("articles")

.doc(editId)

.get()


.then(doc=>{



let old=

doc.data();





let updates=

old.updateTime||[];




updates.push(now);







return db.collection("articles")

.doc(editId)

.update({


...data,


updateTime:updates



});



})

.then(()=>{


alert(

status==="published"

?

"发布成功"

:

"草稿保存成功"

);



location.href="admin.html";


});






}else{



// 新文章



data.createTime=

firebase.firestore.FieldValue.serverTimestamp();



data.updateTime=[now];







db.collection("articles")

.add(data)


.then(()=>{


alert(

status==="published"

?

"发布成功"

:

"草稿保存成功"

);



location.href="admin.html";



});



}




}
