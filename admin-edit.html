<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文章编辑 - 博客后台</title>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary-color: #1677ff;
      --primary-hover: #4096ff;
      --danger-color: #ff4d4f;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --bg-body: #f5f6fa;
      --card-bg: #ffffff;
      --border-color: #e5e7eb;
      --radius: 12px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: var(--bg-body);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
      color: var(--text-main);
      min-height: 100vh;
    }

    .header {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      padding: 15px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: var(--shadow-sm);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      gap: 15px;
      align-items: center;
    }

    .nav-links a, .btn-logout {
      text-decoration: none;
      color: var(--primary-color);
      font-size: 14px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 6px;
      transition: all 0.2s;
      border: none;
      background: transparent;
      cursor: pointer;
    }

    .nav-links a:hover {
      background: rgba(22, 119, 255, 0.08);
    }

    .btn-logout {
      color: var(--danger-color);
      border: 1px solid rgba(255, 77, 79, 0.3);
    }

    .btn-logout:hover {
      background: #fff1f0;
    }

    .container {
      max-width: 900px;
      margin: 30px auto;
      padding: 0 20px;
    }

    .edit-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 30px;
      box-shadow: var(--shadow-sm);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-main);
    }

    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-control:focus {
      border-color: var(--primary-color);
    }

    textarea.form-control {
      min-height: 320px;
      resize: vertical;
      font-family: inherit;
      line-height: 1.6;
    }

    .form-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 25px;
    }

    .btn {
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }

    .btn-default {
      background: #f0f0f0;
      color: var(--text-main);
    }

    .btn-default:hover {
      background: #e4e4e4;
    }

    .btn-primary {
      background: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }
  </style>
</head>

<body>

  <div class="header">
    <h1 id="headerTitle">新建文章</h1>
    <div class="nav-links">
      <a href="admin-list.html">返回列表</a>
      <a href="admin.html">后台首页</a>
      <button class="btn-logout" onclick="logout()">退出登录</button>
    </div>
  </div>

  <div class="container">
    <div class="edit-card">
      <div class="form-group">
        <label for="title">文章标题</label>
        <input type="text" id="title" class="form-control" placeholder="请输入文章标题...">
      </div>

      <div class="form-group">
        <label for="tags">标签（多个标签用逗号隔开）</label>
        <input type="text" id="tags" class="form-control" placeholder="例如：前端, Firebase, JavaScript">
      </div>

      <div class="form-group">
        <label for="content">文章内容 (支持 Markdown 格式)</label>
        <textarea id="content" class="form-control" placeholder="在此输入 Markdown 正文..."></textarea>
      </div>

      <div class="form-actions">
        <button class="btn btn-default" onclick="saveArticle('draft')">存为草稿</button>
        <button class="btn btn-primary" onclick="saveArticle('published')">发布文章</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",
      authDomain: "qwegitpoi-blog.firebaseapp.com",
      projectId: "qwegitpoi-blog",
      messagingSenderId: "313324557146",
      appId: "1:313324557146:web:4a93868894c9329006d963"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // 登录权限拦截
    firebase.auth().onAuthStateChanged((user) => {
      if (!user) {
        location.href = "admin-login.html";
      }
    });

    function logout() {
      if (confirm("确定要退出登录吗？")) {
        firebase.auth().signOut().then(() => {
          location.href = "admin-login.html";
        });
      }
    }

    const editId = new URLSearchParams(location.search).get("id");

    if (editId) {
      document.getElementById("headerTitle").innerText = "编辑文章";
      loadArticleData(editId);
    }

    async function loadArticleData(id) {
      try {
        const doc = await db.collection("articles").doc(id).get();
        if (doc.exists) {
          const data = doc.data();
          document.getElementById("title").value = data.title || "";
          document.getElementById("tags").value = (data.tags || []).join(", ");
          document.getElementById("content").value = data.content || "";
        }
      } catch (e) {
        alert("获取文章详情失败：" + e.message);
      }
    }

    async function saveArticle(status) {
      let title = document.getElementById("title").value.trim();
      let content = document.getElementById("content").value.trim();
      let tagsInput = document.getElementById("tags").value;

      if (!title) {
        alert("请输入文章标题！");
        return;
      }

      let tags = tagsInput.split(",")
        .map(t => t.trim())
        .filter(t => t.length > 0);

      let data = {
        title: title,
        content: content,
        tags: tags,
        status: status,
        author: "管理员"
      };

      try {
        if (editId) {
          await db.collection("articles").doc(editId).update(data);
        } else {
          data.createTime = firebase.firestore.FieldValue.serverTimestamp();
          await db.collection("articles").add(data);
        }

        alert(status === 'published' ? "发布成功！" : "草稿保存成功！");
        location.href = "admin-list.html";
      } catch (e) {
        alert("保存失败：" + e.message);
      }
    }
  </script>
</body>

</html>
