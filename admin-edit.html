<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
文章编辑
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


.edit-container{

max-width:1000px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;

}



input{

width:100%;

padding:12px;

font-size:20px;

margin-bottom:20px;

}



.toolbar{

background:#f0f0f0;

padding:10px;

}



.toolbar button{

margin:3px;

}



.editor{


min-height:350px;

border:1px solid #ccc;

padding:20px;

font-size:18px;

line-height:2;

}



.buttons{

margin-top:20px;

}



</style>


</head>




<body>



<div class="edit-container">



<h1>

文章编辑

</h1>



<div>


<a href="admin.html">

<button>

返回管理后台

</button>

</a>


</div>



<br>




<input id="title"

placeholder="请输入文章标题">






<div class="toolbar">


<button onclick="command('bold')">

加粗

</button>



<button onclick="command('italic')">

斜体

</button>



<button onclick="command('underline')">

下划线

</button>




<button onclick="command('justifyLeft')">

左对齐

</button>



<button onclick="command('justifyCenter')">

居中

</button>



<button onclick="command('justifyRight')">

右对齐

</button>




<button onclick="createLink()">

插入链接

</button>



<select onchange="fontSize(this.value)">


<option value="">

字体大小

</option>


<option value="3">

正常

</option>


<option value="5">

大

</option>


<option value="7">

特大

</option>



</select>


</div>






<div id="editor"

class="editor"

contenteditable="true">

请输入正文...

</div>






<div class="buttons">


<button onclick="saveArticle('draft')">

保存草稿

</button>



<button onclick="saveArticle('published')">

发布文章

</button>



</div>





<p id="message"></p>




</div>









<script>



// Firebase配置


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};




firebase.initializeApp(firebaseConfig);



const auth=firebase.auth();


const db=firebase.firestore();





let editId=null;









// 登录检查


auth.onAuthStateChanged(user=>{


if(!user){


location.href="admin-login.html";


}

else{


checkEdit();


}



});









// 判断是否编辑文章


function checkEdit(){



let params =
new URLSearchParams(
location.search
);



editId =
params.get("id");





if(editId){



loadArticle();


}



}









// 加载文章


function loadArticle(){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{



if(!doc.exists){


alert(
"文章不存在"
);


return;


}



let data =
doc.data();




document.getElementById(
"title"
).value=data.title;



document.getElementById(
"editor"
).innerHTML=data.content;



});



}









// 富文本操作


function command(cmd){



document.execCommand(
cmd,
false,
null
);



}





function fontSize(size){



if(size){


document.execCommand(
"fontSize",
false,
size
);


}


}






function createLink(){



let url =
prompt(
"请输入链接地址"
);



if(url){


document.execCommand(
"createLink",
false,
url
);



}



}









// 保存文章


function saveArticle(status){



let title =
document.getElementById(
"title"
).value.trim();




let content =
document.getElementById(
"editor"
).innerHTML;





if(!title){


alert(
"请输入标题"
);


return;


}






let now =
new Date()
.toLocaleString(
"zh-CN"
);








// 编辑已有文章


if(editId){



db.collection("articles")

.doc(editId)

.get()



.then(doc=>{



let data=doc.data();



let updates =
data.updateTime || [];



updates.push(now);






return db.collection("articles")

.doc(editId)

.update({


title:title,


content:content,


status:status,


updateTime:updates



});



})



.then(()=>{


alert(
"保存成功"
);


location.href=
"admin.html";


});



}







// 新文章


else{



db.collection("articles")

.add({



title:title,


content:content,


status:status,


author:"管理员",



createTime:
firebase.firestore.FieldValue.serverTimestamp(),



updateTime:[now]



})



.then(()=>{


alert(
"发布成功"
);



location.href=
"admin.html";


});



}



}






</script>




</body>

</html>
