<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
博客管理后台
</title>



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial;

color:#333;

}





.header{

background:white;

padding:15px;

position:sticky;

top:0;

z-index:10;

box-shadow:

0 2px 8px rgba(0,0,0,.08);

}



.top{

display:flex;

justify-content:space-between;

align-items:center;

}



.top h1{

font-size:20px;

margin:0;

}



a{

text-decoration:none;

}



button{

border:0;

border-radius:5px;

padding:6px 10px;

font-size:13px;

}



.primary{

background:#1677ff;

color:white;

}



.gray{

background:#eee;

}



.container{

padding:12px;

}






.search{

background:white;

padding:12px;

border-radius:8px;

margin-bottom:12px;

}



input{

width:100%;

padding:10px;

border:1px solid #ddd;

border-radius:20px;

font-size:15px;

}






.section-title{

font-weight:bold;

font-size:18px;

margin:20px 0 10px;

}







/* 分类文字 */


.filter{

background:white;

padding:10px;

border-radius:8px;

}



.filter span{


display:inline-block;

margin:5px 12px 5px 0;

font-size:14px;

color:#1677ff;

cursor:pointer;


}









/* 文章列表 */


.item{


background:white;

padding:10px;

border-radius:8px;

margin-bottom:8px;


}





.item-top{


display:flex;

justify-content:space-between;

align-items:center;

gap:8px;


}





.item-title{


font-size:16px;

font-weight:bold;

overflow:hidden;

white-space:nowrap;

text-overflow:ellipsis;


}



.item-title a{

color:#333;

}






.actions{


white-space:nowrap;


}



.actions button{


margin-left:3px;

padding:4px 8px;

}



.hide{

background:#777;

color:white;

}



.edit{

background:#1677ff;

color:white;

}



.delete{

background:#e53935;

color:white;

}






.summary{


font-size:14px;

color:#555;

margin-top:8px;

white-space:nowrap;

overflow:hidden;

text-overflow:ellipsis;


}




.meta{


font-size:12px;

color:#999;

margin-top:6px;


}







.empty{


background:white;

padding:20px;

text-align:center;

color:#999;

border-radius:8px;

}





</style>


</head>





<body>



<div class="header">


<div class="top">


<h1>

博客后台

</h1>



<div>


<a href="index.html">

<button class="gray">

首页

</button>

</a>



<a href="admin-edit.html">

<button class="primary">

发布

</button>

</a>


</div>



</div>




<div class="search">


<input

id="search"

placeholder="搜索文章标题或正文"

oninput="render()">


</div>


</div>







<div class="container">





<div class="section-title">

文章年月

</div>



<div class="filter"

id="months">

加载中...

</div>








<div class="section-title">

文章标签

</div>



<div class="filter"

id="tags">

加载中...

</div>







<div class="section-title">

已发布文章

</div>


<div id="published">

加载中...

</div>







<div class="section-title">

隐藏文章

</div>


<div id="hidden">

加载中...

</div>







<div class="section-title">

草稿箱

</div>


<div id="draft">

加载中...

</div>





</div>





<script>

const firebaseConfig = {

apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",

authDomain:
"qwegitpoi-blog.firebaseapp.com",

projectId:
"qwegitpoi-blog",

messagingSenderId:
"313324557146",

appId:
"1:313324557146:web:4a93868894c9329006d963"

};



firebase.initializeApp(firebaseConfig);



const db =
firebase.firestore();



let allArticles=[];





// 加载文章

function loadArticles(){


db.collection("articles")

.get()


.then(snapshot=>{


allArticles=[];


snapshot.forEach(doc=>{


allArticles.push({

id:doc.id,

...doc.data()

});


});



render();


})

.catch(e=>{


alert(
"读取失败："+e.message
);


});


}







// 主渲染

function render(){



let key=

document.getElementById("search")

.value

.toLowerCase();





let list=

allArticles.filter(a=>{


return (

!key

||

(a.title||"")
.toLowerCase()
.includes(key)

||

(a.content||"")
.toLowerCase()
.includes(key)

);


});






showMonths(list);



showTags(list);





let published=

list.filter(a=>

a.status==="published"

);



let hidden=

list.filter(a=>

a.status==="hidden"

);



let draft=

list.filter(a=>

a.status==="draft"

);






document.getElementById("published")

.innerHTML=

published.length

?

published.map(createItem).join("")

:

empty();





document.getElementById("hidden")

.innerHTML=

hidden.length

?

hidden.map(createItem).join("")

:

empty();





document.getElementById("draft")

.innerHTML=

draft.length

?

draft.map(createDraft).join("")

:

empty();



}








// 年月分类


function showMonths(list){



let obj={};



list.forEach(a=>{


if(!a.createTime)

return;



let d=a.createTime.toDate();



let m=

d.getFullYear()

+"年"

+(d.getMonth()+1)

+"月";



obj[m]=true;



});



let html="";



Object.keys(obj)

.sort()

.reverse()

.forEach(m=>{


html+=`

<span onclick="filterMonth('${m}')">

${m}

</span>

`;



});



document.getElementById("months")

.innerHTML=

html||"暂无";



}










// 标签分类


function showTags(list){



let obj={};



list.forEach(a=>{


(a.tags||[])

.forEach(t=>{


obj[t]=true;


});


});



let html="";



Object.keys(obj)

.sort()

.forEach(t=>{


html+=`

<span onclick="filterTag('${t}')">

${t}

</span>

`;



});



document.getElementById("tags")

.innerHTML=

html||"暂无";



}









// 年月筛选


function filterMonth(month){



let result=

allArticles.filter(a=>{


if(a.status!=="published")

return false;



let d=

a.createTime.toDate();



return (

d.getFullYear()

+"年"

+(d.getMonth()+1)

+"月"

)

===month;


});



document.getElementById("published")

.innerHTML=

result.map(createItem).join("")

||empty();


}









// 标签筛选


function filterTag(tag){



let result=

allArticles.filter(a=>{


return (

a.status==="published"

&&

(a.tags||[])

.includes(tag)

);


});



document.getElementById("published")

.innerHTML=

result.map(createItem).join("")

||empty();



}









// 已发布/隐藏文章


function createItem(a){



let actionText=

a.status==="hidden"

?

"显示"

:

"隐藏";



return `


<div class="item">



<div class="item-top">


<div class="item-title">


<a href="article.html?id=${a.id}">

${a.title}

</a>


</div>



<div class="actions">



<button class="hide"

onclick="toggleHide('${a.id}','${a.status}')">

${actionText}

</button>



<button class="edit"

onclick="edit('${a.id}')">

编辑

</button>



<button class="delete"

onclick="removeArticle('${a.id}')">

删除

</button>



</div>



</div>






<div class="summary">

${firstLine(a.content)}

</div>




<div class="meta">


${format(a.createTime)}

&nbsp;

${(a.tags||[]).join(" ")}


</div>



</div>


`;



}









// 草稿


function createDraft(a){



return `


<div class="item">


<div class="item-top">


<div class="item-title">

${a.title}

</div>



<div class="actions">


<button class="edit"

onclick="edit('${a.id}')">

编辑

</button>



<button class="delete"

onclick="removeArticle('${a.id}')">

删除

</button>


</div>



</div>



<div class="summary">

${firstLine(a.content)}

</div>



<div class="meta">

草稿

${format(a.createTime)}

</div>



</div>


`;

}









// 隐藏/显示


function toggleHide(id,status){



let newStatus=

status==="hidden"

?

"published"

:

"hidden";



db.collection("articles")

.doc(id)

.update({

status:newStatus

})

.then(loadArticles);



}








// 编辑


function edit(id){


location.href=

"admin-edit.html?id="+id;


}







// 删除


function removeArticle(id){


if(!confirm("确定删除？"))

return;



db.collection("articles")

.doc(id)

.delete()

.then(loadArticles);



}









// 第一行摘要


function firstLine(text){



if(!text)

return "";



return text

.replace(/[#>*_-]/g,"")

.split("\n")

.filter(x=>x.trim())

[0]

.substring(0,80);



}








function format(t){


if(t&&t.toDate){


return t.toDate()

.toLocaleString("zh-CN");


}


return "";

}




function empty(){


return `

<div class="empty">

暂无文章

</div>

`;

}





loadArticles();
