<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
博客管理后台
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


body{

background:#f5f6fa;

font-family:
"Microsoft YaHei";

}



.container{

max-width:1100px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;

}



.top{

display:flex;

justify-content:space-between;

align-items:center;

}



button{

padding:10px 18px;

cursor:pointer;

margin-left:8px;

}



.section{

margin-top:40px;

}



.article-card{

border:1px solid #ddd;

padding:20px;

margin:15px 0;

border-radius:8px;

}



.article-card h3{

margin-top:0;

}



.meta{

color:#777;

font-size:14px;

line-height:1.8;

}



.summary{

margin-top:10px;

color:#555;

}



.draft{

background:#fff8e1;

}



.delete{

background:#e53935;

color:white;

}



.edit{

background:#1976d2;

color:white;

}



</style>


</head>



<body>



<div class="container">



<div class="top">


<h1>
博客管理后台
</h1>



<div>


<a href="index.html">

<button>

返回首页

</button>

</a>



<a href="admin-edit.html">

<button>

发布文章

</button>

</a>



<button onclick="logout()">

退出登录

</button>


</div>


</div>






<div class="section">


<h2>

已发布文章

</h2>



<div id="published">

加载中...

</div>


</div>








<div class="section">


<h2>

草稿箱

</h2>


<div id="draft">

加载中...

</div>


</div>





</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};





firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();


const db =
firebase.firestore();







auth.onAuthStateChanged(user=>{


if(!user){


location.href="admin-login.html";


}

else{


loadArticles();


}


});









function loadArticles(){



db.collection("articles")

.get()



.then(snapshot=>{



let published=[];

let draft=[];





snapshot.forEach(doc=>{


let data=doc.data();



let article={


id:doc.id,


...data


};






if(data.status==="published"){


published.push(article);


}



else if(data.status==="draft"){


draft.push(article);


}




});







published.sort(sortTime);


draft.sort(sortTime);







showPublished(published);


showDraft(draft);



})

.catch(error=>{


document.getElementById(
"published"
)

.innerHTML=

"加载失败："+error.message;


});



}









function showPublished(list){



let html="";



if(list.length===0){


html="<p>暂无已发布文章</p>";


}





list.forEach(article=>{



html+=createCard(article,false);



});





document.getElementById(
"published"
)

.innerHTML=html;



}









function showDraft(list){



let html="";



if(list.length===0){


html="<p>暂无草稿</p>";


}





list.forEach(article=>{



html+=createCard(article,true);



});




document.getElementById(
"draft"
)

.innerHTML=html;



}









function createCard(article,isDraft){



return `


<div class="article-card ${isDraft?'draft':''}">


<h3>

${article.title}

</h3>



<div class="meta">


发布时间：

${formatTime(article.createTime)}


<br>


最后编辑：

${lastEdit(article.updateTime)}


</div>



<div class="summary">


${getSummary(article.content)}

</div>



<br>



<button class="edit"

onclick="editArticle('${article.id}')">

${isDraft?'继续编辑':'编辑'}

</button>



<button class="delete"

onclick="deleteArticle('${article.id}')">

删除

</button>



</div>


`;



}









function editArticle(id){


location.href=

"admin-edit.html?id="+id;


}









function deleteArticle(id){



if(!confirm(
"确定删除文章？"
)){


return;


}



db.collection("articles")

.doc(id)

.delete()



.then(()=>{


alert(
"删除成功"
);


loadArticles();


})


.catch(error=>{


alert(
"删除失败："+error.message
);


});



}









function getSummary(md){



if(!md){

return "";

}



let text=md;



text=text.replace(
/#{1,6}\s/g,
""
);



text=text.replace(
/\*\*/g,
""
);



text=text.replace(
/\*/g,
""
);



text=text.replace(
/\n+/g,
" "
);





return text.length>100

?

text.substring(0,100)+"..."

:

text;



}









function sortTime(a,b){



let ta =
a.createTime?.seconds || 0;



let tb =
b.createTime?.seconds || 0;



return tb-ta;



}









function formatTime(time){



if(time && time.toDate){


return time.toDate()

.toLocaleString(
"zh-CN"
);


}



return "暂无";



}








function lastEdit(list){



if(list && list.length){


return list[list.length-1];


}



return "暂无";



}









function logout(){


auth.signOut()

.then(()=>{


location.href="admin-login.html";


});


}



</script>



</body>

</html>
