<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
博客管理后台
</title>



<link rel="stylesheet" href="css/style.css">



<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


</head>


<body>


<header class="header">


<div class="logo">

博客管理后台

</div>



<div>


<a href="index.html"

class="nav-btn">

返回首页

</a>



<button onclick="logout()">

退出登录

</button>


</div>


</header>







<div class="admin-container">



<h1 class="admin-title">

文章编辑

</h1>





<input id="title"

placeholder="文章标题">







<div class="editor-toolbar">


<button onclick="format('bold')">

加粗

</button>



<button onclick="format('italic')">

斜体

</button>




<button onclick="format('justifyLeft')">

左对齐

</button>



<button onclick="format('justifyCenter')">

居中

</button>



<button onclick="format('justifyRight')">

右对齐

</button>




<select onchange="fontSize(this.value)">


<option value="">

字体大小

</option>


<option value="3">

正常

</option>


<option value="5">

大

</option>



<option value="7">

超大

</option>



</select>




<button onclick="insertLink()">

链接

</button>



</div>






<div id="editor"

class="editor"

contenteditable="true">


请输入文章内容...



</div>





<br>



<button onclick="saveDraft()"

class="btn-gray">


暂存草稿


</button>





<button onclick="publishArticle()">

发布文章


</button>





<button id="cancelBtn"

onclick="cancelEdit()"

class="btn-gray"

style="display:none">


取消编辑


</button>






<p id="message"></p>







<hr>



<h2>

已发布文章

</h2>



<div id="publishedList">

加载中...

</div>







<hr>



<h2>

草稿箱

</h2>




<div id="draftList">

加载中...

</div>





</div>







<script>




// =======================
// Firebase配置
// =======================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};






firebase.initializeApp(firebaseConfig);




const auth =
firebase.auth();



const db =
firebase.firestore();





let editId=null;



let editMode="";






// =======================
// 登录检测
// =======================


auth.onAuthStateChanged(user=>{


if(!user){


window.location.href=
"admin-login.html";


}

else{


loadArticles();


}



});





// =======================
// 编辑器
// =======================


function format(cmd){


document.execCommand(
cmd,
false,
null
);


}




function fontSize(size){


if(size){


document.execCommand(
"fontSize",
false,
size
);


}


}




function insertLink(){


let url =
prompt(
"输入网址"
);



if(url){


document.execCommand(
"createLink",
false,
url
);


}


}
// =======================
// 保存草稿
// =======================


function saveDraft(){


saveArticle("draft");


}






// =======================
// 发布文章
// =======================


function publishArticle(){


saveArticle("published");


}








// =======================
// 保存文章核心函数
// =======================


function saveArticle(status){



let title =
document.getElementById(
"title"
).value.trim();




let content =
document.getElementById(
"editor"
).innerHTML;





if(!title){


showMessage(
"请输入文章标题"
);


return;


}





if(!content){


showMessage(
"请输入文章内容"
);


return;


}






let now =
new Date()
.toLocaleString(
"zh-CN"
);








// 编辑模式


if(editId){



let oldUpdate=[];




db.collection("articles")
.doc(editId)
.get()

.then(doc=>{


let data =
doc.data();



oldUpdate =
data.updateTime || [];



oldUpdate.push(now);






return db.collection("articles")

.doc(editId)

.update({


title:title,


content:content,


status:status,


updateTime:oldUpdate



});



})



.then(()=>{


showMessage(
"修改成功"
);


clearEditor();


loadArticles();



});






}






// 新文章


else{


db.collection("articles")

.add({


title:title,


content:content,


status:status,


author:"管理员",


createTime:
firebase.firestore.FieldValue.serverTimestamp(),


updateTime:[now]



})



.then(()=>{


showMessage(
status=="draft"
?
"草稿保存成功"
:
"文章发布成功"
);



clearEditor();


loadArticles();



});



}




}









// =======================
// 加载文章
// =======================


function loadArticles(){



// 已发布


db.collection("articles")


.where(
"status",
"==",
"published"
)


.orderBy(
"createTime",
"desc"
)


.get()



.then(snapshot=>{



let html="";





if(snapshot.empty){


html="暂无发布文章";


}






snapshot.forEach(doc=>{



let data =
doc.data();



html += `



<div class="manage-item">


<h3>

${data.title}

</h3>



<p>

发布时间：

${formatTime(data.createTime)}

</p>



<p>

最后编辑：

${getLastUpdate(data.updateTime)}

</p>



<span class="status publish">

已发布

</span>




<br><br>



<button class="btn-green"

onclick="editArticle('${doc.id}')">

编辑

</button>



<button class="btn-red"

onclick="deleteArticle('${doc.id}')">

删除

</button>



</div>


`;



});





document.getElementById(
"publishedList"
)
.innerHTML=html;




});









// 草稿


db.collection("articles")


.where(
"status",
"==",
"draft"
)


.orderBy(
"createTime",
"desc"
)


.get()



.then(snapshot=>{


let html="";



if(snapshot.empty){


html="暂无草稿";


}




snapshot.forEach(doc=>{



let data =
doc.data();





html += `



<div class="manage-item">


<h3>

${data.title}

</h3>



<p>

保存时间：

${getLastUpdate(data.updateTime)}

</p>



<span class="status draft">

草稿

</span>



<br><br>



<button class="btn-green"

onclick="editArticle('${doc.id}')">

继续编辑

</button>




<button class="btn-red"

onclick="deleteArticle('${doc.id}')">

删除

</button>



</div>



`;




});




document.getElementById(
"draftList"
)
.innerHTML=html;




});




}










// =======================
// 编辑文章
// =======================


function editArticle(id){



db.collection("articles")

.doc(id)

.get()



.then(doc=>{



let data =
doc.data();





document.getElementById(
"title"
).value =
data.title;





document.getElementById(
"editor"
).innerHTML =
data.content;






editId=id;



document.getElementById(
"cancelBtn"
)
.style.display=
"inline-block";





window.scrollTo(
0,
0
);



});



}









// =======================
// 删除文章
// =======================


function deleteArticle(id){



if(
!confirm(
"确定删除这篇文章吗？"
)

){


return;


}






db.collection("articles")

.doc(id)

.delete()



.then(()=>{


showMessage(
"删除成功"
);



loadArticles();



});



}









// =======================
// 取消编辑
// =======================


function cancelEdit(){


clearEditor();


}








function clearEditor(){



editId=null;



document.getElementById(
"title"
).value="";



document.getElementById(
"editor"
).innerHTML="";



document.getElementById(
"cancelBtn"
)
.style.display=
"none";



}









// =======================
// 工具函数
// =======================


function showMessage(text){



document.getElementById(
"message"
)
.innerHTML=text;



setTimeout(()=>{


document.getElementById(
"message"
)
.innerHTML="";


},3000);



}








function formatTime(time){



if(
time &&
time.toDate
){


return time.toDate()

.toLocaleString(
"zh-CN"
);


}



return "";



}





function getLastUpdate(list){



if(
list &&
list.length
){



return list[list.length-1];


}



return "";



}








// =======================
// 退出登录
// =======================


function logout(){



auth.signOut()

.then(()=>{


window.location.href=
"admin-login.html";


});



}





</script>


</body>


</html>
