<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
博客后台管理
</title>


<link rel="stylesheet" href="css/style.css">



<!-- Firebase SDK -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


</head>



<body>



<header class="header">


<div class="logo">
博客管理后台
</div>


<button onclick="logout()">
退出登录
</button>


</header>





<div class="admin-container">



<h2>
发布新文章
</h2>



<input
id="title"
placeholder="文章标题"
/>



<textarea
id="content"
placeholder="请输入文章内容">
</textarea>



<button onclick="publishArticle()">

发布文章

</button>



<p id="message"></p>




<hr>



<h2>
文章管理
</h2>



<div id="articleList">

正在加载...

</div>



</div>







<script>


// Firebase 配置


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();



const db =
firebase.firestore();






// 登录检查


auth.onAuthStateChanged(user=>{


if(!user){


window.location.href =
"admin-login.html";


}

else{


loadArticles();


}



});







// 发布文章


function publishArticle(){



let title =
document.getElementById("title").value;



let content =
document.getElementById("content").value;



if(!title || !content){


document.getElementById("message").innerHTML =
"标题和内容不能为空";


return;


}




db.collection("articles")
.add({


title:title,


content:content,


time:
new Date().toLocaleString("zh-CN"),


author:
"管理员"


})

.then(()=>{


document.getElementById("message").innerHTML =
"文章发布成功";



document.getElementById("title").value="";


document.getElementById("content").value="";



loadArticles();



})


.catch(error=>{


document.getElementById("message").innerHTML =
"发布失败："+error.message;


});



}







//读取文章


function loadArticles(){



db.collection("articles")
.orderBy("time","desc")
.get()


.then(snapshot=>{



let html="";



if(snapshot.empty){


html="<p>暂无文章</p>";


}



snapshot.forEach(doc=>{


let article =
doc.data();



html+=`


<div class="article-card">


<h3>

${article.title}

</h3>


<p>

${article.content.substring(0,100)}

</p>


<div>

发布时间：

${article.time}

</div>



<button onclick="deleteArticle('${doc.id}')">

删除

</button>


</div>



`;



});



document.getElementById("articleList")
.innerHTML=html;



})


.catch(error=>{


document.getElementById("articleList")
.innerHTML=

"读取失败："+error.message;


});



}








// 删除文章


function deleteArticle(id){



if(!confirm("确定删除这篇文章吗？")){


return;


}




db.collection("articles")
.doc(id)
.delete()


.then(()=>{


alert("删除成功");


loadArticles();


})


.catch(error=>{


alert(
"删除失败："+error.message
);


});



}








//退出登录


function logout(){


auth.signOut()

.then(()=>{


window.location.href=
"admin-login.html";


});



}



</script>



</body>

</html>
