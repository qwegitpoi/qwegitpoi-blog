<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>
博客管理后台
</title>


<link rel="stylesheet" href="css/style.css">


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>


<style>

.admin-container{

max-width:1100px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;

}


.top-bar{

display:flex;

justify-content:space-between;

align-items:center;

margin-bottom:30px;

}


.action-bar{

margin-bottom:30px;

}


.article-item{

border:1px solid #ddd;

padding:20px;

margin:15px 0;

border-radius:8px;

}



.article-item h3{

margin-top:0;

}



.meta{

color:#777;

font-size:14px;

line-height:1.8;

}


button{

cursor:pointer;

}


.edit-btn{

background:#1976d2;

}



.delete-btn{

background:#d32f2f;

}


.draft-title{

color:#d68910;

}


</style>


</head>



<body>



<div class="admin-container">



<div class="top-bar">


<h1>
博客管理后台
</h1>



<div>


<a href="index.html">

<button>

返回首页

</button>

</a>


<button onclick="logout()">

退出登录

</button>


</div>



</div>





<div class="action-bar">


<a href="admin-edit.html">


<button>

＋ 发布新文章

</button>


</a>



</div>







<h2>

已发布文章

</h2>



<div id="publishedList">

加载中...

</div>







<hr>






<h2>

草稿箱

</h2>




<div id="draftList">

加载中...

</div>





</div>









<script>


// ========================
// Firebase配置
// ========================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};



firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();



const db =
firebase.firestore();







// 登录检测


auth.onAuthStateChanged(user=>{


if(!user){


window.location.href=
"admin-login.html";


}

else{


loadArticles();


}



});









// ========================
// 加载全部文章
// ========================


function loadArticles(){



db.collection("articles")

.get()


.then(snapshot=>{



let published=[];


let draft=[];






snapshot.forEach(doc=>{



let data=doc.data();


let article={


id:doc.id,


...data


};





if(data.status==="published"){


published.push(article);


}



if(data.status==="draft"){


draft.push(article);


}



});







// 前端排序


published.sort(sortTime);


draft.sort(sortTime);







showPublished(
published
);



showDraft(
draft
);



})



.catch(error=>{


document.getElementById(
"publishedList"
)
.innerHTML=

"加载失败："+error.message;



document.getElementById(
"draftList"
)
.innerHTML=

"加载失败："+error.message;



});



}









// ========================
// 已发布文章显示
// ========================


function showPublished(list){



let html="";





if(list.length===0){


html="暂无已发布文章";


}



list.forEach(article=>{


html += `



<div class="article-item">


<h3>

${article.title}

</h3>



<div class="meta">


发布时间：

${formatTime(article.createTime)}


<br>


最后编辑：

${lastUpdate(article.updateTime)}



</div>



<br>


<button class="edit-btn"

onclick="editArticle('${article.id}')">

编辑

</button>



<button class="delete-btn"

onclick="deleteArticle('${article.id}')">

删除

</button>



</div>



`;



});





document.getElementById(
"publishedList"
)
.innerHTML=html;



}










// ========================
// 草稿显示
// ========================


function showDraft(list){



let html="";



if(list.length===0){


html="暂无草稿";


}



list.forEach(article=>{


html += `



<div class="article-item">


<h3 class="draft-title">


${article.title}

</h3>




<div class="meta">


保存时间：

${lastUpdate(article.updateTime)}


</div>



<br>


<button class="edit-btn"

onclick="editArticle('${article.id}')">

继续编辑

</button>



<button class="delete-btn"

onclick="deleteArticle('${article.id}')">

删除

</button>



</div>


`;



});





document.getElementById(
"draftList"
)
.innerHTML=html;



}









// ========================
// 编辑
// ========================


function editArticle(id){


window.location.href=

"admin-edit.html?id="+id;


}









// ========================
// 删除
// ========================


function deleteArticle(id){



if(!confirm(
"确定删除这篇文章吗？"
)){


return;


}





db.collection("articles")

.doc(id)

.delete()


.then(()=>{


alert(
"删除成功"
);


loadArticles();


})


.catch(error=>{


alert(
"删除失败："+error.message
);


});



}









// ========================
// 排序
// ========================


function sortTime(a,b){



let ta =
a.createTime?.seconds || 0;



let tb =
b.createTime?.seconds || 0;



return tb-ta;



}









function formatTime(time){



if(time && time.toDate){


return time.toDate()

.toLocaleString(
"zh-CN"
);


}



return "";



}







function lastUpdate(list){



if(
list &&
list.length>0
){


return list[list.length-1];


}



return "暂无";



}









// ========================
// 退出
// ========================


function logout(){



auth.signOut()

.then(()=>{


window.location.href=

"admin-login.html";


});


}



</script>



</body>

</html>
