<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
博客管理后台
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>



<style>


*{

box-sizing:border-box;

}



body{

margin:0;

background:#f5f6fa;

font-family:

"Microsoft YaHei",
Arial,
sans-serif;

}




.header{


height:65px;

background:#222;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;


}




.logo{


font-size:24px;

font-weight:bold;


}




button{


padding:8px 15px;

border:none;

border-radius:5px;

background:#1976d2;

color:white;

cursor:pointer;

margin:3px;


}



button:hover{

opacity:.85;

}




.container{


max-width:1100px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;


}





input{


width:100%;

padding:12px;

font-size:18px;

border:1px solid #ddd;

border-radius:5px;

margin-bottom:15px;


}





.toolbar{


background:#eee;

padding:10px;

border-radius:5px 5px 0 0;


}





.toolbar button{


background:white;

color:#333;

border:1px solid #ccc;


}





.editor{


min-height:350px;

border:1px solid #ccc;

padding:20px;

font-size:18px;

line-height:1.8;

outline:none;


}





.editor img{


max-width:100%;

}



.article-card{


border:1px solid #ddd;

padding:15px;

margin-top:15px;

border-radius:8px;


}



.article-card img{


width:160px;

height:100px;

object-fit:cover;

}



.delete{

background:#d32f2f;

}



.edit{

background:#388e3c;

}



.message{

color:#1976d2;

margin:10px 0;

}



</style>


</head>



<body>


<div class="header">


<div class="logo">

博客管理后台

</div>


<button onclick="logout()">

退出登录

</button>


</div>





<div class="container">


<h2>

文章编辑

</h2>



<input id="title"
placeholder="请输入文章标题">





<!-- 工具栏 -->


<div class="toolbar">


<button onclick="format('bold')">

加粗

</button>


<button onclick="format('italic')">

斜体

</button>



<button onclick="format('justifyLeft')">

左对齐

</button>


<button onclick="format('justifyCenter')">

居中

</button>


<button onclick="format('justifyRight')">

右对齐

</button>



<select onchange="fontSize(this.value)">

<option value="">文字大小</option>

<option value="3">
正常
</option>

<option value="5">
大
</option>

<option value="7">
超大
</option>


</select>




<button onclick="insertLink()">

链接

</button>



<button onclick="chooseImage()">

图片

</button>



</div>







<!-- 编辑区域 -->


<div id="editor"

class="editor"

contenteditable="true">

请输入正文内容...


</div>





<br>



<button onclick="saveArticle()">

发布文章

</button>



<button 
id="cancelBtn"
style="display:none;background:#777"

onclick="cancelEdit()">

取消编辑

</button>





<div id="message"

class="message">

</div>






<hr>



<h2>

文章管理

</h2>




<div id="articleList">

加载中...

</div>



</div>







<script>


// ========================
// Firebase配置
// ========================


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);




const auth =
firebase.auth();



const db =
firebase.firestore();



const storage =
firebase.storage();





let editId=null;


let images=[];



// ========================
// 编辑器功能
// ========================



function format(command){


document.execCommand(
command,
false,
null
);


}



function fontSize(size){


if(size){


document.execCommand(
"fontSize",
false,
size
);


}


}





function insertLink(){


let url=
prompt(
"请输入链接地址"
);



if(url){


document.execCommand(
"createLink",
false,
url
);


}


}






// ========================
// 登录检测
// ========================


auth.onAuthStateChanged(user=>{


if(!user){


window.location.href =
"admin-login.html";


}
else{


loadArticles();


}


});





// ========================
// 图片上传
// ========================


function chooseImage(){



let input =
document.createElement("input");



input.type="file";

input.accept="image/*";



input.click();





input.onchange=function(){



let file =
input.files[0];



if(!file){

return;

}




uploadImage(file);



};



}







function uploadImage(file){



let filename =

Date.now()+"_"+file.name;



let ref =

storage.ref(
"images/"+filename
);



let task =

ref.put(file);





task.on(
"state_changed",


snapshot=>{


let progress =

snapshot.bytesTransferred /

snapshot.totalBytes *
100;



document.getElementById(
"message"
)
.innerHTML=

"图片上传："

+progress.toFixed(0)

+"%";


},


error=>{


alert(
"图片上传失败："+error.message
);


},


()=>{


task.snapshot.ref
.getDownloadURL()

.then(url=>{



images.push(url);





document.execCommand(

"insertImage",

false,

url

);





document.getElementById(
"message"
)
.innerHTML=

"图片插入成功";


});



}



);



}






// ========================
// 保存文章
// ========================


function saveArticle(){



let title =

document.getElementById(
"title"
)
.value.trim();



let content =

document.getElementById(
"editor"
)
.innerHTML;





if(!title){


alert(
"请输入标题"
);


return;


}





let data={



title:title,


content:content,


cover:

images.length

?

images[0]

:

"",



images:images,



author:

"管理员",



time:

new Date()
.toLocaleString(
"zh-CN"
)



};






// 编辑


if(editId){



db.collection("articles")

.doc(editId)

.update(data)


.then(()=>{


alert(
"修改成功"
);



cancelEdit();



loadArticles();



});



}





// 新建


else{



db.collection("articles")

.add(data)


.then(()=>{


alert(
"发布成功"
);



clearEditor();



loadArticles();



});



}



}









// ========================
// 加载文章
// ========================


function loadArticles(){



db.collection("articles")

.orderBy(
"time",
"desc"
)

.get()


.then(snapshot=>{



let html="";




if(snapshot.empty){


html="暂无文章";


}





snapshot.forEach(doc=>{



let data=
doc.data();




html+=`

<div class="article-card">


${

data.cover

?

`

<img src="${data.cover}">

`

:

""

}



<h3>

${data.title}

</h3>



<p>

${data.time}

</p>



<button

class="edit"

onclick="editArticle('${doc.id}')">

编辑

</button>




<button

class="delete"

onclick="deleteArticle('${doc.id}')">

删除

</button>



</div>


`;



});






document.getElementById(
"articleList"
)
.innerHTML=html;



})


.catch(error=>{


document.getElementById(
"articleList"
)
.innerHTML=

"读取失败："

+error.message;



});



}







// ========================
// 编辑文章
// ========================


function editArticle(id){



db.collection("articles")

.doc(id)

.get()


.then(doc=>{



let data =
doc.data();



editId=id;



document.getElementById(
"title"
)
.value=data.title;



document.getElementById(
"editor"
)
.innerHTML=data.content;




images=data.images || [];



document.querySelector(
"button[onclick='saveArticle()']"
)
.innerHTML=

"保存修改";



document.getElementById(
"cancelBtn"
)
.style.display=

"inline-block";



window.scrollTo(
0,
0
);



});



}







// ========================
// 删除文章
// ========================


async function deleteArticle(id){



if(!confirm(
"确定删除文章？"
)){


return;


}





let doc =

await db.collection("articles")

.doc(id)

.get();





let data =
doc.data();






if(data.images){



for(let url of data.images){



try{


await storage
.refFromURL(url)
.delete();



}

catch(e){



console.log(
"图片删除失败"
);


}



}



}






await db.collection("articles")

.doc(id)

.delete();





alert(
"删除成功"
);



loadArticles();



}








// ========================
// 取消编辑
// ========================


function cancelEdit(){



editId=null;



clearEditor();



document.querySelector(
"button[onclick='saveArticle()']"
)
.innerHTML=

"发布文章";



document.getElementById(
"cancelBtn"
)
.style.display=

"none";



}






function clearEditor(){



document.getElementById(
"title"
)
.value="";



document.getElementById(
"editor"
)
.innerHTML="";



images=[];



}







// ========================
// 退出登录
// ========================


function logout(){



auth.signOut()

.then(()=>{


window.location.href=

"admin-login.html";


});


}


</script>


</body>

</html>
