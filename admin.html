<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">


<title>
博客管理后台
</title>


<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>



<style>


*{
box-sizing:border-box;
}


body{

margin:0;

background:#f5f6fa;

font-family:
"Microsoft YaHei";

}




.header{


background:white;

padding:15px;

position:sticky;

top:0;

z-index:10;

box-shadow:0 2px 8px rgba(0,0,0,.08);


}



.header-top{


display:flex;

justify-content:space-between;

align-items:center;


}



.header h1{


font-size:21px;

margin:0;


}



button{


padding:9px 14px;

border:0;

border-radius:20px;

cursor:pointer;

}




.blue{

background:#1677ff;

color:white;

}



.gray{

background:#eee;

}




.container{


padding:15px;


}





.search{


background:white;

padding:15px;

border-radius:12px;

margin:15px 0;


}




input{


width:100%;

padding:13px;

border:1px solid #ddd;

border-radius:25px;

font-size:16px;


}





.section-title{


font-size:20px;

font-weight:bold;

margin:25px 0 15px;


}





.card{


background:white;

padding:18px;

border-radius:12px;

margin-bottom:15px;


}




.title{


font-size:18px;

font-weight:bold;


}



.title a{


text-decoration:none;

color:#222;


}



.meta{


font-size:13px;

color:#888;

line-height:1.8;

margin-top:10px;


}



.tags{


color:#1677ff;

font-size:14px;


}



.summary{


font-size:14px;

color:#555;

line-height:1.7;

margin:10px 0;


}





.actions button{


margin-right:8px;

}





.edit{


background:#1677ff;

color:white;

}



.delete{


background:#e53935;

color:white;


}



.draft{


border-left:4px solid #ff9800;


}



.empty{


background:white;

padding:25px;

text-align:center;

color:#888;

border-radius:10px;

}



</style>

</head>







<body>



<div class="header">


<div class="header-top">


<h1>

博客管理

</h1>



<div>


<a href="index.html">


<button class="gray">

首页

</button>


</a>



<a href="admin-edit.html">


<button class="blue">

发布

</button>


</a>


</div>


</div>






<div class="search">


<input id="search"

placeholder="搜索标题或正文..."

oninput="searchArticle()">


</div>


</div>









<div class="container">



<div class="section-title">

已发布文章

</div>


<div id="published">

加载中...

</div>







<div class="section-title">

草稿箱

</div>



<div id="draft">

加载中...

</div>



</div>









<script>


const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"


};





firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();



const db =
firebase.firestore();





let allArticles=[];



auth.onAuthStateChanged(user=>{


if(!user){

location.href="admin-login.html";

}

else{


loadArticles();


}


});









function loadArticles(){



db.collection("articles")

.get()



.then(snapshot=>{


allArticles=[];



snapshot.forEach(doc=>{


allArticles.push({

id:doc.id,

...doc.data()

});


});





render();



})

.catch(e=>{


alert(
"加载失败："+e.message
);


});



}









function searchArticle(){



render();



}









function render(){



let key=

document.getElementById(
"search"
)

.value

.toLowerCase();





let list=allArticles.filter(a=>{



if(!key)

return true;





return (

a.title||""

).toLowerCase()

.includes(key)



||

(

a.content||""

).toLowerCase()

.includes(key);



});







let published=

list.filter(a=>

a.status==="published"

);



let drafts=

list.filter(a=>

a.status==="draft"

);






published.sort(sortTime);

drafts.sort(sortTime);





document.getElementById(
"published"
)

.innerHTML=

published.length

?

published.map(createPublished).join("")

:

"<div class='empty'>暂无文章</div>";






document.getElementById(
"draft"
)

.innerHTML=

drafts.length

?

drafts.map(createDraft).join("")

:

"<div class='empty'>暂无草稿</div>";



}









function createPublished(a){



return `


<div class="card">


<div class="title">


<a href="article.html?id=${a.id}">


${a.title}

</a>


</div>




<div class="meta">

发布时间：

${format(a.createTime)}

<br>

最后编辑：

${lastEdit(a.updateTime)}

</div>




<div class="tags">

标签：

${(a.tags||[]).join(" , ")}

</div>



<div class="summary">

${summary(a.content)}

</div>




<div class="actions">


<button class="edit"

onclick="edit('${a.id}')">

编辑

</button>


<button class="delete"

onclick="del('${a.id}')">

删除

</button>


</div>



</div>


`;



}









function createDraft(a){



return `


<div class="card draft">


<div class="title">


${a.title}


</div>



<div class="meta">

保存：

${lastEdit(a.updateTime)}

</div>



<div class="actions">


<button class="edit"

onclick="edit('${a.id}')">

继续编辑

</button>



<button class="delete"

onclick="del('${a.id}')">

删除

</button>



</div>


</div>



`;



}









function edit(id){


location.href=

"admin-edit.html?id="+id;


}








function del(id){


if(!confirm("确定删除？"))

return;



db.collection("articles")

.doc(id)

.delete()

.then(loadArticles);


}









function summary(md){


if(!md)return "";



return md

.replace(/#{1,6}\s/g,"")

.replace(/\*\*/g,"")

.replace(/\*/g,"")

.replace(/<[^>]+>/g,"")

.replace(/\n+/g," ")

.substring(0,100)

+"...";



}







function sortTime(a,b){


return (

b.createTime?.seconds||0

)

-

(

a.createTime?.seconds||0

);


}








function format(t){


if(t&&t.toDate){


return t.toDate()

.toLocaleString("zh-CN");


}


return "";

}








function lastEdit(arr){


if(arr&&arr.length)

return arr[arr.length-1];


return "";

}



</script>



</body>

</html>
