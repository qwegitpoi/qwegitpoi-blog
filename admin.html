<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
博客管理后台
</title>


<link rel="stylesheet" href="css/style.css">


<!-- Quill 富文本编辑器 -->

<link 
href="https://cdn.quilljs.com/1.3.7/quill.snow.css" 
rel="stylesheet">


<script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>



<!-- Firebase -->

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-storage-compat.js"></script>


<style>


body{

font-family:
Arial,
"Microsoft YaHei",
sans-serif;

background:#f5f6fa;

}



.header{

height:60px;

background:#333;

color:white;

display:flex;

align-items:center;

justify-content:space-between;

padding:0 30px;

}



.logo{

font-size:22px;

font-weight:bold;

}



button{

padding:8px 16px;

border:none;

background:#1976d2;

color:white;

border-radius:5px;

cursor:pointer;

}



button:hover{

opacity:.85;

}



.admin-container{

max-width:1000px;

margin:30px auto;

background:white;

padding:30px;

border-radius:10px;

}



input{

width:100%;

padding:12px;

font-size:18px;

margin-bottom:20px;

box-sizing:border-box;

}



#editor{

height:400px;

background:white;

margin-bottom:30px;

}



.article-card{

border:1px solid #ddd;

padding:15px;

margin:15px 0;

border-radius:8px;

}



.article-card img{

max-width:200px;

margin:10px 0;

}



.message{

color:#1976d2;

}



</style>


</head>




<body>



<header class="header">


<div class="logo">

博客管理后台

</div>


<div>


<button onclick="logout()">

退出登录

</button>


</div>


</header>






<div class="admin-container">



<h2>
文章编辑
</h2>




<input 
id="title"
placeholder="请输入文章标题">





<div id="editor"></div>





<button onclick="saveArticle()">

发布文章

</button>



<button 
id="cancelEditBtn"
onclick="cancelEdit()"
style="display:none;background:#777">

取消编辑

</button>




<p id="message" class="message"></p>




<hr>



<h2>

文章管理

</h2>



<div id="articleList">

加载中...

</div>



</div>







<script>


// Firebase 配置

const firebaseConfig = {


apiKey:
"AIzaSyA-8LCfJCnWFKuOZght5GYX-SATKw0goXk",


authDomain:
"qwegitpoi-blog.firebaseapp.com",


projectId:
"qwegitpoi-blog",


storageBucket:
"qwegitpoi-blog.firebasestorage.app",


messagingSenderId:
"313324557146",


appId:
"1:313324557146:web:4a93868894c9329006d963"

};



// 初始化 Firebase

firebase.initializeApp(firebaseConfig);



const auth =
firebase.auth();


const db =
firebase.firestore();


const storage =
firebase.storage();




// 当前编辑文章ID

let editId = null;


// 当前文章图片

let uploadImages = [];




// Quill 编辑器

const quill = new Quill(
"#editor",
{

theme:"snow",


modules:{


toolbar:{


container:[

[
"header",
1,
2
],


[
"bold",
"italic",
"underline"
],


[
"blockquote"
],


[
"list",
"ordered",
"bullet"
],


[
"link",
"image"
]


],


handlers:{


image:function(){

selectImage();

}


}



}



}


}
);




// 后续JS继续...

// ===============================
// 登录状态检查
// ===============================


auth.onAuthStateChanged(user=>{


    if(!user){

        location.href="admin-login.html";

    }
    else{

        loadArticles();

    }


});





// ===============================
// 图片上传
// ===============================


function selectImage(){


    let input=document.createElement("input");


    input.type="file";


    input.accept="image/*";


    input.click();



    input.onchange=()=>{


        let file=input.files[0];


        if(file){

            uploadImage(file);

        }


    };


}







function uploadImage(file){



    let filename=
    Date.now()+"_"+file.name;



    let storageRef=
    storage.ref(
        "images/"+filename
    );



    let uploadTask=
    storageRef.put(file);



    uploadTask.on(
        
        "state_changed",


        snapshot=>{


            let progress=
            snapshot.bytesTransferred /
            snapshot.totalBytes *
            100;


            document.getElementById("message")
            .innerHTML=
            "图片上传："+progress.toFixed(0)+"%";


        },


        error=>{


            alert(
                "上传失败："+error.message
            );


        },


        ()=>{


            uploadTask.snapshot.ref
            .getDownloadURL()
            .then(url=>{


                uploadImages.push(url);



                let range=
                quill.getSelection();



                if(range){


                    quill.insertEmbed(
                        range.index,
                        "image",
                        url
                    );


                }



                document.getElementById("message")
                .innerHTML=
                "图片上传完成";


            });



        }


    );



}







// ===============================
// 保存文章（新增/编辑）
// ===============================



function saveArticle(){



    let title=
    document.getElementById("title").value;



    let content=
    quill.root.innerHTML;



    if(!title){


        alert("请输入文章标题");

        return;

    }



    let articleData={


        title:title,


        content:content,


        images:uploadImages,


        cover:
        uploadImages.length>0
        ?
        uploadImages[0]
        :
        "",


        time:
        new Date()
        .toLocaleString("zh-CN"),


        author:"管理员"


    };





    // 编辑状态

    if(editId){



        db.collection("articles")
        .doc(editId)
        .update(articleData)


        .then(()=>{


            alert("修改成功");


            cancelEdit();


            loadArticles();


        });



    }



    // 新文章

    else{



        db.collection("articles")
        .add(articleData)


        .then(()=>{


            alert("发布成功");


            clearEditor();


            loadArticles();


        });



    }



}








// ===============================
// 加载文章列表
// ===============================


function loadArticles(){



    db.collection("articles")
    .orderBy("time","desc")
    .get()


    .then(snapshot=>{



        let html="";



        snapshot.forEach(doc=>{


            let data=
            doc.data();




            html+=`


            <div class="article-card">


            ${
                data.cover
                ?
                `<img src="${data.cover}">`
                :
                ""
            }



            <h3>

            ${data.title}

            </h3>



            <p>

            ${data.time}

            </p>



            <button onclick="editArticle('${doc.id}')">

            编辑

            </button>



            <button 
            style="background:#d32f2f"
            onclick="deleteArticle('${doc.id}')">

            删除

            </button>



            </div>


            `;



        });



        document.getElementById("articleList")
        .innerHTML=
        html
        ||
        "暂无文章";



    });



}








// ===============================
// 编辑文章
// ===============================


function editArticle(id){



    db.collection("articles")
    .doc(id)
    .get()


    .then(doc=>{


        if(!doc.exists){

            return;

        }



        let data=
        doc.data();



        editId=id;



        document.getElementById("title")
        .value=data.title;



        quill.root.innerHTML=
        data.content;



        uploadImages=
        data.images || [];




        document.querySelector(
            "button[onclick='saveArticle()']"
        )
        .innerHTML=
        "保存修改";



        document.getElementById(
            "cancelEditBtn"
        )
        .style.display="inline-block";



        window.scrollTo(
            0,
            0
        );



    });



}







// ===============================
// 取消编辑
// ===============================


function cancelEdit(){


    editId=null;


    clearEditor();



    document.querySelector(
        "button[onclick='saveArticle()']"
    )
    .innerHTML=
    "发布文章";



    document.getElementById(
        "cancelEditBtn"
    )
    .style.display="none";



}








function clearEditor(){


    document.getElementById("title")
    .value="";


    quill.setContents([]);


    uploadImages=[];


}







// ===============================
// 删除文章+删除图片
// ===============================


async function deleteArticle(id){



    if(
        !confirm(
            "确定删除这篇文章吗？"
        )
    ){

        return;

    }





    let docRef=
    db.collection("articles")
    .doc(id);



    let doc=
    await docRef.get();



    let data=
    doc.data();





    // 删除 Storage 图片


    if(data.images){


        for(
            let img of data.images
        ){


            try{


                let ref=
                storage.refFromURL(img);


                await ref.delete();



            }
            catch(e){


                console.log(
                    "图片删除失败",
                    e
                );


            }


        }


    }





    await docRef.delete();




    alert("删除完成");


    loadArticles();



}








// ===============================
// 退出登录
// ===============================


function logout(){


    auth.signOut()
    .then(()=>{


        location.href=
        "admin-login.html";


    });



}
